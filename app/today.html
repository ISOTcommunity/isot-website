  <style>
    /* Day strip — seven taps, the whole planning horizon in one row. */
    .day-strip {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
      margin-bottom: 16px; -webkit-overflow-scrolling: touch;
    }
    .day-strip::-webkit-scrollbar { display: none; }
    .day-pill {
      flex: 0 0 auto; min-width: 56px; padding: 8px 10px; border-radius: 12px;
      background: var(--bg-card); border: 1px solid var(--border-light);
      text-align: center; cursor: pointer; transition: border-color .15s, background .15s;
    }
    .day-pill.on { border-color: var(--pink); background: rgba(212,90,232,.12); }
    .day-pill-dow { font-size: .62rem; font-weight: 700; letter-spacing: .1em;
                    text-transform: uppercase; color: var(--text-dim); }
    .day-pill.on .day-pill-dow { color: var(--pink); }
    .day-pill-num { font-size: 1.05rem; font-weight: 700; color: #FFF; margin-top: 2px; }
    .day-pill-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--pink);
                    margin: 4px auto 0; }

    /* Status banner */
    .status-bar {
      border-radius: 14px; padding: 12px 14px; margin-bottom: 16px;
      border: 1px solid var(--border-light); background: var(--bg-card);
      display: flex; align-items: center; gap: 11px;
    }
    .status-bar.live   { border-color: rgba(67,219,143,.35); background: rgba(67,219,143,.10); }
    .status-bar.closed { border-color: rgba(255,255,255,.10); }
    .status-ico { font-size: 1.05rem; flex-shrink: 0; }
    .status-txt { font-size: .84rem; line-height: 1.45; color: var(--text-muted); }
    .status-txt strong { color: #FFF; }

    /* Winner */
    .winner {
      border-radius: 18px; padding: 18px; margin-bottom: 18px;
      border: 1px solid rgba(67,219,143,.35);
      background: linear-gradient(150deg, rgba(67,219,143,.12), var(--bg-card));
    }
    .winner-tag {
      font-size: .6rem; font-weight: 700; letter-spacing: .13em; text-transform: uppercase;
      color: var(--green); margin-bottom: 7px;
    }
    .winner-title { font-size: 1.2rem; font-weight: 700; color: #FFF; line-height: 1.2; }
    .winner-meta { font-size: .82rem; color: var(--text-muted); margin-top: 6px;
                   display: flex; flex-wrap: wrap; gap: 12px; }

    /* Proposal card */
    .prop {
      border-radius: 14px; padding: 14px; margin-bottom: 10px;
      background: var(--bg-card); border: 1px solid var(--border-light);
      display: flex; gap: 12px; align-items: flex-start;
    }
    .prop.mine  { border-color: rgba(212,90,232,.30); }
    .prop.lost  { opacity: .5; }
    .prop-body  { flex: 1; min-width: 0; }
    .prop-title { font-size: .96rem; font-weight: 700; color: #FFF; line-height: 1.3; }
    .prop-meta  { font-size: .76rem; color: var(--text-dim); margin-top: 4px; }
    .prop-desc  { font-size: .8rem; color: var(--text-muted); margin-top: 6px; line-height: 1.5; }

    /* Vote button doubles as the count, because the count IS the turnout. */
    .vote-btn {
      flex-shrink: 0; width: 60px; border-radius: 12px; padding: 9px 0;
      background: rgba(255,255,255,.05); border: 1px solid var(--border-light);
      color: var(--text-main); cursor: pointer; text-align: center;
      transition: border-color .15s, background .15s;
    }
    .vote-btn:hover:not(:disabled) { border-color: var(--pink); }
    .vote-btn.on { background: var(--pink); border-color: var(--pink); color: #FFF; }
    .vote-btn:disabled { opacity: .45; cursor: default; }
    .vote-n   { font-size: 1.15rem; font-weight: 700; line-height: 1; }
    .vote-lbl { font-size: .56rem; letter-spacing: .09em; text-transform: uppercase;
                margin-top: 3px; opacity: .75; }

    /* Chat */
    .chat-wrap { border-top: 1px solid var(--border-light); margin-top: 16px; padding-top: 14px; }
    .chat-list { max-height: 44vh; overflow-y: auto; display: flex; flex-direction: column;
                 gap: 10px; margin-bottom: 12px; }
    .msg { display: flex; gap: 9px; align-items: flex-start; }
    .msg-av { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; overflow: hidden; }
    .msg-b  { flex: 1; min-width: 0; }
    .msg-who  { font-size: .72rem; color: var(--text-dim); font-weight: 600; }
    .msg-time { font-size: .66rem; color: var(--text-dark); margin-left: 6px; font-weight: 400; }
    .msg-txt  { font-size: .87rem; color: var(--text-main); line-height: 1.45;
                margin-top: 2px; word-wrap: break-word; overflow-wrap: anywhere; }
    .chat-form { display: flex; gap: 8px; align-items: center; }
    /* app.css dresses .field input, not a bare input, so this one fell back to the
       browser default and rendered white on a dark card. */
    .chat-form input {
      flex: 1; min-width: 0;
      min-height: 44px; padding: 10px 14px;
      background: var(--bg-darker);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      font-family: var(--font-body); font-size: 0.92rem;
    }
    .chat-form input:focus {
      outline: none; border-color: var(--pink);
      box-shadow: 0 0 0 3px rgba(212, 90, 232, 0.15);
    }
    .chat-form button { flex: 0 0 auto; width: auto; padding: 0 16px; min-height: 44px; }

    /* Propose sheet */
    .sheet-bg {
      /* Above .tabbar, which is z-index 1000 — at 900 the bottom menu sat on top of the
         sheet and cut off the submit button. */
      position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 1200;
      backdrop-filter: blur(3px); display: flex; align-items: flex-end; justify-content: center;
    }
    .sheet {
      width: 100%; max-width: 560px; background: var(--bg-raised);
      border-radius: 20px 20px 0 0; padding: 20px 18px calc(22px + env(safe-area-inset-bottom, 0px));
      max-height: 90vh; overflow-y: auto; border-top: 1px solid var(--border-light);
    }
    .field { margin-bottom: 13px; }
    .field label {
      display: block; font-size: .7rem; font-weight: 700; letter-spacing: .09em;
      text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px;
    }
    .hint { font-size: .74rem; color: var(--text-dim); margin-top: 5px; line-height: 1.45; }
  </style>
</head>

  <script src="vendor/supabase.js"></script>
  <script src="js/isot.js"></script>

  <script>
    let meProfile = null;
    let selectedDate = null;      // 'YYYY-MM-DD' in Rome
    let boardRows = [];           // last daily_activity_board() result
    let places = [];              // city_places for the picker
    let chatTimer = null;
    // null, not '': an empty thread produces the key '', which would equal an '' sentinel
    // and make the first paint a no-op — leaving "Loading…" on screen forever.
    let lastChatKey = null;       // so we only repaint when messages change

    // Rome, not the device. A member in another timezone must see the same day as the city.
    function romeToday() {
      return new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Europe/Rome', year: 'numeric', month: '2-digit', day: '2-digit'
      }).format(new Date());
    }
    function addDays(iso, n) {
      const d = new Date(iso + 'T12:00:00Z');
      d.setUTCDate(d.getUTCDate() + n);
      return d.toISOString().slice(0, 10);
    }
    function hhmm(t) { return t ? String(t).slice(0, 5) : ''; }

    async function initToday() {
      meProfile = await requireAuth();
      document.getElementById('headerAvatar').innerHTML = renderUserAvatarHtml(meProfile, 36);

      selectedDate = romeToday();

      // Idempotent: the first member to open the app after the cutoff settles the day.
      // No cron, and calling it again costs nothing.
      try { await db.rpc('confirm_daily_activity', { p_date: null }); } catch (_) {}

      renderDayStrip();
      // Both, before anything can open the sheet: the place list is what the picker is
      // built from, and a deep link from the map opens that picker immediately.
      await Promise.all([loadPlaces(), refresh()]);

      document.getElementById('proposeBtn').addEventListener('click', () => openSheet());

      // Arriving from the map — either a place pin that is already mapped, or a spot the
      // member dropped a pin on themselves.
      const q = new URLSearchParams(location.search);
      const fromPlace = q.get('place');
      const lat = parseFloat(q.get('lat')), lng = parseFloat(q.get('lng'));
      const dropped = Number.isFinite(lat) && Number.isFinite(lng) ? { lat, lng } : null;
      if ((fromPlace || dropped) && !document.getElementById('proposeBtn').disabled) {
        openSheet(fromPlace, dropped);
      }
    }

    async function loadPlaces() {
      const { data } = await db
        .from('city_places')
        .select('id,name,kind')
        .eq('active', true)
        .order('kind').order('name');
      places = data || [];
    }

    function renderDayStrip() {
      const today = romeToday();
      const bar = document.getElementById('dayStrip');
      let html = '';
      for (let i = 0; i < 7; i++) {
        const iso = addDays(today, i);
        const d = new Date(iso + 'T12:00:00Z');
        const dow = i === 0 ? 'Today'
                  : d.toLocaleDateString('en-GB', { weekday: 'short', timeZone: 'UTC' });
        html += `
          <div class="day-pill ${iso === selectedDate ? 'on' : ''}" data-date="${iso}">
            <div class="day-pill-dow">${escapeHtml(dow)}</div>
            <div class="day-pill-num">${d.getUTCDate()}</div>
          </div>`;
      }
      bar.innerHTML = html;
      bar.querySelectorAll('.day-pill').forEach(p => {
        p.addEventListener('click', async () => {
          selectedDate = p.dataset.date;
          renderDayStrip();
          await refresh();
        });
      });
    }

    async function refresh() {
      const { data, error } = await db.rpc('daily_activity_board', { p_date: selectedDate });
      if (error) {
        document.getElementById('ballot').innerHTML =
          `<p class="dim" style="text-align:center;padding:20px">Could not load the day.</p>`;
        return;
      }
      boardRows = data || [];
      render();
    }

    function render() {
      // The function LEFT JOINs, so an empty day still returns one row carrying the
      // cutoff, the floor and the free slots — with a null id.
      const meta = boardRows[0] || {};
      const proposals = boardRows.filter(r => r.id);
      const winner = proposals.find(r => r.status === 'confirmed');

      document.getElementById('floorTxt').textContent = meta.vote_floor ?? 5;

      const slots = meta.slots_left ?? 5;
      document.getElementById('slotsLeft').textContent =
        slots > 0 ? `${slots} of ${meta.proposal_cap ?? 5} slots free` : 'Day is full';

      renderStatus(meta, proposals, winner);
      renderWinner(winner);
      renderBallot(proposals, meta, winner);

      const btn = document.getElementById('proposeBtn');
      const canPropose = meta.voting_open && slots > 0
                         && !proposals.some(p => p.proposed_by === meProfile.id);
      btn.disabled = !canPropose;
      btn.style.display = meta.voting_open ? '' : 'none';
      const myPending = proposals.find(p => p.proposed_by === meProfile.id
                                         && p.status === 'pending');
      if (myPending) {
        btn.innerHTML = '<i class="fa-solid fa-hourglass-half"></i> Yours is with the board';
      } else if (proposals.some(p => p.proposed_by === meProfile.id)) {
        btn.innerHTML = '<i class="fa-solid fa-check"></i> You proposed for this day';
      } else if (slots <= 0) {
        btn.innerHTML = '<i class="fa-solid fa-lock"></i> Day is full — vote for one instead';
      } else {
        btn.innerHTML = '<i class="fa-solid fa-plus"></i> Propose something';
      }
    }

    function renderStatus(meta, proposals, winner) {
      const el = document.getElementById('statusBar');
      const isToday = selectedDate === romeToday();
      let cls = '', ico = '', txt = '';

      if (winner) {
        cls = 'live'; ico = '<i class="fa-solid fa-circle-check text-green"></i>';
        txt = isToday ? '<strong>It is on.</strong> Chat is open below.'
                      : '<strong>Confirmed</strong> for this day.';
      } else if (meta.voting_open) {
        ico = '<i class="fa-solid fa-hourglass-half text-pink"></i>';
        const need = meta.vote_floor ?? 5;
        // A pending proposal is not on the ballot, so it cannot be "the leader".
        const live = proposals.filter(p => p.status !== 'pending');
        const held = proposals.length - live.length;
        const top = live.length ? Math.max(...live.map(p => Number(p.votes))) : 0;
        txt = live.length
          ? `Voting until <strong>14:00</strong>. Leader has <strong>${top}</strong> of ${need} votes needed.`
          : held
            ? `Voting until <strong>14:00</strong>. Yours is with the board — nothing on the ballot yet.`
            : `Voting until <strong>14:00</strong>. Nothing proposed yet — be the first.`;
      } else {
        cls = 'closed'; ico = '<i class="fa-solid fa-moon" style="color:var(--text-dim)"></i>';
        txt = proposals.length
          ? 'Voting closed. Nothing reached the minimum, so no activity today.'
          : 'Voting closed and nothing was proposed for this day.';
      }

      if (meta.latest_start) {
        txt += `<br><span style="font-size:.76rem;opacity:.75">Must start before
                ${hhmm(meta.latest_start)} — the ISOT night begins then.</span>`;
      }
      el.innerHTML = `<div class="status-bar ${cls}">
          <span class="status-ico">${ico}</span><div class="status-txt">${txt}</div></div>`;
    }

    function renderWinner(w) {
      const box = document.getElementById('winnerBox');
      if (!w) {
        box.innerHTML = '';
        if (chatTimer) { clearInterval(chatTimer); chatTimer = null; }
        return;
      }
      const canPost = selectedDate >= romeToday();
      box.innerHTML = `
        <div class="winner">
          <div class="winner-tag"><i class="fa-solid fa-bolt"></i> Confirmed &middot; ${w.votes} coming</div>
          <div class="winner-title">${escapeHtml(w.title)}</div>
          <div class="winner-meta">
            <span><i class="fa-regular fa-clock"></i> ${hhmm(w.start_time)}</span>
            ${w.place_name ? `<span><i class="fa-solid fa-location-dot"></i> ${escapeHtml(w.place_name)}</span>` : ''}
            ${w.proposer_name ? `<span><i class="fa-regular fa-user"></i> ${escapeHtml(w.proposer_name)}</span>` : ''}
          </div>
          ${w.description ? `<div class="prop-desc">${escapeHtml(w.description)}</div>` : ''}
          ${w.lat ? `<a href="https://www.google.com/maps/dir/?api=1&destination=${w.lat},${w.lng}"
             target="_blank" rel="noopener" class="btn btn-outline"
             style="width:auto;padding:6px 14px;font-size:.78rem;margin-top:12px;display:inline-flex">
             Directions &rarr;</a>` : ''}

          <div class="chat-wrap">
            <div class="eyebrow" style="margin-bottom:10px">
              <i class="fa-regular fa-comments"></i> Chat
            </div>
            <div class="chat-list" id="chatList">
              <p class="dim" style="font-size:.8rem">Loading…</p>
            </div>
            ${canPost ? `
              <form class="chat-form" id="chatForm" autocomplete="off">
                <input type="text" id="chatInput" maxlength="600" placeholder="Say something…" />
                <button type="submit" class="btn btn-pink" style="width:auto;padding:0 16px;">
                  <i class="fa-solid fa-paper-plane"></i>
                </button>
              </form>` : `<p class="dim" style="font-size:.78rem">This day is over — chat is read-only.</p>`}
          </div>
        </div>`;

      if (canPost) {
        document.getElementById('chatForm').addEventListener('submit', e => sendMessage(e, w.id));
      }
      // Switching days rebuilds the thread element, so the previous day's key must not
      // suppress the first paint of this one.
      lastChatKey = null;
      loadChat(w.id);
      if (chatTimer) clearInterval(chatTimer);
      // Polling, not realtime: the thread is tiny and scoped to one day, and a poll cannot
      // silently do nothing the way an un-enabled realtime channel can.
      chatTimer = setInterval(() => loadChat(w.id), 5000);
    }

    async function loadChat(proposalId) {
      // Via the function, not the table: profiles_read only lets a member read their own
      // profile, so a PostgREST embed would render everyone else as an anonymous "Member".
      const { data, error } = await db.rpc('activity_chat', { p_proposal_id: proposalId });

      const list = document.getElementById('chatList');
      if (!list) return;
      if (error) { list.innerHTML = `<p class="dim" style="font-size:.8rem">Chat unavailable.</p>`; return; }

      const rows = data || [];
      const key = rows.map(r => r.id).join(',');
      if (key === lastChatKey) return;      // nothing new, leave the scroll alone
      lastChatKey = key;

      if (!rows.length) {
        list.innerHTML = `<p class="dim" style="font-size:.8rem">No messages yet. Say hello.</p>`;
        return;
      }

      list.innerHTML = rows.map(m => {
        // activity_chat() returns the author flat alongside the message.
        const p = { full_name: m.full_name, avatar_url: m.avatar_url, member_code: m.member_code };
        const t = new Date(m.created_at).toLocaleTimeString('en-GB',
                    { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Rome' });
        return `<div class="msg">
            <div class="msg-av">${renderUserAvatarHtml(p, 30)}</div>
            <div class="msg-b">
              <div class="msg-who">${escapeHtml(p.full_name || 'Member')}<span class="msg-time">${t}</span></div>
              <div class="msg-txt">${escapeHtml(m.body)}</div>
            </div>
          </div>`;
      }).join('');
      list.scrollTop = list.scrollHeight;
    }

    async function sendMessage(e, proposalId) {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      const body = input.value.trim();
      if (!body) return;
      input.value = '';
      const { error } = await db.from('activity_messages')
        .insert({ proposal_id: proposalId, author_id: meProfile.id, body });
      if (error) { input.value = body; alert('Could not send that message.'); return; }
      lastChatKey = null;
      loadChat(proposalId);
    }

    function renderBallot(proposals, meta, winner) {
      const el = document.getElementById('ballot');
      const others = proposals.filter(p => !winner || p.id !== winner.id);

      document.getElementById('ballotHead').textContent =
        winner ? 'Also proposed' : 'On the ballot';

      if (!others.length) {
        el.innerHTML = winner ? ''
          : `<p class="dim" style="text-align:center;padding:22px 10px;font-size:.85rem">
               Nothing proposed for this day yet.</p>`;
        return;
      }

      el.innerHTML = others.map(p => {
        const mine = p.proposed_by === meProfile.id;
        // Only the author can see their own pending proposal. It is not on the ballot yet,
        // so it gets a waiting badge instead of a vote button.
        const waiting = p.status === 'pending';
        const canVote = meta.voting_open && !waiting;
        return `
          <div class="prop ${mine ? 'mine' : ''} ${p.status === 'lost' ? 'lost' : ''}">
            <div class="prop-body">
              <div class="prop-title">${escapeHtml(p.title)}</div>
              <div class="prop-meta">
                ${hhmm(p.start_time)}
                ${p.place_name ? ' &middot; ' + escapeHtml(p.place_name) : ''}
                ${p.proposer_name ? ' &middot; ' + escapeHtml(p.proposer_name) : ''}
                ${mine ? ' &middot; <span style="color:var(--pink)">yours</span>' : ''}
              </div>
              ${p.description ? `<div class="prop-desc">${escapeHtml(p.description)}</div>` : ''}
              ${waiting ? `<div style="font-size:.74rem;color:#E8C870;margin-top:6px">
                  <i class="fa-solid fa-hourglass-half"></i>
                  Waiting for the board — nobody else can see it yet.</div>` : ''}
            </div>
            ${waiting ? `
              <div class="vote-btn" style="opacity:.5;cursor:default">
                <div class="vote-n"><i class="fa-solid fa-hourglass-half"
                     style="font-size:.9rem"></i></div>
                <div class="vote-lbl">held</div>
              </div>`
            : `
              <button type="button" class="vote-btn ${p.i_voted ? 'on' : ''}"
                      data-id="${p.id}" ${canVote ? '' : 'disabled'}>
                <div class="vote-n">${p.votes}</div>
                <div class="vote-lbl">${p.i_voted ? 'going' : 'join'}</div>
              </button>`}
          </div>`;
      }).join('');

      el.querySelectorAll('.vote-btn').forEach(b => {
        b.addEventListener('click', () => castVote(b.dataset.id, b));
      });
    }

    async function castVote(proposalId, btn) {
      btn.disabled = true;
      const row = boardRows.find(r => r.id === proposalId);
      // Clicking the one you already back withdraws you, so "I changed my mind" is
      // one tap and not a dead end.
      const { error } = row && row.i_voted
        ? await db.rpc('unvote_activity', { p_date: selectedDate })
        : await db.rpc('vote_activity',   { p_proposal_id: proposalId });
      if (error) alert(error.message || 'Could not register that vote.');
      await refresh();
    }

    /* ── Propose sheet ───────────────────────────────────────────────── */
    function openSheet(preselectPlaceId, droppedPin) {
      const meta = boardRows[0] || {};
      const latest = meta.latest_start ? hhmm(meta.latest_start) : null;

      const grouped = {};
      places.forEach(p => { (grouped[p.kind] || (grouped[p.kind] = [])).push(p); });
      const KIND = { sport: 'Courts & sport', mensa: 'Canteens', mensa_alt: 'Canteens',
                     museum: 'Museums', campus: 'Campus' };
      const opts = Object.entries(grouped).map(([k, list]) =>
        `<optgroup label="${escapeHtml(KIND[k] || k)}">` +
        list.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('') +
        `</optgroup>`).join('');

      const wrap = document.createElement('div');
      wrap.className = 'sheet-bg';
      wrap.innerHTML = `
        <div class="sheet" role="dialog" aria-label="Propose an activity">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
            <h2 style="font-size:1.05rem;margin:0">Propose an activity or gathering</h2>
            <button type="button" id="sheetClose"
                    style="background:none;border:none;color:var(--text-dim);font-size:1.2rem;cursor:pointer">
              <i class="fa-solid fa-xmark"></i></button>
          </div>

          <div id="sheetAlert"></div>

          <form id="proposeForm" autocomplete="off">
            <div class="field">
              <label for="pTitle">What is it</label>
              <input type="text" id="pTitle" maxlength="80" required
                     placeholder="Bouldering at the wall" />
            </div>

            <div class="field">
              <label for="pTime">Start time</label>
              <input type="time" id="pTime" required />
              ${latest ? `<div class="hint">Must start before <strong>${latest}</strong> —
                          the ISOT night begins then.</div>` : ''}
            </div>

            <div class="field">
              <label for="${droppedPin ? 'pLabel' : 'pPlace'}">Where</label>

              ${droppedPin ? `
                <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;
                            border-radius:10px;margin-bottom:8px;
                            background:rgba(67,219,143,.10);border:1px solid rgba(67,219,143,.32)">
                  <i class="fa-solid fa-location-dot" style="color:#43DB8F"></i>
                  <div style="font-size:.8rem;line-height:1.35">
                    <strong style="color:#FFF">Pinned on the map</strong><br>
                    <span class="dim" style="font-size:.72rem">
                      ${droppedPin.lat.toFixed(5)}, ${droppedPin.lng.toFixed(5)}</span>
                  </div>
                  <a href="partner.html" style="margin-left:auto;font-size:.74rem;color:var(--pink)">
                    Change</a>
                </div>
                <input type="text" id="pLabel" maxlength="80" required
                       placeholder="What is this place called?" />
                <div class="hint">Give it a name so people know where they are going.</div>
              ` : `
                <select id="pPlace">
                  <option value="">— Somewhere else —</option>
                  ${opts}
                </select>
                <input type="text" id="pLabel" maxlength="80" style="margin-top:8px"
                       placeholder="Name the place" />
                <div class="hint">Pick a spot from the map, or drop a pin from the
                  <a href="partner.html" style="color:var(--pink)">map page</a>.</div>
              `}
            </div>

            <div class="field">
              <label for="pDesc">Anything to add <span style="opacity:.6">(optional)</span></label>
              <textarea id="pDesc" rows="2" maxlength="400"
                        placeholder="Bring shoes. Meeting at the entrance."></textarea>
            </div>

            <button type="submit" class="btn btn-pink" id="pSubmit" style="width:100%;margin-top:6px">
              Propose &amp; count me in
            </button>
            <p class="dim" style="font-size:.74rem;margin-top:10px;line-height:1.45">
              The board checks it first, then it goes on the ballot. Proposing counts as
              your vote — you are saying you will be there.
            </p>
          </form>
        </div>`;
      document.body.appendChild(wrap);

      const close = () => wrap.remove();
      wrap.addEventListener('click', e => { if (e.target === wrap) close(); });
      wrap.querySelector('#sheetClose').addEventListener('click', close);

      // Free-text place only matters when no mapped place is chosen.
      // sel is absent in dropped-pin mode — the pin already answers "where".
      const sel = wrap.querySelector('#pPlace'), lbl = wrap.querySelector('#pLabel');
      if (sel) {
        // Only honour a place that is really in the list, so a stale or hand-typed ?place=
        // falls back to the free-text field instead of silently selecting nothing.
        if (preselectPlaceId && places.some(p => p.id === preselectPlaceId)) {
          sel.value = preselectPlaceId;
        }
        const syncLabel = () => { lbl.style.display = sel.value ? 'none' : ''; };
        sel.addEventListener('change', syncLabel); syncLabel();
      }

      // With the place settled, the next thing to fill is the title.
      setTimeout(() => wrap.querySelector('#pTitle')?.focus(), 60);

      wrap.querySelector('#proposeForm').addEventListener('submit', async e => {
        e.preventDefault();
        const btn = wrap.querySelector('#pSubmit');
        const alertBox = wrap.querySelector('#sheetAlert');
        const placeId = sel ? (sel.value || null) : null;
        const label = lbl.value.trim();

        if (!placeId && !label) {
          setAlert(alertBox, droppedPin
            ? 'Give the spot a name so people know where they are going.'
            : 'Pick a place from the map or type where it is.');
          return;
        }
        const done = busy(btn, 'Proposing…');
        const { data, error } = await db.rpc('propose_activity', {
          p_date:        selectedDate,
          p_title:       wrap.querySelector('#pTitle').value.trim(),
          p_start_time:  wrap.querySelector('#pTime').value,
          p_description: wrap.querySelector('#pDesc').value.trim() || null,
          p_place_id:    placeId,
          p_place_label: placeId ? null : label,
          // Only meaningful without a mapped place; the server ignores it otherwise.
          p_lat:         !placeId && droppedPin ? droppedPin.lat : null,
          p_lng:         !placeId && droppedPin ? droppedPin.lng : null
        });
        if (typeof done === 'function') done();
        if (error) { setAlert(alertBox, error.message || 'Could not post that.'); return; }
        close();
        await refresh();
      });
    }

    initToday();
  </script>
</body>
</html>
