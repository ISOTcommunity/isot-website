<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>ISOT KJ Host Controller</title>

  <link rel="icon" href="../assets/LOGOS/scritta isot.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="css/app.css" />

  <style>
    .kj-hero-card {
      background: linear-gradient(135deg, #1E293B, #0F172A);
      border: 2px solid var(--pink);
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      margin-bottom: 24px;
      box-shadow: 0 12px 30px rgba(238, 9, 121, 0.2);
    }
    .kj-song-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      transition: var(--transition-fast);
    }
    .kj-song-card.now-playing {
      border-color: #10B981;
      background: rgba(16, 185, 129, 0.12);
    }
    .big-tap-btn {
      min-height: 52px;
      padding: 14px 22px;
      font-size: 1.05rem;
      font-weight: 700;
      border-radius: 14px;
    }
  </style>
</head>
<body>

  <div id="gate"><div class="spinner"></div></div>

  <!-- Top Bar -->
  <header class="topbar">
    <a href="home.html" class="topbar-title" style="display: flex; align-items: center; gap: 8px;">
      <i class="fa-solid fa-sliders text-pink"></i>
      <span>KJ Host Controller</span>
    </a>
    <div style="display: flex; align-items: center; gap: 10px;">
      <span class="badge badge-staff">VOLUNTEER BOOTH</span>
      <button type="button" id="burgerBtn" aria-label="Account menu" style="background: transparent; border: none; color: #FFF; font-size: 1.3rem; cursor: pointer; padding: 6px;">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
  </header>

  <main class="shell" style="max-width: 500px;">

    <div id="alertBox"></div>

    <!-- Active Stage Hero Controller -->
    <div class="kj-hero-card">
      <div class="eyebrow"><i class="fa-solid fa-circle-play text-pink"></i> NOW ON STAGE</div>
      
      <h1 style="font-size: 2.1rem; color: #FFF; margin-top: 6px; line-height: 1.2;" id="nowPlayingTitle">No song playing</h1>
      <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 6px;" id="nowPlayingSinger">Singer: Stage Empty</p>

      <div style="display: flex; gap: 10px; margin-top: 20px; justify-content: center;">
        <button type="button" onclick="markDoneAndNext()" class="btn btn-pink big-tap-btn" id="nextBtn" style="flex: 1;">
          <i class="fa-solid fa-circle-check"></i> Mark Sung &amp; Next Singer →
        </button>
      </div>
    </div>

    <!-- Manual Add Song Form for Walk-ups -->
    <div class="card card-glass" style="margin-bottom: 20px;">
      <h3 style="font-size: 1rem; margin-bottom: 12px;"><i class="fa-solid fa-plus text-pink" style="margin-right: 6px;"></i> Add Walk-Up Singer</h3>
      <form id="manualAddForm" onsubmit="addManualSinger(event)" style="display: flex; gap: 10px;">
        <input type="text" id="walkupSong" placeholder="Song & Singer (e.g. Volare - Marco)" required style="flex: 1;" />
        <button type="submit" class="btn btn-outline" style="width: auto; padding: 0 16px;">Add</button>
      </form>
    </div>

    <!-- Up Next Queue Lineup -->
    <div class="card card-glass">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
        <h2 style="font-size: 1.1rem; color: #FFF; margin: 0;"><i class="fa-solid fa-list-ol text-gold" style="margin-right: 8px;"></i> Stage Queue</h2>
        <span class="dim" style="font-size: 0.8rem;" id="queueCount">0 pending</span>
      </div>

      <div id="kjQueueList">
        <div class="dim" style="text-align: center; padding: 20px;">Loading stage queue...</div>
      </div>
    </div>

  </main>

  <script src="vendor/supabase.js"></script>
  <script src="js/isot.js"></script>

  <script>
    let pollTimer = null;
    let localKjQueue = [
      { id: '101', song_title: 'Dancing Queen', singer_name: 'Maria', status: 'playing' },
      { id: '102', song_title: 'Wonderwall', singer_name: 'Alex', status: 'pending' },
      { id: '103', song_title: 'Volare', singer_name: 'Marco', status: 'pending' }
    ];

    async function initKjController() {
      await requireAuth({ staff: true });
      fetchQueue();
      pollTimer = setInterval(fetchQueue, 3000);
    }

    async function fetchQueue() {
      try {
        const { data, error } = await db
          .from('karaoke_slots')
          .select('*')
          .in('status', ['playing', 'pending'])
          .order('created_at', { ascending: true });

        if (!error && data && data.length) {
          localKjQueue = data;
        }
      } catch (e) {}

      renderKjUI();
    }

    function renderKjUI() {
      const playingSlot = localKjQueue.find(s => s.status === 'playing');
      const pendingSlots = localKjQueue.filter(s => s.status === 'pending');

      // Hero
      if (playingSlot) {
        document.getElementById('nowPlayingTitle').textContent = playingSlot.song_title;
        document.getElementById('nowPlayingSinger').textContent = `Singer: ${playingSlot.singer_name || 'Member'}`;
      } else if (pendingSlots.length) {
        document.getElementById('nowPlayingTitle').textContent = 'Ready to start';
        document.getElementById('nowPlayingSinger').textContent = `Next up: ${pendingSlots[0].singer_name} ("${pendingSlots[0].song_title}")`;
      } else {
        document.getElementById('nowPlayingTitle').textContent = 'No song playing';
        document.getElementById('nowPlayingSinger').textContent = 'Stage Empty • Waiting for singers';
      }

      document.getElementById('queueCount').textContent = `${pendingSlots.length} pending`;
      const container = document.getElementById('kjQueueList');

      if (!pendingSlots.length) {
        container.innerHTML = '<div class="dim" style="text-align:center;padding:20px">No pending songs in queue.</div>';
        return;
      }

      container.innerHTML = pendingSlots.map((item, idx) => `
        <div class="kj-song-card">
          <div style="flex:1;min-width:0">
            <div style="font-size:0.75rem;color:var(--pink);font-weight:700">#${idx + 1} UP NEXT</div>
            <div style="font-weight:700;color:#FFF;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(item.song_title)}</div>
            <div class="dim" style="font-size:0.85rem">${escapeHtml(item.singer_name || 'Member')}</div>
          </div>
          <div style="display:flex;gap:6px">
            <button type="button" onclick="playNow('${item.id}')" class="btn btn-outline" style="width:auto;padding:8px 12px;font-size:0.8rem;color:var(--green);border-color:rgba(16,185,129,0.4)">
              <i class="fa-solid fa-play"></i> Play
            </button>
            <button type="button" onclick="removeSlot('${item.id}')" class="btn btn-outline" style="width:auto;padding:8px 12px;font-size:0.8rem;color:#FCA5A5;border-color:rgba(239,68,68,0.4)">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        </div>
      `).join('');
    }

    async function markDoneAndNext() {
      const playingSlot = localKjQueue.find(s => s.status === 'playing');
      const pendingSlots = localKjQueue.filter(s => s.status === 'pending');

      if (playingSlot) {
        playingSlot.status = 'done';
        try {
          await db.from('karaoke_slots').update({ status: 'done', performed_at: new Date().toISOString() }).eq('id', playingSlot.id);
        } catch (e) {}
      }

      if (pendingSlots.length) {
        const nextSlot = pendingSlots[0];
        nextSlot.status = 'playing';
        try {
          await db.from('karaoke_slots').update({ status: 'playing' }).eq('id', nextSlot.id);
        } catch (e) {}
        setAlert(document.getElementById('alertBox'), `Advanced to next song: "${nextSlot.song_title}"!`, 'success');
      } else {
        setAlert(document.getElementById('alertBox'), 'Stage finished! No more pending songs in queue.', 'info');
      }

      localKjQueue = localKjQueue.filter(s => s.status !== 'done');
      renderKjUI();
    }

    async function playNow(id) {
      localKjQueue.forEach(s => { if (s.status === 'playing') s.status = 'done'; });
      const target = localKjQueue.find(s => s.id === id);
      if (target) {
        target.status = 'playing';
        try {
          await db.from('karaoke_slots').update({ status: 'playing' }).eq('id', id);
        } catch (e) {}
      }
      localKjQueue = localKjQueue.filter(s => s.status !== 'done');
      renderKjUI();
    }

    async function removeSlot(id) {
      localKjQueue = localKjQueue.filter(s => s.id !== id);
      try {
        await db.from('karaoke_slots').update({ status: 'skipped' }).eq('id', id);
      } catch (e) {}
      renderKjUI();
    }

    async function addManualSinger(e) {
      e.preventDefault();
      const val = document.getElementById('walkupSong').value.trim();
      if (!val) return;

      const newSlot = {
        id: 'walkup-' + Date.now(),
        song_title: val,
        singer_name: 'Walk-up Singer',
        status: 'pending',
        created_at: new Date().toISOString()
      };

      try {
        await db.from('karaoke_slots').insert([{
          song_title: val,
          singer_name: 'Walk-up Singer',
          status: 'pending'
        }]);
      } catch (e) {}

      localKjQueue.push(newSlot);
      document.getElementById('walkupSong').value = '';
      renderKjUI();
    }

    document.addEventListener('DOMContentLoaded', initKjController);
  </script>
</body>
</html>
