  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>ISOT KJ Host Controller</title>

  <link rel="icon" href="../assets/LOGOS/scritta isot.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="css/app.css" />

  <style>
    .kj-hero-card {
      background: linear-gradient(135deg, #1E293B, #0F172A);
      border: 2px solid var(--pink);
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      margin-bottom: 24px;
      box-shadow: 0 12px 30px rgba(238, 9, 121, 0.2);
    }
    .kj-song-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      transition: var(--transition-fast);
    }
    .kj-song-card.now-playing {
      border-color: #10B981;
      background: rgba(16, 185, 129, 0.12);
    }
    .big-tap-btn {
      min-height: 52px;
      padding: 14px 22px;
      font-size: 1.05rem;
      font-weight: 700;
      border-radius: 14px;
    }
  </style>
</head>
<body>

  <div id="gate"><div class="spinner"></div></div>

  <!-- Top Bar -->
  <header class="topbar">
    <a href="home.html" class="topbar-title" style="display: flex; align-items: center; gap: 8px;">
      <i class="fa-solid fa-sliders text-pink"></i>
      <span>KJ Host Controller</span>
    </a>
    <div style="display: flex; align-items: center; gap: 10px;">
      <span class="badge badge-staff">VOLUNTEER BOOTH</span>
      <button type="button" id="burgerBtn" aria-label="Account menu" style="background: transparent; border: none; color: #FFF; font-size: 1.3rem; cursor: pointer; padding: 6px;">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
  </header>

  <main class="shell" style="max-width: 500px;">

    <div id="alertBox"></div>

    <!-- Active Stage Hero Controller -->
    <div class="kj-hero-card">
      <div class="eyebrow"><i class="fa-solid fa-circle-play text-pink"></i> NOW ON STAGE</div>
      
      <h1 style="font-size: 2.1rem; color: #FFF; margin-top: 6px; line-height: 1.2;" id="nowPlayingTitle">No song playing</h1>
      <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 6px;" id="nowPlayingSinger">Singer: Stage Empty</p>

      <div style="display: flex; gap: 10px; margin-top: 20px; justify-content: center;">
        <button type="button" onclick="markDoneAndNext()" class="btn btn-pink big-tap-btn" id="nextBtn" style="flex: 1;">
          <i class="fa-solid fa-circle-check"></i> Mark Sung &amp; Next Singer →
        </button>
      </div>
    </div>

    <!-- Manual Add Song Form for Walk-ups -->
    <div class="card card-glass" style="margin-bottom: 20px;">
      <h3 style="font-size: 1rem; margin-bottom: 12px;"><i class="fa-solid fa-plus text-pink" style="margin-right: 6px;"></i> Add Walk-Up Singer</h3>
      <form id="manualAddForm" onsubmit="addManualSinger(event)" style="display: flex; gap: 10px;">
        <input type="text" id="walkupSong" placeholder="Song & Singer (e.g. Volare - Marco)" required style="flex: 1;" />
        <button type="submit" class="btn btn-outline" style="width: auto; padding: 0 16px;">Add</button>
      </form>
    </div>

    <!-- Up Next Queue Lineup -->
    <div class="card card-glass">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
        <h2 style="font-size: 1.1rem; color: #FFF; margin: 0;"><i class="fa-solid fa-list-ol text-gold" style="margin-right: 8px;"></i> Stage Queue</h2>
        <span class="dim" style="font-size: 0.8rem;" id="queueCount">0 pending</span>
      </div>

      <div id="kjQueueList">
        <div class="dim" style="text-align: center; padding: 20px;">Loading stage queue...</div>
      </div>
    </div>

  </main>

  <script src="vendor/supabase.js"></script>
  <script src="js/isot.js"></script>

  <script>
    let pollTimer = null;
    // Was a hardcoded queue of invented singers kept in memory. Every database call
    // referenced columns that do not exist, so the KJ screen showed a fictional line-up
    // and "Mark done" changed nothing anyone else could see.
    let kjQueue = [];
    let tonight = null;

    async function initKjController() {
      await requireAuth({ staff: true });

      const { data, error } = await db.rpc('tonight_karaoke');
      if (error) console.error('Could not resolve tonight:', error.message);
      tonight = data || { open: false };

      if (!tonight.open) {
        const box = document.getElementById('alertBox');
        setAlert(box, tonight.reason || 'No karaoke tonight — nothing to run.', 'info');
        renderKjUI();
        return;
      }

      await fetchQueue();
      pollTimer = setInterval(fetchQueue, 5000);
    }

    async function fetchQueue() {
      if (!tonight?.open) return;

      const { data, error } = await db.rpc('karaoke_queue', { p_instance: tonight.instance_id });
      if (error) {
        // Was an empty catch, so a broken queue looked identical to an empty one.
        setAlert(document.getElementById('alertBox'), 'Could not load the queue: ' + error.message, 'error');
        return;
      }

      // The page speaks 'playing'/'pending'; the schema says 'performing'/'queued'.
      kjQueue = (data || []).map(r => ({
        ...r,
        artist_name: r.song_artist,
        position: r.queue_position,
        status: r.status === 'performing' ? 'playing' : 'pending',
      }));

      renderKjUI();
    }

    function renderKjUI() {
      const playingSlot = kjQueue.find(s => s.status === 'playing');
      const pendingSlots = kjQueue.filter(s => s.status === 'pending');

      // Hero
      if (playingSlot) {
        document.getElementById('nowPlayingTitle').textContent = playingSlot.song_title;
        document.getElementById('nowPlayingSinger').textContent = `Artist: ${escapeHtml(playingSlot.artist_name || 'Original Artist')} • Singer: ${escapeHtml(playingSlot.singer_name || 'Member')}`;
      } else if (pendingSlots.length) {
        document.getElementById('nowPlayingTitle').textContent = 'Ready to start';
        document.getElementById('nowPlayingSinger').textContent = `Next up: ${escapeHtml(pendingSlots[0].singer_name)} ("${escapeHtml(pendingSlots[0].song_title)}" by ${escapeHtml(pendingSlots[0].artist_name || 'Artist')})`;
      } else {
        document.getElementById('nowPlayingTitle').textContent = 'No song playing';
        document.getElementById('nowPlayingSinger').textContent = 'Stage Empty • Waiting for singers';
      }

      document.getElementById('queueCount').textContent = `${pendingSlots.length} pending`;
      const container = document.getElementById('kjQueueList');

      if (!pendingSlots.length) {
        container.innerHTML = '<div class="dim" style="text-align:center;padding:20px">No pending songs in queue.</div>';
        return;
      }

      container.innerHTML = pendingSlots.map((item, idx) => `
        <div class="kj-song-card">
          <div style="flex:1;min-width:0">
            <div style="font-size:0.75rem;color:var(--pink);font-weight:700">#${idx + 1} UP NEXT</div>
            <div style="font-weight:700;color:#FFF;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(item.song_title)}</div>
            <div class="dim" style="font-size:0.85rem">Artist: ${escapeHtml(item.artist_name || 'Original Artist')} • Performed by ${escapeHtml(item.singer_name || 'Member')}</div>
          </div>
          <div style="display:flex;gap:6px">
            <button type="button" onclick="playNow('${item.id}')" class="btn btn-outline" style="width:auto;padding:8px 12px;font-size:0.8rem;color:var(--green);border-color:rgba(16,185,129,0.4)">
              <i class="fa-solid fa-play"></i> Play
            </button>
            <button type="button" onclick="removeSlot('${item.id}')" class="btn btn-outline" style="width:auto;padding:8px 12px;font-size:0.8rem;color:#FCA5A5;border-color:rgba(239,68,68,0.4)">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        </div>
      `).join('');
    }

    async function markDoneAndNext() {
      const box = document.getElementById('alertBox');
      // One call: karaoke_next marks whoever is performing as done and promotes the next
      // singer in a single statement, so the "one performing per night" index always
      // holds. Two separate updates could briefly leave two performers or none.
      const { data, error } = await db.rpc('karaoke_next', { p_instance: tonight.instance_id });

      if (error) { setAlert(box, 'Could not advance: ' + error.message, 'error'); return; }

      await fetchQueue();
      const nowPlaying = kjQueue.find(s => s.status === 'playing');
      setAlert(box, nowPlaying
        ? `Up now: "${escapeHtml(nowPlaying.song_title)}" — ${escapeHtml(nowPlaying.singer_name)}`
        : 'Queue is empty.', nowPlaying ? 'success' : 'info');
    }

    async function playNow(id) {
      const box = document.getElementById('alertBox');
      // Promote out of turn: end whoever is on, then set this one performing.
      const { error: e1 } = await db.from('karaoke_slots')
        .update({ status: 'done', performed_at: new Date().toISOString() })
        .eq('event_instance_id', tonight.instance_id).eq('status', 'performing');
      if (e1) { setAlert(box, 'Could not close the current song: ' + e1.message, 'error'); return; }

      const { error: e2 } = await db.from('karaoke_slots')
        .update({ status: 'performing' }).eq('id', id);
      if (e2) { setAlert(box, 'Could not start that song: ' + e2.message, 'error'); return; }

      await fetchQueue();
    }

    async function removeSlot(id) {
      const box = document.getElementById('alertBox');
      const { error } = await db.rpc('karaoke_skip', { p_slot: id });
      if (error) { setAlert(box, 'Could not skip: ' + error.message, 'error'); return; }
      await fetchQueue();
    }

    async function addManualSinger(e) {
      e.preventDefault();
      const box  = document.getElementById('alertBox');
      const song = document.getElementById('walkupSong').value.trim();
      if (!song) return;

      // A walk-up has no account, so singer_profile_id stays null — the schema allows
      // that, which is exactly what the field is for. The insert previously used
      // status 'pending' and omitted event_instance_id and position, all three of which
      // made it fail; the failure was swallowed and the singer only ever existed in
      // this browser's memory.
      const { data: pos, error: posErr } =
        await db.rpc('next_karaoke_position', { p_instance: tonight.instance_id });
      if (posErr) { setAlert(box, 'Could not add: ' + posErr.message, 'error'); return; }

      const { error } = await db.from('karaoke_slots').insert({
        event_instance_id: tonight.instance_id,
        singer_profile_id: null,
        singer_name: 'Walk-up singer',
        song_title: song,
        status: 'queued',
        position: pos,
      });

      if (error) { setAlert(box, 'Could not add: ' + error.message, 'error'); return; }

      document.getElementById('walkupSong').value = '';
      await fetchQueue();
      setAlert(box, `Added "${escapeHtml(song)}" to the queue.`, 'success');
    }

    document.addEventListener('DOMContentLoaded', initKjController);
  </script>
</body>
</html>
