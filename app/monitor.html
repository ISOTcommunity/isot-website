<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="robots" content="noindex" />
  <title>Monitor · ISOT App</title>

  <link rel="icon" href="logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css" />
  <style>
    .stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; }
    .stat { background:var(--bg-card); border:1px solid var(--border-light); border-radius:14px; padding:14px 16px; }
    .stat .n { font-size:1.9rem; font-weight:700; color:#FFF; line-height:1; font-variant-numeric:tabular-nums; }
    .stat .l { font-size:0.72rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.07em; margin-top:6px; }
    .stat.bad .n { color:#FCA5A5; }
    .stat.good .n { color:var(--green); }

    .row { display:flex; gap:12px; padding:11px 0; border-bottom:1px solid var(--border-light); align-items:flex-start; }
    .row:last-child { border-bottom:none; }
    .when { font-size:0.72rem; color:var(--text-dark); white-space:nowrap; min-width:92px; font-variant-numeric:tabular-nums; }
    .what { flex:1; min-width:0; font-size:0.88rem; }
    .what b { color:#FFF; font-weight:600; }
    .tag { font-size:0.62rem; text-transform:uppercase; letter-spacing:0.07em; padding:2px 8px; border-radius:10px; background:rgba(255,255,255,0.07); color:var(--text-dim); white-space:nowrap; }

    .prob { display:flex; gap:12px; padding:13px 14px; border-radius:12px; margin-bottom:8px; align-items:flex-start; }
    .prob.critical { background:rgba(239,68,68,0.10); border-left:3px solid #EF4444; }
    .prob.warning  { background:rgba(212,175,80,0.10); border-left:3px solid var(--gold); }

    .tabs { display:flex; gap:6px; margin:18px 0 12px; flex-wrap:wrap; }
    .tab { padding:6px 14px; border-radius:20px; font-size:0.8rem; cursor:pointer;
           background:transparent; border:1px solid var(--border-light); color:var(--text-muted); }
    .tab.on { background:var(--pink); border-color:var(--pink); color:#FFF; font-weight:600; }
  </style>
</head>
<body>

  <div id="gate"><div class="spinner"></div></div>

  <header class="topbar">
    <a href="home.html" class="topbar-title">Monitor</a>
    <button type="button" id="burgerBtn" aria-label="Account menu"
            style="background:transparent;border:none;color:#FFF;font-size:1.3rem;cursor:pointer;padding:6px">
      <i class="fa-solid fa-bars"></i>
    </button>
  </header>

  <main class="shell" style="max-width:620px">

    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px">
      <div>
        <div class="eyebrow">Board only</div>
        <h1 style="font-size:1.7rem;margin-top:2px">What's happening</h1>
      </div>
      <button type="button" class="btn btn-outline" style="width:auto;padding:6px 14px;font-size:0.78rem"
              onclick="loadAll()">
        <i class="fa-solid fa-rotate-right"></i> Refresh
      </button>
    </div>

    <!-- Problems come first. A monitoring page whose alerts are below the fold is a
         report, not a monitor. -->
    <div id="problems" style="margin-bottom:18px"></div>

    <div class="stat-grid" id="stats"></div>

    <div class="tabs">
      <button type="button" class="tab on" data-view="activity" onclick="setView('activity')">Activity</button>
      <button type="button" class="tab"    data-view="signins"  onclick="setView('signins')">Sign-ins</button>
      <button type="button" class="tab"    data-view="signups"  onclick="setView('signups')">Signup log</button>
    </div>

    <div class="card card-glass" style="padding:6px 16px">
      <div id="feed"><div class="spinner" style="margin:24px auto"></div></div>
    </div>

    <p class="dim" style="font-size:0.75rem;margin-top:14px" id="stamp"></p>

  </main>

  <script src="vendor/supabase.js"></script>
  <script src="js/isot.js"></script>
  <script>
  let view = 'activity';
  let cache = { activity: null, signins: null, signups: null };

  (async () => {
    await requireAuth({ board: true });
    await loadAll();
  })();

  function ago(iso) {
    const mins = Math.round((Date.now() - new Date(iso)) / 60000);
    if (mins < 1)    return 'just now';
    if (mins < 60)   return mins + 'm ago';
    if (mins < 1440) return Math.round(mins / 60) + 'h ago';
    const d = Math.round(mins / 1440);
    return d === 1 ? 'yesterday' : d + 'd ago';
  }

  async function loadAll() {
    cache = { activity: null, signins: null, signups: null };
    await Promise.all([loadProblems(), loadStats()]);
    await renderFeed();
    document.getElementById('stamp').textContent =
      'Last checked ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  async function loadProblems() {
    const el = document.getElementById('problems');
    const { data, error } = await db.rpc('monitor_problems');

    if (error) {
      el.innerHTML = `<div class="prob critical"><div>Could not run the health check: ${escapeHtml(error.message)}</div></div>`;
      return;
    }
    if (!data || !data.length) {
      el.innerHTML = `<div class="prob" style="background:rgba(16,185,129,0.09);border-left:3px solid var(--green)">
        <i class="fa-solid fa-circle-check text-green" style="margin-top:3px"></i>
        <div><b style="color:#FFF">Nothing needs attention.</b>
        <div class="dim" style="font-size:0.82rem">No stranded accounts, no signup failures, no broken member cards.</div></div>
      </div>`;
      return;
    }
    el.innerHTML = data.map(p => `
      <div class="prob ${escapeHtml(p.severity)}">
        <i class="fa-solid ${p.severity === 'critical' ? 'fa-triangle-exclamation' : 'fa-circle-exclamation'}"
           style="margin-top:3px;color:${p.severity === 'critical' ? '#FCA5A5' : 'var(--gold)'}"></i>
        <div>
          <b style="color:#FFF">${escapeHtml(p.problem)}</b>
          <div class="dim" style="font-size:0.82rem">${escapeHtml(p.detail || '')}</div>
        </div>
      </div>`).join('');
  }

  async function loadStats() {
    const { data: s, error } = await db.rpc('monitor_summary');
    if (error || !s) return;

    const cell = (n, label, tone = '') =>
      `<div class="stat ${tone}"><div class="n">${n}</div><div class="l">${label}</div></div>`;

    document.getElementById('stats').innerHTML =
      cell(s.members_total, 'Members') +
      cell(s.members_7d, 'Joined this week') +
      cell(s.socios, 'Paid socios') +
      cell(s.checkins_7d, 'Check-ins, 7d') +
      cell(s.rsvps_upcoming, 'Going, upcoming') +
      cell(s.songs_7d, 'Songs, 7d') +
      // These two are the outage detector. Anything but zero is a live problem.
      cell(s.orphan_accounts, 'Stranded accounts', s.orphan_accounts > 0 ? 'bad' : 'good') +
      cell(s.signup_failures_7d, 'Signup failures', s.signup_failures_7d > 0 ? 'bad' : 'good');
  }

  function setView(v) {
    view = v;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.view === v));
    renderFeed();
  }

  async function renderFeed() {
    const el = document.getElementById('feed');
    el.innerHTML = '<div class="spinner" style="margin:24px auto"></div>';

    if (!cache[view]) {
      let res;
      if (view === 'activity')      res = await db.rpc('monitor_activity', { p_days: 30, p_limit: 200 });
      else if (view === 'signins')  res = await db.rpc('monitor_signins',  { p_days: 14, p_limit: 100 });
      else                          res = await db.from('signup_events').select('*').order('at', { ascending: false }).limit(100);

      if (res.error) {
        el.innerHTML = `<p class="dim" style="padding:20px 0;font-size:0.86rem">Could not load: ${escapeHtml(res.error.message)}</p>`;
        return;
      }
      cache[view] = res.data || [];
    }

    const rows = cache[view];
    if (!rows.length) {
      const empty = {
        activity: 'Nothing recorded in the last 30 days.',
        // Not the same as "nobody signed in" — say which it is rather than implying zero.
        signins:  'No sign-in records available. GoTrue keeps its own audit trail and this database role may not be able to read it.',
        signups:  'No signup attempts logged yet.',
      }[view];
      el.innerHTML = `<p class="dim" style="padding:24px 0;font-size:0.86rem;text-align:center">${empty}</p>`;
      return;
    }

    el.innerHTML = rows.map(r => {
      if (view === 'signins') {
        return `<div class="row">
          <div class="when">${escapeHtml(ago(r.at))}</div>
          <div class="what"><b>${escapeHtml(r.email)}</b> — ${escapeHtml(r.action)}</div>
        </div>`;
      }
      if (view === 'signups') {
        const bad = r.outcome === 'failed';
        return `<div class="row">
          <div class="when">${escapeHtml(ago(r.at))}</div>
          <div class="what">
            <b>${escapeHtml(r.email || '—')}</b> · ${escapeHtml(r.outcome)}
            ${r.detail ? `<div style="color:#FCA5A5;font-size:0.8rem;margin-top:2px">${escapeHtml(r.detail)}</div>` : ''}
          </div>
          <span class="tag" ${bad ? 'style="background:rgba(239,68,68,0.18);color:#FCA5A5"' : ''}>${escapeHtml(r.source)}</span>
        </div>`;
      }
      return `<div class="row">
        <div class="when">${escapeHtml(ago(r.at))}</div>
        <div class="what">
          <b>${escapeHtml(r.actor_name || 'Someone')}</b> ${escapeHtml(r.action)}
          ${r.subject ? ' — ' + escapeHtml(r.subject) : ''}
          ${r.detail ? `<div class="dim" style="font-size:0.78rem">${escapeHtml(r.detail)}</div>` : ''}
        </div>
        <span class="tag">${escapeHtml(r.kind)}</span>
      </div>`;
    }).join('');
  }
  </script>
</body>
</html>
