  <style>
    #runMap {
      height: 340px;
      width: 100%;
      border-radius: 20px;
      border: 1px solid var(--border-glow);
      box-shadow: 0 12px 32px rgba(238, 9, 121, 0.2);
      margin-bottom: 20px;
    }
    
    .leaflet-control-attribution {
      background: rgba(11, 15, 25, 0.6) !important;
      color: var(--text-dim) !important;
      font-size: 0.65rem !important;
      border-radius: 6px 0 0 0;
    }
    .leaflet-control-attribution a { color: var(--text-dim) !important; }

    .route-selector {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 20px;
      -webkit-overflow-scrolling: touch;
    }
    .route-selector::-webkit-scrollbar { display: none; }
    
    .route-pill {
      flex-shrink: 0;
      padding: 10px 16px;
      border-radius: 9999px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--border-light);
      color: var(--text-muted);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .route-pill.active {
      background: linear-gradient(135deg, #EE0979, #FF6A00);
      border-color: transparent;
      color: #FFF;
      box-shadow: 0 6px 18px rgba(238, 9, 121, 0.4);
    }

    .route-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    }
    .route-stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 16px 0;
      text-align: center;
      background: rgba(15, 23, 42, 0.6);
      padding: 14px;
      border-radius: 16px;
      border: 1px solid var(--border-light);
    }
    .stat-val { font-size: 1.25rem; font-weight: 800; color: var(--pink); line-height: 1; }
    .stat-lbl { font-size: 0.72rem; color: var(--text-dim); text-transform: uppercase; margin-top: 4px; font-weight: 600; }
  </style>
</head>
<body>

  <script src="vendor/supabase.js"></script>
  <script src="vendor/leaflet.js"></script>
  <script src="js/isot.js"></script>
  <script src="js/running_routes.js"></script>

  <script>
    /* Every figure here is measured, not estimated.
     *
     * The page shipped with hand-placed polylines of 5-15 points and distances written
     * independently of them: the "10K training route" measured 12.9 km as a straight
     * line and 14.75 km on real paths, and Pellerina claimed 6.5 km over a 3.8 km line.
     * Four of five were wrong by 24-53%, which for anyone planning a training run is
     * the difference between the session they wanted and the one they got.
     *
     * These routes are now Valhalla pedestrian routing over OpenStreetMap (7 Sep 2026),
     * following actual paths. Distance and climb come back from the router and the
     * elevation service rather than being typed in. Geometry is thinned to every third
     * point — identical at city zoom, a fifth of the page weight over five routes.
     */
    const ROUTES = RUNNING_ROUTES;

    let map = null;
    let currentPolyline = null;
    let currentMarkers = [];

    async function initRunningPage() {
      const me = await requireAuth();
      document.getElementById('headerAvatar').innerHTML = renderUserAvatarHtml(me, 36);

      // Initialize Leaflet Map
      map = L.map('runMap', { zoomControl: false, attributionControl: false });
      L.control.attribution({ prefix: false, position: 'bottomright' }).addAttribution('&copy; OSM').addTo(map);
      
      isotBasemap(map);

      renderPills();
      selectRoute(0);
    }

    function renderPills() {
      const container = document.getElementById('routePills');
      container.innerHTML = ROUTES.map((r, idx) => `
        <button class="route-pill ${idx === 0 ? 'active' : ''}" onclick="selectRoute(${idx})">
          <i class="fa-solid fa-person-running"></i> ${r.shortName}
        </button>
      `).join('');
    }

    function selectRoute(idx) {
      const route = ROUTES[idx];

      // Update pills UI
      document.querySelectorAll('.route-pill').forEach((btn, i) => {
        btn.classList.toggle('active', i === idx);
      });

      // Update Details Card
      document.getElementById('routeCard').innerHTML = `
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom: 8px;">
          <span class="badge badge-socio" style="background:rgba(238,9,121,0.15); color:var(--pink);"><i class="fa-solid fa-location-dot"></i> Verified Route</span>
          <span style="font-size:0.8rem; color:var(--text-dim); font-weight:600;"><i class="fa-solid fa-mountain"></i> ${route.difficulty}</span>
        </div>
        <h2 style="font-size:1.35rem; color:#FFF; margin-bottom:6px;">${route.name}</h2>
        <p style="color:var(--text-dim); font-size:0.86rem; line-height:1.5; margin-bottom:12px;">${route.desc}</p>
        
        <div class="route-stats-grid">
          <div>
            <div class="stat-val">${route.distance}</div>
            <div style="font-size:0.68rem;color:var(--text-dim);margin-top:2px">${route.runTime}</div>
            <div class="stat-lbl">Distance</div>
          </div>
          <div>
            <div class="stat-val" style="color:var(--gold);">${route.elevation}</div>
            <div class="stat-lbl">Elevation</div>
          </div>
          <div>
            <div class="stat-val" style="color:#22C55E;" style="font-size:0.95rem;">${route.surface.split(' ')[0]}</div>
            <div class="stat-lbl">Terrain</div>
          </div>
        </div>

        <div style="display:flex; gap:10px; margin-top:14px;">
          <a href="https://maps.google.com/?q=${route.points[0][0]},${route.points[0][1]}" target="_blank" rel="noopener" class="btn btn-pink" style="flex:1; justify-content:center; padding:10px;">
            <i class="fa-solid fa-location-arrow"></i> Navigate to Start
          </a>
        </div>
      `;

      // Clear previous map elements
      if (currentPolyline) map.removeLayer(currentPolyline);
      currentMarkers.forEach(m => map.removeLayer(m));
      currentMarkers = [];

      // Draw polyline route
      currentPolyline = L.polyline(route.points, {
        // The route's own colour, so this page and the map layer agree. It was
        // '#EE0979' — the old pink that was never on the ISOT palette and which
        // css/app.css records as retired.
        color: route.color || '#43DB8F',
        weight: 5,
        opacity: 0.9,
        lineCap: 'round',
        lineJoin: 'round'
      }).addTo(map);

      // Start Pin
      const startPin = L.divIcon({
        className: 'isot-pin-wrapper',
        html: `<div class="isot-pin" style="background:#22C55E; box-shadow:0 0 16px rgba(34,197,94,0.8);"><i class="fa-solid fa-play"></i></div>`,
        iconSize: [32, 32], iconAnchor: [16, 16]
      });
      const startMarker = L.marker(route.points[0], { icon: startPin }).addTo(map).bindPopup(`<b>Start Point</b><br>${route.name}`);
      currentMarkers.push(startMarker);

      // Finish Pin
      const endPoint = route.points[route.points.length - 1];
      const finishPin = L.divIcon({
        className: 'isot-pin-wrapper',
        html: `<div class="isot-pin" style="background:#EE0979;"><i class="fa-solid fa-flag-checkered"></i></div>`,
        iconSize: [32, 32], iconAnchor: [16, 16]
      });
      const finishMarker = L.marker(endPoint, { icon: finishPin }).addTo(map);
      currentMarkers.push(finishMarker);

      // Fit map to route bounds
      map.fitBounds(currentPolyline.getBounds(), { padding: [35, 35], maxZoom: 16 });
    }

    document.addEventListener('DOMContentLoaded', initRunningPage);
  </script>
