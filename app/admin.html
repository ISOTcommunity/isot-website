<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="robots" content="noindex" />
  <title>ISOT Admin</title>

  <link rel="icon" href="logo.png" type="image/png" />
  <link rel="preload" href="fonts/moderna.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css" />
  <style>
    .stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:10px; }
    .stat { background:var(--bg-card); border:1px solid var(--border-light); border-radius:14px; padding:14px 16px; }
    .stat .n { font-size:1.8rem; font-weight:700; color:#FFF; line-height:1; font-variant-numeric:tabular-nums; }
    .stat .l { font-size:0.7rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.07em; margin-top:6px; }
    .stat.bad  .n { color:#FFD8CF; }
    .stat.good .n { color:var(--green); }

    .row { display:flex; gap:12px; padding:11px 0; border-bottom:1px solid var(--border-light); align-items:center; }
    .row:last-child { border-bottom:none; }
    .when { font-size:0.72rem; color:var(--text-dark); white-space:nowrap; min-width:84px; font-variant-numeric:tabular-nums; }
    .grow { flex:1; min-width:0; font-size:0.88rem; }
    .grow b { color:#FFF; font-weight:600; }
    .tag { font-size:0.62rem; text-transform:uppercase; letter-spacing:0.07em; padding:2px 8px;
           border-radius:10px; background:rgba(255,255,255,0.07); color:var(--text-dim); white-space:nowrap; }
    .tag.pink { background:var(--pink-glow); color:#FFF; }
    .tag.gold { background:rgba(255, 184, 31,0.18); color:var(--gold); }

    .prob { display:flex; gap:12px; padding:13px 14px; border-radius:12px; margin-bottom:8px; align-items:flex-start; }
    .prob.critical { background:rgba(255, 90, 60,0.10); border-left:3px solid #FF5A3C; }
    .prob.warning  { background:rgba(255, 184, 31,0.10); border-left:3px solid var(--gold); }
    .prob.ok       { background:rgba(31, 212, 127,0.09); border-left:3px solid var(--green); }

    /* Section nav — horizontally scrollable on a phone rather than wrapping to
       three ragged lines. */
    .nav { display:flex; gap:6px; margin:18px 0 14px; overflow-x:auto; padding-bottom:4px; }
    .nav::-webkit-scrollbar { display:none; }
    .navbtn { padding:7px 15px; border-radius:20px; font-size:0.82rem; cursor:pointer; white-space:nowrap;
              background:transparent; border:1px solid var(--border-light); color:var(--text-muted); font-family:inherit; }
    .navbtn.on { background: var(--selected-bg); border-color: var(--selected-bg); color: var(--on-selected); font-weight:600; }

    .sub { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
    .subbtn { padding:5px 12px; border-radius:16px; font-size:0.76rem; cursor:pointer;
              background:transparent; border:1px solid var(--border-light); color:var(--text-dim); font-family:inherit; }
    .subbtn.on { border-color:var(--pink); color:#FFF; }

    .mini { width:auto; padding:5px 11px; font-size:0.74rem; }

    /* Poster picker. The drop zone doubles as the preview once a file is chosen,
       so there is one thing on screen rather than a box plus a thumbnail. */
    .drop {
      border:1.5px dashed var(--border-light); border-radius:14px; padding:22px 16px;
      text-align:center; cursor:pointer; background:var(--bg-darker);
      transition:border-color .15s ease, background .15s ease;
    }
    .drop:hover, .drop.over { border-color:var(--pink); background:rgba(127, 74, 255,0.06); }
    .drop i { font-size:1.5rem; color:var(--text-dim); margin-bottom:8px; display:block; }
    .drop .hint { font-size:0.78rem; color:var(--text-dim); }
    .drop img { max-width:190px; width:100%; border-radius:10px; display:block; margin:0 auto 10px; }
    .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    @media (max-width:420px) { .two { grid-template-columns:1fr; gap:0; } }
    .code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:0.74rem;
            background:rgba(255,255,255,0.05); padding:3px 7px; border-radius:6px;
            word-break:break-all; color:var(--text-muted); }
  </style>
</head>
<body>

  <div id="gate"><div class="spinner"></div></div>

  <header class="topbar">
    <a href="home.html" class="topbar-title">ISOT Admin</a>
    <button type="button" id="burgerBtn" aria-label="Account menu"
            style="background:transparent;border:none;color:#FFF;font-size:1.3rem;cursor:pointer;padding:6px">
      <i class="fa-solid fa-bars"></i>
    </button>
  </header>

  <main class="shell" style="max-width:640px">

    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
      <div>
        <div class="eyebrow">Board only</div>
        <h1 style="font-size:1.7rem;margin-top:2px" id="pageTitle">Overview</h1>
      </div>
      <button type="button" class="btn btn-outline mini" onclick="refresh()">
        <i class="fa-solid fa-rotate-right"></i> Refresh
      </button>
    </div>

    <nav class="nav">
      <button type="button" class="navbtn on" data-s="overview" onclick="go('overview')">Overview</button>
      <button type="button" class="navbtn" data-s="members"  onclick="go('members')">Members</button>
      <button type="button" class="navbtn" data-s="applications" onclick="go('applications')">Applications</button>
      <button type="button" class="navbtn" data-s="activity" onclick="go('activity')">Activity</button>
      <button type="button" class="navbtn" data-s="proposals" onclick="go('proposals')">Proposals</button>
      <button type="button" class="navbtn" data-s="graphics" onclick="go('graphics')">Graphics</button>
      <button type="button" class="navbtn" data-s="events"   onclick="go('events')">Events</button>
      <button type="button" class="navbtn" data-s="venues"   onclick="go('venues')">Venues</button>
    </nav>

    <div id="panel"><div class="spinner" style="margin:36px auto"></div></div>

    <p class="dim" style="font-size:0.74rem;margin-top:18px" id="stamp"></p>
  </main>

  <script src="vendor/supabase.js"></script>
  <script src="js/isot.js"></script>
  <script>
  let me = null;
  let section = 'overview';
  let feedView = 'activity';
  let eventsView = 'schedule';
  let editing = null;
  const cache = {};

  const TITLES = {
    overview: 'Overview', members: 'Members', applications: 'Applications',
    activity: 'Activity', proposals: 'Proposals', graphics: 'Graphics',
    events: 'Events', venues: 'Venues',
  };

  (async () => {
    me = await requireAuth({ board: true });
    // Deep link, so a bookmark can land straight on Members.
    const want = (location.hash || '').replace('#', '');
    if (TITLES[want]) section = want;
    document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('on', b.dataset.s === section));
    render();
  })();

  function go(s) {
    section = s;
    location.hash = s;
    document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('on', b.dataset.s === s));
    render();
  }

  function refresh() {
    Object.keys(cache).forEach(k => delete cache[k]);
    render();
  }

  function ago(iso) {
    const m = Math.round((Date.now() - new Date(iso)) / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + 'm ago';
    if (m < 1440) return Math.round(m / 60) + 'h ago';
    const d = Math.round(m / 1440);
    return d === 1 ? 'yesterday' : d + 'd ago';
  }

  function fail(msg) {
    return `<div class="prob critical"><i class="fa-solid fa-triangle-exclamation" style="color:#FFD8CF;margin-top:3px"></i>
            <div><b style="color:#FFF">Could not load this</b>
            <div class="dim" style="font-size:0.82rem">${escapeHtml(msg)}</div></div></div>`;
  }

  async function render() {
    document.getElementById('pageTitle').textContent = TITLES[section];
    const el = document.getElementById('panel');
    el.innerHTML = '<div class="spinner" style="margin:36px auto"></div>';
    try {
      await ({ overview: renderOverview, members: renderMembers, applications: renderApplications, activity: renderActivity,
               proposals: renderProposals, graphics: renderGraphics,
               events: renderEvents, venues: renderVenues }[section])(el);
    } catch (e) {
      el.innerHTML = fail(e.message || String(e));
    }
    document.getElementById('stamp').textContent =
      'Checked ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  /* ── Overview ────────────────────────────────────────────────────────── */
  async function renderOverview(el) {
    const [probs, sum] = await Promise.all([
      db.rpc('monitor_problems'),
      db.rpc('monitor_summary'),
    ]);

    let html = '';

    // Problems first, always. Alerts below the fold make this a report, not a monitor.
    if (probs.error) {
      html += fail(probs.error.message);
    } else if (!probs.data || !probs.data.length) {
      html += `<div class="prob ok"><i class="fa-solid fa-circle-check text-green" style="margin-top:3px"></i>
        <div><b style="color:#FFF">Nothing needs attention</b>
        <div class="dim" style="font-size:0.82rem">No stranded accounts, no signup failures, no broken member cards.</div></div></div>`;
    } else {
      html += probs.data.map(p => `
        <div class="prob ${escapeHtml(p.severity)}">
          <i class="fa-solid ${p.severity === 'critical' ? 'fa-triangle-exclamation' : 'fa-circle-exclamation'}"
             style="margin-top:3px;color:${p.severity === 'critical' ? '#FFD8CF' : 'var(--gold)'}"></i>
          <div><b style="color:#FFF">${escapeHtml(p.problem)}</b>
          <div class="dim" style="font-size:0.82rem">${escapeHtml(p.detail || '')}</div></div>
        </div>`).join('');
    }

    if (sum.error) {
      html += fail(sum.error.message);
    } else {
      const s = sum.data;
      const cell = (n, l, tone = '') => `<div class="stat ${tone}"><div class="n">${n}</div><div class="l">${l}</div></div>`;
      html += `<div class="stat-grid" style="margin-top:14px">
        ${cell(s.members_total, 'Members')}
        ${cell(s.members_7d, 'Joined 7d')}
        ${cell(s.socios, 'Paid socios')}
        ${cell(s.staff, 'Staff & KJs')}
        ${cell(s.checkins_7d, 'Check-ins 7d')}
        ${cell(s.rsvps_upcoming, 'Going, upcoming')}
        ${cell(s.songs_7d, 'Songs 7d')}
        ${cell(s.orphan_accounts, 'Stranded', s.orphan_accounts > 0 ? 'bad' : 'good')}
        ${cell(s.signup_failures_7d, 'Signup fails', s.signup_failures_7d > 0 ? 'bad' : 'good')}
      </div>`;
    }
    el.innerHTML = html;
  }

  /* ── Members ─────────────────────────────────────────────────────────── */
  async function renderMembers(el) {
    if (!cache.members) {
      const { data, error } = await db.from('profiles')
        .select('id, full_name, email, member_code, tier, staff_role, board_position, university, nationality, avatar_url, created_at')
        .order('created_at', { ascending: false });
      if (error) { el.innerHTML = fail(error.message); return; }
      cache.members = data || [];
    }

    el.innerHTML = `
      <input type="text" id="mSearch" placeholder="Search name, email or member code…" style="width:100%;margin-bottom:12px" />
      <div id="mList"></div>`;
    document.getElementById('mSearch').addEventListener('input', paintMembers);
    paintMembers();
  }

  function paintMembers() {
    const q = (document.getElementById('mSearch')?.value || '').toLowerCase().trim();
    const rank = p => p.staff_role === 'board' ? 0 : p.staff_role ? 1 : 2;

    const list = cache.members
      .filter(p => !q || [p.full_name, p.email, p.member_code]
        .some(v => (v || '').toLowerCase().includes(q)))
      .sort((a, b) => rank(a) - rank(b) || new Date(b.created_at) - new Date(a.created_at));

    document.getElementById('mList').innerHTML = list.length ? list.map(p => {
      const isBoard = p.staff_role === 'board';
      const isVol   = p.staff_role === 'volunteer';
      const isSocio = p.tier === 'socio';
      return `
      <div class="row" style="align-items:flex-start">
        ${renderUserAvatarHtml(p, 38)}
        <div class="grow">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
            <b>${escapeHtml(p.full_name || 'Member')}</b>
            ${isBoard ? `<span class="tag pink">${escapeHtml(p.board_position || 'Board')}</span>` : ''}
            ${isVol ? '<span class="tag pink">KJ</span>' : ''}
            ${isSocio ? '<span class="tag gold">APS Member</span>' : ''}
          </div>
          <div class="dim" style="font-size:0.76rem">${escapeHtml(p.member_code || '')} · ${escapeHtml(p.email || 'no email')}</div>
          ${p.university ? `<div class="dim" style="font-size:0.76rem">${escapeHtml(p.university)}</div>` : ''}
          ${isBoard ? '' : `
            <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
              <button type="button" class="btn ${isVol ? 'btn-outline' : 'btn-pink'} mini"
                      onclick="toggleVol('${p.id}', ${isVol ? 'false' : 'true'})">
                ${isVol ? 'Remove KJ' : 'Make KJ'}
              </button>
              <!-- ISOT APS membership is no longer toggled here: it comes only from an
                   application the Board admits (Applications tab, Statute Art. 6). -->
            </div>`}
        </div>
      </div>`;
    }).join('') : '<p class="dim" style="padding:22px 0;text-align:center;font-size:0.86rem">Nobody matches that search.</p>';
  }

  async function toggleVol(id, make) {
    const { error } = await db.rpc('set_volunteer', { p_profile: id, p_is_volunteer: make });
    if (error) { alert('Could not change that: ' + error.message); return; }
    delete cache.members;
    render();
  }

  /* ── Applications (Statute Art. 5–6) ─────────────────────────────────── */
  // The Board's side of membership. An application arrives online (form + signed PDF +
  // Stripe) or on paper (scanned here). Only a paid application can be approved; approval
  // creates the membership year and the register entry, and the card turns to
  // ★ ISOT APS MEMBER. Rejection needs a reason and refunds the fee (api/membership-decision).
  const APP_STATUS = {
    paid:      ['gold', 'Paid · waiting for the Board'],
    submitted: ['',     'Not paid yet'],
    approved:  ['pink', 'Admitted'],
    rejected:  ['',     'Rejected'],
    withdrawn: ['',     'Withdrawn'],
  };

  async function renderApplications(el) {
    if (!cache.apps) {
      const [a, m] = await Promise.all([
        db.from('membership_applications')
          .select('id, channel, first_name, last_name, email, birth_date, birth_place, payment_plan, amount_eur, status, paid_at, created_at, decided_at, rejection_reason, refunded_at, pdf_path')
          .order('created_at', { ascending: false }).limit(200),
        db.from('memberships')
          .select('id, member_name, valid_until, auto_renew, status')
          .eq('status', 'active').order('valid_until', { ascending: true }),
      ]);
      if (a.error) { el.innerHTML = fail(a.error.message); return; }
      cache.apps = a.data || [];
      cache.activeMemberships = m.data || [];
    }

    const open = cache.apps.filter(x => x.status === 'paid');
    const unpaid = cache.apps.filter(x => x.status === 'submitted');
    const done = cache.apps.filter(x => !['paid', 'submitted'].includes(x.status)).slice(0, 30);
    const today = new Date().toISOString().slice(0, 10);
    const lapseDue = cache.activeMemberships.filter(m => !m.auto_renew &&
      new Date(m.valid_until + 'T00:00:00') < new Date(Date.now() - 60 * 864e5));

    el.innerHTML = `
      <div class="prob ${open.length ? 'warning' : 'ok'}">
        <i class="fa-solid fa-gavel" style="margin-top:3px"></i>
        <div><b style="color:#FFF">${open.length} application${open.length === 1 ? '' : 's'} to decide</b>
        <div class="dim" style="font-size:0.82rem">The Board decides at its first meeting after the application (Art. 6). Record the decision here after the meeting.</div></div>
      </div>

      <h3 style="margin:18px 0 6px">Waiting for the Board</h3>
      ${open.length ? open.map(appRow).join('') : '<p class="dim" style="font-size:0.84rem">Nothing waiting.</p>'}

      <h3 style="margin:22px 0 6px">Not paid yet</h3>
      ${unpaid.length ? unpaid.map(appRow).join('') : '<p class="dim" style="font-size:0.84rem">None.</p>'}

      <h3 style="margin:22px 0 6px">Membership lapsed (Art. 5)</h3>
      ${lapseDue.length ? lapseDue.map(m => `
        <div class="row"><div class="grow"><b>${escapeHtml(m.member_name)}</b>
          <div class="dim" style="font-size:0.76rem">Anniversary ${escapeHtml(m.valid_until)} · unpaid for more than 60 days</div></div>
          <button type="button" class="btn btn-outline mini" onclick="recordLapse('${m.id}')">Record lapse</button></div>`).join('')
        : '<p class="dim" style="font-size:0.84rem">No one past the 60-day term.</p>'}

      <h3 style="margin:22px 0 6px">Paper application</h3>
      ${paperForm()}

      <h3 style="margin:22px 0 6px">Recent decisions</h3>
      ${done.length ? done.map(appRow).join('') : '<p class="dim" style="font-size:0.84rem">None yet.</p>'}
      <p class="dim" style="font-size:0.74rem;margin-top:10px">Today ${today}. Every decision is kept with its date and the Board member who recorded it.</p>`;
  }

  function appRow(x) {
    const [tone, label] = APP_STATUS[x.status] || ['', x.status];
    const plan = { one_off: 'Stripe · once', yearly: 'Stripe · yearly', cash: 'Cash', bank_transfer: 'Bank transfer' }[x.payment_plan] || x.payment_plan;
    const actions = x.status === 'paid' ? `
        <button type="button" class="btn btn-pink mini" onclick="approveApp('${x.id}')">Admit</button>
        <button type="button" class="btn btn-outline mini" onclick="decideApp('${x.id}', 'reject')">Reject</button>
        <button type="button" class="btn btn-outline mini" onclick="decideApp('${x.id}', 'withdraw')">Withdrawn</button>`
      : x.status === 'submitted' ? `
        <button type="button" class="btn btn-outline mini" onclick="markPaid('${x.id}')">Fee received in cash / bank</button>
        <button type="button" class="btn btn-outline mini" onclick="decideApp('${x.id}', 'withdraw')">Withdrawn</button>` : '';
    return `
      <div class="row" style="align-items:flex-start">
        <div class="grow">
          <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
            <b>${escapeHtml(x.first_name + ' ' + x.last_name)}</b>
            <span class="tag ${tone}">${label}</span>
            ${x.channel === 'paper' ? '<span class="tag">Paper</span>' : ''}
          </div>
          <div class="dim" style="font-size:0.76rem">${escapeHtml(x.email)} · born ${escapeHtml(x.birth_date || '')} in ${escapeHtml(x.birth_place || '')}</div>
          <div class="dim" style="font-size:0.76rem">${escapeHtml(plan || '')}${x.paid_at ? ' · paid ' + ago(x.paid_at) : ''} · applied ${ago(x.created_at)}</div>
          ${x.rejection_reason ? `<div class="dim" style="font-size:0.76rem">Reason: ${escapeHtml(x.rejection_reason)}</div>` : ''}
          ${['rejected', 'withdrawn'].includes(x.status) && x.paid_at && !x.refunded_at ? '<div style="font-size:0.76rem;color:var(--gold)">Refund by hand (cash or bank transfer)</div>' : ''}
          <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
            ${x.pdf_path ? `<button type="button" class="btn btn-outline mini" onclick="openAppPdf(${jsArg(x.pdf_path)})"><i class="fa-solid fa-file-pdf"></i> Form</button>` : ''}
            ${actions}
          </div>
        </div>
      </div>`;
  }

  async function openAppPdf(path) {
    const w = window.open('', '_blank');
    const { data, error } = await db.storage.from('admission-forms').createSignedUrl(path, 300);
    if (error) { if (w) w.close(); alert('Could not open the form: ' + error.message); return; }
    if (w) w.location = data.signedUrl; else location.assign(data.signedUrl);
  }

  async function approveApp(id) {
    if (!confirm('Record that the Board admitted this applicant? They become an ISOT APS Member and are entered in the register (libro soci).')) return;
    const { data } = await db.auth.getSession();
    const res = await fetch('/api/membership-decision', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${data?.session?.access_token || ''}` },
      body: JSON.stringify({ application_id: id, action: 'approve' }),
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) { alert('Could not record that: ' + (json.error || res.status)); return; }
    if (!json.emailed) alert('Admitted, but the welcome email did not send. Tell them yourself.');
    delete cache.apps; delete cache.members;
    render();
  }

  async function decideApp(id, action) {
    let reason = '';
    if (action === 'reject') {
      reason = prompt('Reason for the rejection (Statute Art. 6: it must be given in writing). It will be sent to the applicant.');
      if (!reason || !reason.trim()) return;
    } else if (!confirm('Record that the applicant withdrew? A Stripe payment is refunded in full.')) return;
    const { data } = await db.auth.getSession();
    const res = await fetch('/api/membership-decision', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${data?.session?.access_token || ''}` },
      body: JSON.stringify({ application_id: id, action, reason }),
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) { alert('Could not record that: ' + (json.error || res.status)); return; }
    if (json.manual_refund) alert('Recorded. This fee was paid in cash or by bank transfer: refund it by hand within 30 days.');
    if (json.emailed === false) alert('Recorded, but the email to the applicant did not send. Write to them yourself: Art. 6 requires it in writing.');
    delete cache.apps;
    render();
  }

  async function markPaid(id) {
    const how = prompt('How was the €10 received? Type "cash" or "bank".', 'cash');
    if (!how) return;
    const plan = /bank|bonif/i.test(how) ? 'bank_transfer' : 'cash';
    const { error } = await db.from('membership_applications')
      .update({ status: 'paid', payment_plan: plan, paid_at: new Date().toISOString() })
      .eq('id', id).eq('status', 'submitted');
    if (error) { alert('Could not record that: ' + error.message); return; }
    delete cache.apps;
    render();
  }

  async function recordLapse(id) {
    if (!confirm('Record that this membership lapsed (Art. 5)? The person goes back to ISOT Community. This needs the written reminder to have been sent at least 60 days ago.')) return;
    const { error } = await db.rpc('record_lapse', { p_membership: id });
    if (error) { alert(error.message); return; }
    delete cache.apps; delete cache.members;
    render();
  }

  function paperForm() {
    return `
      <form id="paperForm" class="card" onsubmit="savePaper(event)" style="padding:14px">
        <p class="dim" style="font-size:0.8rem;margin-bottom:10px">For a form signed on paper. Scan or photograph it as a PDF first. <a href="/api/admission-form" target="_blank" rel="noopener">Print a blank form</a>.</p>
        <div class="two">
          <div class="field"><label>First name</label><input name="first_name" required /></div>
          <div class="field"><label>Last name</label><input name="last_name" required /></div>
          <div class="field"><label>Date of birth</label><input name="birth_date" type="date" required /></div>
          <div class="field"><label>Place of birth</label><input name="birth_place" required /></div>
        </div>
        <div class="field"><label>Residential address</label><input name="residence_address" required /></div>
        <div class="two">
          <div class="field"><label>Email</label><input name="email" type="email" required /></div>
          <div class="field"><label>Codice fiscale</label><input name="codice_fiscale" maxlength="16" /></div>
        </div>

            <select name="payment"><option value="cash">Paid in cash</option><option value="bank_transfer">Paid by bank transfer</option><option value="">Not paid yet</option></select></div>
          <div class="field"><label>Signed form (PDF)</label><input name="pdf" type="file" accept="application/pdf" required /></div>
        </div>
        <button type="submit" class="btn btn-pink mini" id="paperBtn">Save paper application</button>
      </form>`;
  }

  async function savePaper(e) {
    e.preventDefault();
    const f = new FormData(e.target);
    const file = f.get('pdf');
    if (!file || file.type !== 'application/pdf') { alert('Attach the signed form as a PDF.'); return; }
    const done = busy(document.getElementById('paperBtn'), 'Saving…');
    const email = String(f.get('email')).trim().toLowerCase();
    // Link to their app account when the email matches one, so the card updates on admission.
    const { data: prof } = await db.from('profiles').select('id').ilike('email', email).maybeSingle();
    const payment = f.get('payment');
    const row = {
      profile_id: prof?.id || null,
      channel: 'paper',
      first_name: String(f.get('first_name')).trim(),
      last_name: String(f.get('last_name')).trim(),
      birth_date: f.get('birth_date'),
      birth_place: String(f.get('birth_place')).trim(),
      residence_address: String(f.get('residence_address')).trim(),
      email,
      codice_fiscale: String(f.get('codice_fiscale') || '').trim().toUpperCase() || null,
      accepts_statute: true,
      privacy_ack: true,
      privacy_version: 'paper-2026-10',
      payment_plan: payment || 'cash',
      status: payment ? 'paid' : 'submitted',
      paid_at: payment ? new Date().toISOString() : null,
    };
    const { data: ins, error } = await db.from('membership_applications').insert(row).select('id').single();
    if (error) { done(); alert('Could not save: ' + error.message); return; }
    const path = `paper/${new Date().getFullYear()}/${ins.id}.pdf`;
    const up = await db.storage.from('admission-forms').upload(path, file, { contentType: 'application/pdf' });
    if (up.error) { done(); alert('Saved, but the PDF did not upload: ' + up.error.message); }
    else await db.from('membership_applications').update({ pdf_path: path }).eq('id', ins.id);
    done();
    delete cache.apps;
    render();
  }

  /* ── Graphics briefs ─────────────────────────────────────────────────── */
  // Produces one complete brief to hand a designer, and keeps it. The brand rules ride
  // along with every brief because they are exactly what gets left out of a WhatsApp
  // thread — including the one that bites: Moderna has no digits.
  const BRIEF_TYPES  = ['Karaoke', 'Social Hub', 'Pre-Party', 'Cultural night',
                        'Career / workshop', 'Sport / trip', 'Announcement'];
  const BRIEF_MOODS  = ['Energetic', 'Warm & cosy', 'Elegant', 'Playful', 'Cultural', 'Bold'];
  const BRIEF_FORMATS = [
    ['instagram_post', 'Instagram post', '1080×1350'],
    ['story',          'Story',          '1080×1920'],
    ['whatsapp',       'WhatsApp',       '1080×1080'],
    ['poster',         'Printed poster', 'A3'],
  ];

  let briefDraft = { event_type: BRIEF_TYPES[1], mood: BRIEF_MOODS[0], formats: ['instagram_post'] };

  async function renderGraphics(el) {
    const { data, error } = await db.from('graphic_briefs')
      .select('*').order('created_at', { ascending: false }).limit(25);
    if (error) { el.innerHTML = fail(error.message); return; }

    const d = briefDraft;
    el.innerHTML = `
      <div class="card card-glass" style="padding:16px">
        <div class="eyebrow" style="margin-bottom:12px">New brief</div>

        <div class="field">
          <label>What is it</label>
          <input type="text" id="bTitle" maxlength="120" placeholder="Thursday Social Hub — WGM opening" />
        </div>

        <div class="field">
          <label>Event type</label>
          <div class="sub" id="bTypes">
            ${BRIEF_TYPES.map(t => `
              <button type="button" class="subbtn ${d.event_type === t ? 'on' : ''}"
                      onclick="pickBriefType('${t}')">${escapeHtml(t)}</button>`).join('')}
          </div>
        </div>

        <div class="field">
          <label>Mood</label>
          <div class="sub" id="bMoods">
            ${BRIEF_MOODS.map(m => `
              <button type="button" class="subbtn ${d.mood === m ? 'on' : ''}"
                      onclick="pickBriefMood('${m}')">${escapeHtml(m)}</button>`).join('')}
          </div>
        </div>

        <div class="field">
          <label>Formats needed</label>
          <div class="sub">
            ${BRIEF_FORMATS.map(([k, label, size]) => `
              <button type="button" class="subbtn ${d.formats.includes(k) ? 'on' : ''}"
                      onclick="toggleBriefFormat('${k}')">${escapeHtml(label)}
                <span style="opacity:.55">${size}</span></button>`).join('')}
          </div>
        </div>

        <div class="two">
          <div class="field"><label>Date</label><input type="date" id="bDate" /></div>
          <div class="field"><label>Start time</label><input type="time" id="bTime" /></div>
        </div>

        <div class="field"><label>Venue</label>
          <input type="text" id="bVenue" maxlength="120" placeholder="Capodoglio · Murazzi" /></div>

        <div class="field"><label>Line-up / guests</label>
          <input type="text" id="bLineup" maxlength="200" placeholder="beaddie, chiuraz" /></div>

        <div class="field"><label>Text that must appear exactly</label>
          <textarea id="bMust" rows="2" maxlength="400"
            placeholder="Free entry until 23:30 — after that 5€"></textarea></div>

        <div class="field"><label>Anything else</label>
          <textarea id="bNotes" rows="2" maxlength="400"
            placeholder="Reuse the vinyl illustration from September"></textarea></div>

        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button type="button" class="btn btn-pink mini" onclick="buildBrief()">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Build brief</button>
          <button type="button" class="btn btn-outline mini" onclick="buildBrief(true)">
            <i class="fa-solid fa-floppy-disk"></i> Build &amp; save</button>
        </div>

        <div id="briefOut" hidden style="margin-top:14px">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px">
            <div class="eyebrow" style="margin:0">Ready to send</div>
            <button type="button" class="btn btn-outline mini" onclick="copyBrief()">
              <i class="fa-regular fa-copy"></i> Copy</button>
          </div>
          <textarea id="briefText" rows="18" readonly
            style="width:100%;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
                   font-size:0.74rem;line-height:1.55;background:var(--bg-darker);
                   border:1px solid var(--border-light);border-radius:12px;padding:12px;
                   color:var(--text-main)"></textarea>
        </div>
      </div>

      <div class="eyebrow" style="margin:20px 0 8px">Recent briefs</div>
      ${(data || []).length ? `<div class="card card-glass" style="padding:4px 16px">
        ${data.map(b => `
          <div class="row">
            <div class="grow">
              <b>${escapeHtml(b.title)}</b>
              <div class="dim" style="font-size:0.74rem;margin-top:2px">
                ${escapeHtml(b.event_type || '—')}
                ${b.event_date ? ' · ' + b.event_date : ''}
                ${(b.formats || []).length ? ' · ' + b.formats.length + ' format(s)' : ''}
                · ${ago(b.created_at)}
              </div>
            </div>
            <span class="tag ${b.status === 'done' ? '' : 'gold'}">${escapeHtml(b.status)}</span>
            <button type="button" class="btn btn-outline mini" onclick="reopenBrief('${b.id}')">Open</button>
          </div>`).join('')}
      </div>` : `<p class="dim" style="font-size:0.84rem">No briefs yet.</p>`}`;

    // Re-apply anything already typed, so switching a pill does not wipe the form.
    ['bTitle','bDate','bTime','bVenue','bLineup','bMust','bNotes'].forEach(id => {
      if (d[id] != null) { const n = document.getElementById(id); if (n) n.value = d[id]; }
    });
    if (d.output) {
      document.getElementById('briefText').value = d.output;
      document.getElementById('briefOut').hidden = false;
    }
  }

  // The pills re-render the panel, so stash the typed fields first.
  function keepBriefFields() {
    ['bTitle','bDate','bTime','bVenue','bLineup','bMust','bNotes'].forEach(id => {
      const n = document.getElementById(id);
      if (n) briefDraft[id] = n.value;
    });
  }
  function pickBriefType(t) { keepBriefFields(); briefDraft.event_type = t; render(); }
  function pickBriefMood(m) { keepBriefFields(); briefDraft.mood = m; render(); }
  function toggleBriefFormat(k) {
    keepBriefFields();
    const f = briefDraft.formats;
    briefDraft.formats = f.includes(k) ? f.filter(x => x !== k) : [...f, k];
    render();
  }

  async function buildBrief(save) {
    keepBriefFields();
    const d = briefDraft;
    if (!(d.bTitle || '').trim()) { alert('Give the brief a title first.'); return; }

    const fmt = BRIEF_FORMATS.filter(([k]) => d.formats.includes(k))
                             .map(([, label, size]) => `  · ${label} — ${size}`).join('\n')
             || '  · (not specified)';

    // Spelled out, not ISO. A designer reads "Thursday 2 October" and catches a wrong
    // weekday instantly; nobody proofreads 2026-10-02.
    const niceDate = d.bDate
      ? new Date(d.bDate + 'T12:00:00Z').toLocaleDateString('en-GB',
          { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' })
      : '';
    const when = [niceDate, d.bTime].filter(Boolean).join('   ·   ');

    const out = `ISOT — GRAPHIC BRIEF
${'='.repeat(46)}

${d.bTitle.trim()}
Type: ${d.event_type}${d.mood ? `   ·   Mood: ${d.mood}` : ''}

${when   ? `WHEN\n  ${when}\n` : ''}${d.bVenue  ? `WHERE\n  ${d.bVenue}\n` : ''}${d.bLineup ? `LINE-UP\n  ${d.bLineup}\n` : ''}
FORMATS
${fmt}
${d.bMust ? `\nMUST APPEAR EXACTLY\n  ${d.bMust.split('\n').join('\n  ')}\n` : ''}${d.bNotes ? `\nNOTES\n  ${d.bNotes.split('\n').join('\n  ')}\n` : ''}
${'-'.repeat(46)}
BRAND RULES — these are not suggestions

COLOUR  (black + gold + lavender only, NO teal/green)
  Background      #080808
  Accent / times  #FFB81F   gold
  Secondary       #B191FF   lavender
  Text            #FFFFFF

TYPE
  Moderna    — titles only, ALWAYS ALL CAPS
  Myanmar    — body text, and EVERY number

  ⚠ Moderna has no digits. 0-9 and the comma are mapped to the
    "#" glyph, so "4,000" set in Moderna renders as "#####".
    All numbers, dates and times must be set in Myanmar.

LOGO
  ISOT wordmark, white, clear space on all sides.

Motto: "Live globally, connect locally."
`;

    briefDraft.output = out;
    const outEl = document.getElementById('briefOut');
    document.getElementById('briefText').value = out;
    outEl.hidden = false;

    if (save) {
      const { error } = await db.from('graphic_briefs').insert({
        title:        d.bTitle.trim(),
        event_type:   d.event_type,
        mood:         d.mood,
        formats:      d.formats,
        event_date:   d.bDate  || null,
        start_time:   d.bTime  || null,
        venue:        d.bVenue || null,
        lineup:       d.bLineup || null,
        must_include: d.bMust  || null,
        notes:        d.bNotes || null,
        created_by:   me.id,
      });
      if (error) { alert(error.message); return; }
      briefDraft = { event_type: d.event_type, mood: d.mood, formats: d.formats, output: out };
      render();
    }
  }

  async function copyBrief() {
    const t = document.getElementById('briefText');
    try {
      await navigator.clipboard.writeText(t.value);
      alert('Brief copied — paste it to the designer.');
    } catch (_) {
      // Clipboard API needs a secure context and permission; selecting the text at least
      // leaves the user one keystroke away.
      t.removeAttribute('readonly'); t.select(); t.setAttribute('readonly', '');
      alert('Select-all is done — press Cmd+C to copy.');
    }
  }

  async function reopenBrief(id) {
    const { data, error } = await db.from('graphic_briefs').select('*').eq('id', id).single();
    if (error) { alert(error.message); return; }
    briefDraft = {
      event_type: data.event_type || BRIEF_TYPES[1],
      mood:       data.mood       || BRIEF_MOODS[0],
      formats:    data.formats    || [],
      bTitle: data.title || '', bDate: data.event_date || '',
      bTime:  data.start_time ? String(data.start_time).slice(0,5) : '',
      bVenue: data.venue || '', bLineup: data.lineup || '',
      bMust:  data.must_include || '', bNotes: data.notes || '',
    };
    render();
    buildBrief(false);
  }

  /* ── Proposals ───────────────────────────────────────────────────────── */
  // Member-proposed activities. Moderation after the fact, not an approval queue: the
  // votes decide, and the board steps in only to remove something or to override.
  async function renderProposals(el) {
    const { data, error } = await db.rpc('board_proposals', { p_from: null, p_to: null });
    if (error) { el.innerHTML = fail(error.message); return; }

    const rows = data || [];
    if (!rows.length) {
      el.innerHTML = `<div class="card card-glass" style="text-align:center;padding:30px 18px">
          <p class="dim" style="font-size:0.88rem;margin:0">
            Nothing proposed in the last week or the next two.</p></div>`;
      return;
    }

    const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Rome',
      year:'numeric', month:'2-digit', day:'2-digit' }).format(new Date());

    // Grouped by day, because "one winner per day" is the rule the board is overseeing.
    const byDay = {};
    rows.forEach(r => { (byDay[r.activity_date] ||= []).push(r); });

    const STATUS = {
      pending:   ['Waiting for you', '#FFECBD'],
      confirmed: ['Confirmed', 'var(--green)'],
      open:      ['On the ballot', 'var(--pink)'],
      lost:      ['Did not win', 'var(--text-dim)'],
      hidden:    ['Rejected',  '#FF5A3C'],
    };

    // Anything waiting on the board goes to the top, ahead of the day grouping: it is a
    // queue to clear, not a log to read.
    const waiting = rows.filter(r => r.status === 'pending');
    const queueHtml = waiting.length ? `
      <div style="border:1px solid rgba(232,200,112,.4);background:rgba(232,200,112,.07);
                  border-radius:16px;padding:14px 16px;margin-bottom:22px">
        <div class="eyebrow" style="color:#FFECBD;margin-bottom:10px">
          <i class="fa-solid fa-hourglass-half"></i>
          ${waiting.length} waiting for approval
        </div>
        ${waiting.map(r => {
          const d = new Date(r.activity_date + 'T12:00:00Z');
          return `
          <div style="padding:11px 0;border-top:1px solid rgba(255,255,255,.07)">
            <div style="font-weight:700;color:#FFF;font-size:0.92rem">${escapeHtml(r.title)}</div>
            <div class="dim" style="font-size:0.75rem;margin-top:3px">
              ${escapeHtml(d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'}))}
              · ${String(r.start_time).slice(0,5)}
              ${r.place_name ? ' · ' + escapeHtml(r.place_name) : ''}
              ${r.is_pinned ? ' · <span style="color:#FFECBD">dropped pin</span>' : ''}
            </div>
            <div class="dim" style="font-size:0.72rem;margin-top:2px">
              by ${escapeHtml(r.proposer_name || 'Unknown')}</div>
            ${r.description ? `<div class="dim" style="font-size:0.76rem;margin-top:5px;line-height:1.45">${escapeHtml(r.description)}</div>` : ''}
            <div style="display:flex;gap:8px;margin-top:9px;flex-wrap:wrap">
              <button type="button" class="btn btn-pink mini" onclick="approveProposal('${r.id}')">
                <i class="fa-solid fa-check"></i> Approve</button>
              <button type="button" class="btn btn-outline mini" onclick="hideProposal('${r.id}', true)">
                <i class="fa-solid fa-xmark"></i> Reject</button>
              ${r.lat ? `<a class="btn btn-outline mini" target="_blank" rel="noopener"
                 href="https://www.google.com/maps?q=${r.lat},${r.lng}">
                 <i class="fa-solid fa-location-dot"></i> Where</a>` : ''}
            </div>
          </div>`;
        }).join('')}
      </div>` : '';

    el.innerHTML = queueHtml + Object.entries(byDay).map(([day, list]) => {
      const d = new Date(day + 'T12:00:00Z');
      const label = d.toLocaleDateString('en-GB',
        { weekday:'long', day:'numeric', month:'short', timeZone:'UTC' });
      return `
        <div style="margin-bottom:18px">
          <div class="eyebrow" style="margin-bottom:8px">
            ${escapeHtml(label)}${day === today ? ' · today' : ''}
          </div>
          <div class="card card-glass" style="padding:6px 16px">
            ${list.map(r => {
              const [txt, col] = STATUS[r.status] || ['?', 'var(--text-dim)'];
              return `
              <div style="padding:12px 0;border-top:1px solid var(--border-light)">
                <div style="display:flex;align-items:flex-start;gap:10px">
                  <div style="flex:1;min-width:0">
                    <div style="font-weight:700;color:#FFF;font-size:0.92rem">
                      ${escapeHtml(r.title)}</div>
                    <div class="dim" style="font-size:0.75rem;margin-top:3px">
                      ${String(r.start_time).slice(0,5)}
                      ${r.place_name ? ' · ' + escapeHtml(r.place_name) : ''}
                      ${r.is_pinned ? ' · <span style="color:#FFECBD">dropped pin</span>' : ''}
                    </div>
                    <div class="dim" style="font-size:0.72rem;margin-top:2px">
                      by ${escapeHtml(r.proposer_name || 'Unknown')}
                      ${r.proposer_code ? '· ' + escapeHtml(r.proposer_code) : ''}
                    </div>
                    ${r.description ? `<div class="dim" style="font-size:0.76rem;margin-top:5px;line-height:1.45">${escapeHtml(r.description)}</div>` : ''}
                  </div>
                  <div style="text-align:right;flex-shrink:0">
                    <div style="font-size:1.1rem;font-weight:700;color:#FFF">${r.votes}</div>
                    <div class="dim" style="font-size:0.6rem;letter-spacing:0.08em;text-transform:uppercase">going</div>
                    <div style="font-size:0.62rem;font-weight:700;color:${col};margin-top:4px">${txt}</div>
                  </div>
                </div>
                <div style="display:flex;gap:8px;margin-top:9px;flex-wrap:wrap">
                  ${r.status === 'pending' ? `
                    <button type="button" class="btn btn-pink mini"
                            onclick="approveProposal('${r.id}')">
                      <i class="fa-solid fa-check"></i> Approve</button>` : ''}
                  ${r.status !== 'confirmed' && r.status !== 'hidden' && r.status !== 'pending' ? `
                    <button type="button" class="btn btn-outline mini"
                            onclick="confirmProposal('${r.id}')">
                      <i class="fa-solid fa-check"></i> Confirm this one</button>` : ''}
                  ${r.status === 'hidden' ? `
                    <button type="button" class="btn btn-outline mini"
                            onclick="hideProposal('${r.id}', false)">
                      <i class="fa-solid fa-rotate-left"></i> Restore</button>`
                  : `
                    <button type="button" class="btn btn-outline mini"
                            onclick="hideProposal('${r.id}', true)">
                      <i class="fa-solid fa-eye-slash"></i> Hide</button>`}
                  ${r.lat ? `
                    <a class="btn btn-outline mini" target="_blank" rel="noopener"
                       href="https://www.google.com/maps?q=${r.lat},${r.lng}">
                      <i class="fa-solid fa-location-dot"></i> Where</a>` : ''}
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>`;
    }).join('');
  }

  async function approveProposal(id) {
    const { error } = await db.rpc('approve_proposal', { p_id: id });
    if (error) { alert(error.message); return; }
    render();
  }

  async function hideProposal(id, hide) {
    if (hide && !confirm('Reject this proposal? The member is not told why, so tell them yourself if it matters. You can restore it later.')) return;
    const { error } = await db.rpc('set_proposal_hidden', { p_id: id, p_hidden: hide });
    if (error) { alert(error.message); return; }
    render();
  }

  async function confirmProposal(id) {
    if (!confirm('Confirm this one for its day? It overrides the vote, and anything else proposed that day is closed.')) return;
    const { error } = await db.rpc('board_confirm_proposal', { p_id: id });
    if (error) { alert(error.message); return; }
    render();
  }

  /* ── Activity ────────────────────────────────────────────────────────── */
  async function renderActivity(el) {
    el.innerHTML = `
      <div class="sub">
        <button type="button" class="subbtn ${feedView === 'activity' ? 'on' : ''}" onclick="setFeed('activity')">What happened</button>
        <button type="button" class="subbtn ${feedView === 'signins'  ? 'on' : ''}" onclick="setFeed('signins')">Sign-ins</button>
        <button type="button" class="subbtn ${feedView === 'signups'  ? 'on' : ''}" onclick="setFeed('signups')">Signup log</button>
      </div>
      <div class="card card-glass" style="padding:4px 16px"><div id="feed">
        <div class="spinner" style="margin:26px auto"></div>
      </div></div>`;
    await paintFeed();
  }

  function setFeed(v) { feedView = v; render(); }

  async function paintFeed() {
    const el = document.getElementById('feed');
    const key = 'feed_' + feedView;

    if (!cache[key]) {
      let res;
      if (feedView === 'activity')     res = await db.rpc('monitor_activity', { p_days: 30, p_limit: 200 });
      else if (feedView === 'signins') res = await db.rpc('monitor_signins',  { p_days: 14, p_limit: 100 });
      else res = await db.from('signup_events').select('*').order('at', { ascending: false }).limit(100);
      if (res.error) { el.innerHTML = fail(res.error.message); return; }
      cache[key] = res.data || [];
    }

    const rows = cache[key];
    if (!rows.length) {
      // "No records available" is not "nobody signed in" — say which it is.
      const empty = {
        activity: 'Nothing recorded in the last 30 days.',
        signins:  'No sign-in records available. GoTrue keeps its own audit trail and this database role may not be able to read it — that is different from nobody signing in.',
        signups:  'No signup attempts logged yet.',
      }[feedView];
      el.innerHTML = `<p class="dim" style="padding:26px 0;text-align:center;font-size:0.86rem">${empty}</p>`;
      return;
    }

    el.innerHTML = rows.map(r => {
      if (feedView === 'signins') return `
        <div class="row"><div class="when">${escapeHtml(ago(r.at))}</div>
        <div class="grow"><b>${escapeHtml(r.email)}</b> — ${escapeHtml(r.action)}</div></div>`;

      if (feedView === 'signups') return `
        <div class="row"><div class="when">${escapeHtml(ago(r.at))}</div>
        <div class="grow"><b>${escapeHtml(r.email || '—')}</b> · ${escapeHtml(r.outcome)}
        ${r.detail ? `<div style="color:#FFD8CF;font-size:0.78rem">${escapeHtml(r.detail)}</div>` : ''}</div>
        <span class="tag${r.outcome === 'failed' ? '' : ''}">${escapeHtml(r.source)}</span></div>`;

      return `
        <div class="row"><div class="when">${escapeHtml(ago(r.at))}</div>
        <div class="grow"><b>${escapeHtml(r.actor_name || 'Someone')}</b> ${escapeHtml(r.action)}
        ${r.subject ? ' — ' + escapeHtml(r.subject) : ''}
        ${r.detail ? `<div class="dim" style="font-size:0.76rem">${escapeHtml(r.detail)}</div>` : ''}</div>
        <span class="tag">${escapeHtml(r.kind)}</span></div>`;
    }).join('');
  }

  /* ── Events ──────────────────────────────────────────────────────────── */
  async function renderEvents(el) {
    if (eventsView === 'editor') { await renderEventEditor(el); return; }

    if (!cache.events) {
      const iso = d => d.toISOString().slice(0, 10);
      const { data, error } = await db.rpc('calendar_between', {
        p_from: iso(new Date()),
        p_to:   iso(new Date(Date.now() + 42 * 86400000)),
      });
      if (error) { el.innerHTML = fail(error.message); return; }
      cache.events = data || [];
    }

    const head = eventsSubNav();

    if (!cache.events.length) {
      el.innerHTML = head +
        '<p class="dim" style="padding:26px 0;text-align:center;font-size:0.86rem">Nothing scheduled in the next six weeks.</p>';
      return;
    }

    el.innerHTML = head + `<div class="card card-glass" style="padding:4px 16px">` +
      cache.events.map(e => {
        const when = new Date(e.event_date + 'T00:00:00')
          .toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' });
        const doors = e.doors_time && e.doors_time !== e.start_time
          ? ' · doors ' + escapeHtml(e.doors_time.slice(0, 5)) : '';
        return `
        <div class="row">
          <div class="when">${escapeHtml(when)}</div>
          ${e.cover_image
            ? `<img src="${escapeHtml(e.cover_image)}" alt=""
                    style="width:34px;height:44px;object-fit:cover;border-radius:6px;flex-shrink:0" />`
            : ''}
          <div class="grow">
            <b>${escapeHtml(e.title)}</b>
            <div class="dim" style="font-size:0.76rem">
              ${escapeHtml((e.start_time || '').slice(0, 5))}${doors} · ${escapeHtml(e.venue_name || '')} · ${e.going_count} going
            </div>
          </div>
          <button type="button" class="btn btn-outline mini" onclick="editEvent('${e.event_id}')">Edit</button>
          <button type="button" class="btn btn-outline mini"
                  onclick="cancelNight(${jsArg(e.event_id)}, ${jsArg(e.event_date)}, ${jsArg(e.title)})">
            Cancel
          </button>
        </div>`;
      }).join('') + `</div>
      <p class="dim" style="font-size:0.76rem;margin-top:10px">
        Cancelling removes that one night only — the weekly event keeps running.
        Edit changes the event itself, so for a weekly night it changes every future week.
      </p>`;
  }

  function eventsSubNav() {
    return `<div class="sub">
      <button type="button" class="subbtn ${eventsView === 'schedule' ? 'on' : ''}"
              onclick="setEventsView('schedule')">Schedule</button>
      <button type="button" class="subbtn ${eventsView === 'editor' ? 'on' : ''}"
              onclick="newEvent()">Add an event</button>
    </div>`;
  }

  function setEventsView(v) { eventsView = v; render(); }

  function newEvent() {
    editing = { one_off_date: '', start_time: '21:00', category: 'social' };
    eventsView = 'editor';
    render();
  }

  async function editEvent(id) {
    const { data, error } = await db.from('events').select('*').eq('id', id).single();
    if (error) { alert('Could not open that event: ' + error.message); return; }
    editing = data;
    eventsView = 'editor';
    render();
  }

  /* ── Event editor: the data and the poster ───────────────────────────── */
  async function renderEventEditor(el) {
    // Deliberately not cache.venues — the Venues section caches a wider column set
    // under that key, and sharing it would leave that page missing fields.
    if (!cache.venueOptions) {
      const { data, error } = await db.from('venues').select('id, name').eq('active', true).order('name');
      if (error) { el.innerHTML = eventsSubNav() + fail(error.message); return; }
      cache.venueOptions = data || [];
    }

    const e = editing || {};
    const isNew = !e.id;
    const cats = ['social', 'party', 'karaoke', 'drinks', 'career', 'sports'];
    const val = v => escapeHtml(v == null ? '' : String(v));
    const t = v => v ? String(v).slice(0, 5) : '';

    el.innerHTML = eventsSubNav() + `
      <div class="card card-glass" style="padding:18px">
        <h2 style="font-size:1.05rem;color:#FFF;margin:0 0 4px">
          ${isNew ? 'New event' : 'Editing ' + escapeHtml(e.title || '')}
        </h2>
        <p class="dim" style="font-size:0.78rem;margin:0 0 16px">
          ${e.is_recurring
            ? 'This is a weekly event. Changes apply to every future occurrence.'
            : 'A one-off night on a single date.'}
        </p>

        <div class="field">
          <label for="fTitle">Title</label>
          <input id="fTitle" type="text" value="${val(e.title)}" placeholder="Rough — Season Warm-Up" />
        </div>

        <div class="field">
          <label for="fDesc">Description</label>
          <textarea id="fDesc" rows="3"
            placeholder="One or two lines, shown under the title.">${val(e.description)}</textarea>
        </div>

        ${e.is_recurring ? '' : `
        <div class="field">
          <label for="fDate">Date</label>
          <input id="fDate" type="date" value="${val(e.one_off_date)}" />
        </div>`}

        <div class="two">
          <div class="field">
            <label for="fDoors">Doors <span class="dim" style="font-weight:400">(optional)</span></label>
            <input id="fDoors" type="time" value="${val(t(e.doors_time))}" />
          </div>
          <div class="field">
            <label for="fStart">Start</label>
            <input id="fStart" type="time" value="${val(t(e.start_time)) || '21:00'}" />
          </div>
        </div>

        <div class="two">
          <div class="field">
            <label for="fVenue">Venue</label>
            <select id="fVenue">
              ${cache.venueOptions.map(v => `<option value="${val(v.id)}" ${v.id === e.venue_id ? 'selected' : ''}>
                ${escapeHtml(v.name)}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label for="fCat">Category</label>
            <select id="fCat">
              ${cats.map(c => `<option value="${c}" ${c === e.category ? 'selected' : ''}>${c}</option>`).join('')}
            </select>
          </div>
        </div>

        <div class="field">
          <label for="fRegUrl">Registration link <span class="dim" style="font-weight:400">— optional</span></label>
          <input id="fRegUrl" type="url" inputmode="url" placeholder="https://forms.gle/..." value="${val(e.register_url)}" />
          <p class="dim" style="font-size:0.74rem;margin-top:4px">
            A Google Form, ticket page or sign-up sheet. Leave empty for the weekly nights,
            which need no booking. Must start with http:// or https://.
          </p>
        </div>

        <div class="field">
          <label for="fRegLabel">Button text <span class="dim" style="font-weight:400">— optional</span></label>
          <input id="fRegLabel" type="text" placeholder="Book a place" value="${val(e.register_label)}" />
        </div>

        <div class="field">
          <label>Poster</label>
          <div class="drop" id="drop" tabindex="0" role="button"
               aria-label="Choose a poster image">
            ${e.cover_image
              ? `<img id="posterPreview" src="${val(e.cover_image)}" alt="Current poster" />
                 <div class="hint">Tap to replace</div>`
              : `<i class="fa-solid fa-image"></i>
                 <div class="hint">Tap to choose, or drop an image here<br />JPG, PNG or WebP</div>`}
          </div>
          <input id="fFile" type="file" accept="image/jpeg,image/png,image/webp" style="display:none" />
          <p class="dim" style="font-size:0.74rem;margin-top:8px">
            Resized to 1200px and re-encoded before upload, so a phone photo or a full-size
            export is fine.
          </p>
        </div>

        <div id="saveNote" style="display:none;margin-bottom:10px"></div>

        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button type="button" class="btn btn-sm btn-pink" style="width:auto;padding:11px 22px" id="saveBtn"
                  onclick="saveEvent()">${isNew ? 'Create event' : 'Save changes'}</button>
          <button type="button" class="btn btn-sm btn-outline" style="width:auto;padding:11px 20px"
                  onclick="setEventsView('schedule')">Cancel</button>
        </div>
      </div>`;

    wirePosterPicker();
  }

  /* Picking, previewing and shrinking the poster — all client side. The file is not
     uploaded until the event is saved, so abandoning the form leaves no orphan in the
     bucket. */
  let pendingPoster = null;

  function wirePosterPicker() {
    pendingPoster = null;
    const drop = document.getElementById('drop');
    const file = document.getElementById('fFile');
    if (!drop || !file) return;

    drop.onclick = () => file.click();
    drop.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); file.click(); } };
    file.onchange = () => { if (file.files && file.files[0]) acceptPoster(file.files[0]); };

    drop.ondragover = ev => { ev.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave = () => drop.classList.remove('over');
    drop.ondrop = ev => {
      ev.preventDefault();
      drop.classList.remove('over');
      const f = ev.dataTransfer.files && ev.dataTransfer.files[0];
      if (f) acceptPoster(f);
    };
  }

  async function acceptPoster(file) {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) {
      alert('That needs to be a JPG, PNG or WebP image.');
      return;
    }
    try {
      pendingPoster = await shrinkImage(file);
      const drop = document.getElementById('drop');
      drop.innerHTML = `<img src="${URL.createObjectURL(pendingPoster)}" alt="Poster to upload" />
        <div class="hint">${Math.round(pendingPoster.size / 1024)} KB · tap to replace</div>`;
    } catch (err) {
      alert('Could not read that image: ' + (err.message || err));
    }
  }

  // shrinkImage() lives in js/isot.js — shared with the gem photo upload.

  function slugify(s) {
    return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);
  }

  // events.slug is UNIQUE, so a one-off carries its date and anything else gets a
  // timestamp. Two nights called "Warm-Up" must not collide on save.
  function buildSlug(title, date) {
    const base = slugify(title) || 'event';
    return date ? `${base}-${date.replace(/-/g, '')}` : `${base}-${Date.now()}`;
  }

  function note(msg, bad) {
    const el = document.getElementById('saveNote');
    if (!el) return;
    el.style.display = '';
    el.className = 'prob ' + (bad ? 'critical' : 'ok');
    el.innerHTML = `<div style="font-size:0.84rem">${escapeHtml(msg)}</div>`;
  }

  async function saveEvent() {
    const btn = document.getElementById('saveBtn');
    const e = editing || {};
    const isNew = !e.id;

    const title = document.getElementById('fTitle').value.trim();
    const start = document.getElementById('fStart').value;
    const doors = document.getElementById('fDoors').value;
    const dateEl = document.getElementById('fDate');
    const date = dateEl ? dateEl.value : null;

    if (!title)  { note('Give the event a title.', true); return; }
    if (!start)  { note('Set a start time.', true); return; }
    if (dateEl && !date) { note('Pick a date.', true); return; }
    if (doors && doors > start) { note('Doors cannot be after the start time.', true); return; }

    btn.disabled = true;
    const original = btn.textContent;
    btn.textContent = 'Saving…';

    try {
      const row = {
        title,
        description: document.getElementById('fDesc').value.trim() || null,
        venue_id:    document.getElementById('fVenue').value,
        category:    document.getElementById('fCat').value,
        start_time:  start,
        doors_time:  doors || null,
        // Empty string is not "no link" — it would fail the http(s) CHECK constraint.
        register_url:   document.getElementById('fRegUrl').value.trim() || null,
        register_label: document.getElementById('fRegLabel').value.trim() || null,
      };
      if (dateEl) {
        row.one_off_date = date;
        row.is_recurring = false;
        row.weekday      = null;
      }

      // Upload the poster first: if Storage rejects it, nothing has been written yet
      // and the event is not left pointing at an image that does not exist.
      if (pendingPoster) {
        btn.textContent = 'Uploading poster…';
        const path = `${slugify(title) || 'event'}-${Date.now()}.jpg`;
        const { error: upErr } = await db.storage.from('event-graphics')
          .upload(path, pendingPoster, { contentType: 'image/jpeg', upsert: false });
        if (upErr) throw new Error('Poster upload failed — ' + upErr.message);
        row.cover_image = db.storage.from('event-graphics').getPublicUrl(path).data.publicUrl;
      }

      btn.textContent = 'Saving…';
      if (isNew) {
        row.slug = buildSlug(title, date);
        const { error } = await db.from('events').insert(row);
        if (error) throw error;
      } else {
        const { error } = await db.from('events').update(row).eq('id', e.id);
        if (error) throw error;
      }

      delete cache.events;
      pendingPoster = null;
      eventsView = 'schedule';
      render();
    } catch (err) {
      note(err.message || String(err), true);
      btn.disabled = false;
      btn.textContent = original;
    }
  }

  async function cancelNight(eventId, date, title) {
    const reason = prompt(`Cancel ${title} on ${date}?\n\nReason (shown to nobody, kept for the record):`, 'Closed');
    if (reason === null) return;
    const { error } = await db.from('event_exceptions')
      .insert({ event_id: eventId, event_date: date, reason: reason || 'Cancelled' });
    if (error) { alert('Could not cancel: ' + error.message); return; }
    delete cache.events;
    render();
  }

  /* ── Venues ──────────────────────────────────────────────────────────── */
  async function renderVenues(el) {
    if (!cache.venues) {
      // The board can read the venues table itself, which is where the poster tokens
      // and the monthly contribution live — neither is in venue_public.
      const { data, error } = await db.from('venues')
        .select('id, name, address, neighbourhood, monthly_fee_eur, member_discount, discount_active, self_checkin_token, active')
        .order('name');
      if (error) { el.innerHTML = fail(error.message); return; }
      cache.venues = data || [];
    }

    el.innerHTML = cache.venues.map(v => `
      <div class="card card-glass" style="padding:16px;margin-bottom:10px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
          <b style="color:#FFF;font-size:1.02rem">${escapeHtml(v.name)}</b>
          ${v.active ? '' : '<span class="tag">inactive</span>'}
        </div>
        <div class="dim" style="font-size:0.8rem">${escapeHtml(v.neighbourhood || v.address || '')}</div>
        <div style="display:flex;gap:16px;margin-top:10px;flex-wrap:wrap;font-size:0.82rem">
          <div><span class="dim">Contribution</span><br /><b>${v.monthly_fee_eur ? '€' + v.monthly_fee_eur + '/mo' : '—'}</b></div>
          <div><span class="dim">Member offer</span><br /><b>${escapeHtml(v.member_discount || '—')}</b></div>
        </div>
        <div style="margin-top:12px">
          <div class="dim" style="font-size:0.72rem;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:4px">Poster check-in QR</div>
          <div class="code">https://isotcommunity.com/checkin?v=${escapeHtml(v.self_checkin_token)}</div>
          <button type="button" class="btn btn-outline mini" style="margin-top:8px"
                  onclick="copyPoster(${jsArg(v.self_checkin_token)}, this)">Copy link</button>
        </div>
      </div>`).join('') + `
      <p class="dim" style="font-size:0.76rem">
        These links are secrets — anyone holding one can check in without being at the venue.
        Put them on the printed poster and nowhere else.
      </p>`;
  }

  async function copyPoster(token, btn) {
    const url = 'https://isotcommunity.com/checkin?v=' + token;
    try {
      await navigator.clipboard.writeText(url);
      btn.textContent = 'Copied';
    } catch {
      btn.textContent = 'Select the link above';
    }
    setTimeout(() => { btn.textContent = 'Copy link'; }, 1800);
  }
  </script>
</body>
</html>
