  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Sign In · ISOT App</title>

  <link rel="icon" href="logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

  <main class="shell" style="max-width: 420px; padding-top: 48px;">

    <div style="text-align: center; margin-bottom: 28px;">
      <img src="logo.png" alt="ISOT Logo" style="height: 44px; width: auto; margin-bottom: 16px;" />
      <h1 style="font-size: 1.8rem; margin-bottom: 4px;">Welcome Back</h1>
      <p class="muted" style="font-size: 0.92rem;">Sign in to your ISOT Member account</p>
    </div>

    <div class="card card-glass card-glow">
      <div id="alert" hidden></div>

      <form id="form" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" autocomplete="email" required placeholder="name@example.com" />
        </div>
        
        <div class="field">
          <label for="password" style="display:flex;justify-content:space-between;align-items:baseline">
            <span>Password</span>
            <a href="forgot.html" style="color:var(--text-dim);font-weight:500;font-size:0.78rem;text-transform:none;letter-spacing:0">Forgot?</a>
          </label>
          <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••" />
        </div>

        <button type="submit" class="btn btn-pink" id="submit" style="margin-top: 8px;">Sign In →</button>
      </form>

      <div id="googleSlot"></div>

      <div style="text-align: center; margin-top: 20px; font-size: 0.88rem;" class="dim">
        Don't have an account? <a href="signup.html" style="color: var(--pink); font-weight: 700;">Join ISOT Free</a>
      </div>
    </div>

    <div style="text-align: center; margin-top: 24px;">
      <a href="../index.html" class="dim" style="font-size: 0.85rem;"><i class="fa-solid fa-arrow-left"></i> Back to isotcommunity.com</a>
    </div>

  </main>

  <script src="vendor/supabase.js"></script>
  <script src="js/isot.js"></script>
  <script>
    (async () => {
      const form    = document.getElementById('form');
      const alertEl = document.getElementById('alert');
      const submit  = document.getElementById('submit');

      if (!db) {
        setAlert(alertEl, 'Supabase credentials missing from js/isot.js.', 'info');
        submit.disabled = true;
        return;
      }

      // Detect OAuth errors or notices from redirect params
      const searchParams = new URLSearchParams(location.search);
      const hashParams = new URLSearchParams(location.hash.replace(/^#/, ''));
      const oauthError = searchParams.get('error_description') || searchParams.get('error') || hashParams.get('error_description') || hashParams.get('error');
      if (oauthError) {
        setAlert(alertEl, 'Google Sign-In: ' + oauthError, 'error');
      }

      const { data: { session } } = await db.auth.getSession();
      if (session) { location.replace('home.html'); return; }

      document.getElementById('googleSlot').innerHTML = googleButtonHtml('Continue with Google');
      document.getElementById('googleBtn').addEventListener('click', async (ev) => {
        setAlert(alertEl, '');
        try { await signInWithGoogle(ev.currentTarget); }
        catch (err) { setAlert(alertEl, err.message || 'Could not open Google sign-in.'); }
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        setAlert(alertEl, '');
        const restore = busy(submit, 'Signing in…');

        const { error } = await db.auth.signInWithPassword({
          email: form.email.value.trim(),
          password: form.password.value,
        });

        if (error) {
          restore();
          setAlert(alertEl, error.message === 'Invalid login credentials'
            ? 'Invalid email or password.'
            : error.message);
          return;
        }

        const rawNext = new URLSearchParams(location.search).get('next') || '';
        const qIndex   = rawNext.indexOf('?');
        const rawPath  = qIndex === -1 ? rawNext : rawNext.slice(0, qIndex);
        const rawQuery = qIndex === -1 ? ''      : rawNext.slice(qIndex + 1);

        const pageFile = rawPath.split('/').pop().replace(/\.html$/i, '') + '.html';
        const okPage   = /^[a-z0-9-]+\.html$/i.test(pageFile) && pageFile !== '.html';

        // Rebuilt from parsed pairs rather than passed through as a string, so a second
        // '?', a '#', or a scheme cannot ride along and turn this into an open redirect.
        // Needed because a poster scan is /checkin?v=<token> — dropping the query means
        // the student signs in and is told there is no check-in code.
        let query = '';
        if (okPage && rawQuery) {
          const keep = new URLSearchParams();
          new URLSearchParams(rawQuery).forEach((v, k) => {
            if (/^[a-z0-9_]{1,32}$/i.test(k) && v.length <= 200) keep.append(k, v);
          });
          const built = keep.toString();
          if (built) query = '?' + built;
        }

        location.replace((okPage ? pageFile : 'home.html') + query);
      });
    })();
  </script>
</body>
</html>
