<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Sign in · ISOT</title>
<link rel="icon" href="logo.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css" />
</head>
<body>

<div class="shell" style="max-width:400px;padding-top:56px">

  <div style="text-align:center;margin-bottom:32px">
    <img src="logo.png" alt="ISOT" style="height:38px;margin-bottom:20px" />
    <h1>Welcome back</h1>
    <p class="dim">Sign in to your ISOT account</p>
  </div>

  <div class="card">
    <div id="alert" hidden></div>

    <form id="form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-pink" id="submit">Sign in</button>
    </form>

    <p style="text-align:center;margin-top:18px;font-size:0.875rem" class="dim">
      No account yet? <a href="signup.html" style="color:var(--pink);font-weight:600">Join ISOT</a>
    </p>
  </div>

  <p style="text-align:center;margin-top:24px">
    <a href="https://isotcommunity.com" class="dim">← isotcommunity.com</a>
  </p>
</div>

<script src="vendor/supabase.js"></script>
<script src="js/isot.js"></script>
<script>
(async () => {
  const form   = document.getElementById('form');
  const alertEl= document.getElementById('alert');
  const submit = document.getElementById('submit');

  if (!db) {
    setAlert(alertEl, 'Supabase is not configured yet — add the project URL and anon key to js/isot.js.', 'info');
    submit.disabled = true;
    return;
  }

  // Already signed in? Skip straight through.
  const { data: { session } } = await db.auth.getSession();
  if (session) { location.replace('home.html'); return; }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    setAlert(alertEl, '');
    const restore = busy(submit, 'Signing in…');

    const { error } = await db.auth.signInWithPassword({
      email: form.email.value.trim(),
      password: form.password.value,
    });

    if (error) {
      restore();
      // Supabase returns the same message for wrong password and unknown email,
      // which is correct — don't leak which accounts exist.
      setAlert(alertEl, error.message === 'Invalid login credentials'
        ? 'That email and password combination did not work.'
        : error.message);
      return;
    }

    // Honour ?next= if it points somewhere inside this app.
    const next = new URLSearchParams(location.search).get('next');
    const safe = next && /^[a-z0-9-]+\.html$/i.test(next) ? next : 'home.html';
    location.replace(safe);
  });
})();
</script>
</body>
</html>
