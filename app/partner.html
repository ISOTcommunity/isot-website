  <style>
    #mapContainer {
      height: 320px;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--border-glow);
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(212, 90, 232, 0.15);
    }
    
    /* Custom Glowing Map Pin Markers */
    .isot-pin {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--pink);
      border: 2px solid #FFF;
      box-shadow: 0 0 16px rgba(212, 90, 232, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFF;
      font-size: 0.9rem;
    }
    .isot-pin.party { background: #E69321; box-shadow: 0 0 16px rgba(255, 106, 0, 0.7); }
    .isot-pin.edu { background: #5787EA; box-shadow: 0 0 16px rgba(87, 135, 234, 0.65); }  /* Sky Blue */

    /* A venue with something on tonight. Two states, not one: "live" is reserved for
       an event that has actually started, so the map never claims a night is running
       at three in the afternoon. */
    .isot-pin.tonight {
      background: var(--pink);
      box-shadow: 0 0 0 3px rgba(212, 90, 232, 0.35), 0 0 20px rgba(212, 90, 232, 0.8);
    }
    .isot-pin.live {
      background: var(--pink);
      animation: pinPulse 1.6s ease-out infinite;
    }
    @keyframes pinPulse {
      0%   { box-shadow: 0 0 0 0 rgba(212, 90, 232, 0.85), 0 0 20px rgba(212, 90, 232, 0.9); }
      70%  { box-shadow: 0 0 0 18px rgba(212, 90, 232, 0),  0 0 20px rgba(212, 90, 232, 0.9); }
      100% { box-shadow: 0 0 0 0 rgba(212, 90, 232, 0),     0 0 20px rgba(212, 90, 232, 0.9); }
    }
    /* Someone at a bar should not have to tap a pin to find out a night is on. */
    .pin-label {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 36px;
      white-space: nowrap;
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--pink);
      color: var(--on-accent, #0B0B0F);
      box-shadow: 0 3px 10px rgba(0,0,0,0.5);
    }
    .pin-label .dot {
      display: inline-block;
      width: 6px; height: 6px; border-radius: 50%;
      background: currentColor;
      margin-right: 5px;
      vertical-align: 1px;
      animation: dotBlink 1.2s steps(1, end) infinite;
    }
    @keyframes dotBlink { 50% { opacity: 0.15; } }

    @media (prefers-reduced-motion: reduce) {
      .isot-pin.live, .pin-label .dot { animation: none; }
    }

    /* Banner above the map, for the same reason the label exists. */
    /* A gem is a place, not a venue — a different mark so the two layers read apart. */
    .gem-pin {
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.05rem;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.7));
    }
    .gem-pin.found { opacity: 0.45; filter: grayscale(1) drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }

    #gemSheet .modal-sheet { max-width: 420px; }
    #gemPhotoPreview { width: 100%; border-radius: 14px; display: block; margin-bottom: 12px; }

    .layers { display:flex; gap:6px; margin-bottom:12px; overflow-x:auto; padding-bottom:2px; }
    .layers::-webkit-scrollbar { display:none; }
    .lbtn {
      flex-shrink:0; padding:6px 14px; border-radius:999px; cursor:pointer;
      background:transparent; border:1px solid var(--border-light); color:var(--text-muted);
      font-family:inherit; font-size:0.8rem; display:inline-flex; align-items:center; gap:6px;
    }
    .lbtn.on { background:var(--pink); border-color:var(--pink); color:var(--on-accent,#0B0B0F); font-weight:600; }
    .lbtn .n { font-variant-numeric:tabular-nums; opacity:0.75; }

    .score-strip {
      display: flex; align-items: center; gap: 14px;
      background: var(--bg-card); border: 1px solid var(--border-light);
      border-radius: 14px 14px 30px 14px; padding: 12px 15px; margin-bottom: 14px;
    }
    .score-strip .n { font-size: 1.5rem; font-weight: 700; color: var(--pink); line-height: 1;
                      font-variant-numeric: tabular-nums; }
    .score-strip .l { font-size: 0.72rem; color: var(--text-dim); text-transform: uppercase;
                      letter-spacing: 0.06em; margin-top: 3px; }

    .live-banner {
      display: flex; align-items: center; gap: 10px;
      background: var(--pink-glow);
      border: 1px solid var(--border-glow);
      border-radius: 14px 14px 34px 14px;
      padding: 12px 15px;
      margin-bottom: 14px;
      font-size: 0.9rem;
    }

    .venue-card-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border-light);
    }
  
    /* Map credit — required by the OSM/CARTO licence, so it stays, but it does not
       need to be a white bar across the map. Muted to sit inside the dark theme. */
    .leaflet-control-attribution {
      background: rgba(11, 15, 25, 0.55) !important;
      color: var(--text-dark) !important;
      font-size: 9px !important;
      padding: 1px 5px !important;
      border-radius: 6px 0 0 0 !important;
      backdrop-filter: blur(4px);
    }
    .leaflet-control-attribution a { color: var(--text-dark) !important; text-decoration: none; }
  </style>

  <script src="vendor/supabase.js"></script>
  <script src="vendor/leaflet.js"></script>

  <script src="js/isot.js"></script>

  <script>
    /* One entry per layer. Adding a third — trips, student services, wherever ISOT
       goes next — means adding a line here and putting markers in its group. */
    const LAYER = {
      partners: { label: 'Partners', icon: 'fa-martini-glass', group: null, count: 0 },
      gems:     { label: 'Gems',     icon: 'fa-gem',           group: null, count: 0 },
    };
    let activeLayer = 'all';
    let mapRef = null;

    function renderLayerBar() {
      const bar = document.getElementById('layerBar');
      if (!bar) return;

      const total = Object.values(LAYER).reduce((n, l) => n + l.count, 0);
      const btn = (k, label, icon, n) => `
        <button type="button" class="lbtn ${activeLayer === k ? 'on' : ''}" data-layer="${k}">
          ${icon ? `<i class="fa-solid ${icon}"></i>` : ''}${label}
          <span class="n">${n}</span>
        </button>`;

      bar.innerHTML =
        btn('all', 'All', '', total) +
        // A layer with nothing in it is hidden rather than shown empty — tapping "Gems"
        // and getting a blank map reads as broken, not as "none yet".
        Object.entries(LAYER).filter(([, l]) => l.count > 0)
          .map(([k, l]) => btn(k, l.label, l.icon, l.count)).join('');

      bar.querySelectorAll('[data-layer]').forEach(b => {
        b.onclick = () => { activeLayer = b.dataset.layer; applyLayers(); renderLayerBar(); };
      });
    }

    function applyLayers() {
      if (!mapRef) return;
      Object.entries(LAYER).forEach(([k, l]) => {
        if (!l.group) return;
        const show = activeLayer === 'all' || activeLayer === k;
        if (show) mapRef.addLayer(l.group); else mapRef.removeLayer(l.group);
      });

      // The cards below follow the map. Showing gem pins over a list of venues would
      // make the page contradict itself.
      const cards = document.getElementById('venueCards');
      const score = document.getElementById('gemScore');
      if (cards) cards.hidden = !(activeLayer === 'all' || activeLayer === 'partners');
      if (score && !score.hidden) {
        score.style.display = (activeLayer === 'all' || activeLayer === 'gems') ? '' : 'none';
      }
    }

    async function initPartnerMap() {
      const me = await requireAuth();
      document.getElementById('headerAvatar').innerHTML = renderUserAvatarHtml(me, 36);

      // attributionControl prefix:false drops Leaflet's own promo (the flag and the
      // "Leaflet" link) — that part is optional. The OpenStreetMap and CARTO credit is
      // not: OSM data is ODbL-licensed and CARTO's tiles carry their own terms, so it
      // stays. It is styled down in CSS rather than removed.
      LAYER.partners.group = L.layerGroup();
      LAYER.gems.group     = L.layerGroup();

      const map = L.map('mapContainer', {
        zoomControl: false,
        attributionControl: false,
        // Two-finger rotate, the way Apple and Google Maps behave. touchRotate is the
        // gesture; rotate:true enables the bearing machinery it needs.
        rotate: true,
        touchRotate: true,
        rotateControl: false,      // no on-screen compass button; the gesture is enough
        bearing: 0,                // start north-up
      });

      L.control.attribution({ prefix: false, position: 'bottomright' })
        .addAttribution('&copy; OSM')
        .addTo(map);

      L.tileLayer('https://cartodb-basemaps-{s}.global.ssl.fastly.net/dark_all/{z}/{x}/{y}.png', {
        maxZoom: 19,
      }).addTo(map);

      const icon = (glyph, cls = '', label = '') => L.divIcon({
        className: 'isot-pin-wrapper',
        html: `<div class="isot-pin ${cls}"><i class="fa-solid ${glyph}"></i></div>` + label,
        iconSize: [32, 32],
        iconAnchor: [16, 16],
      });

      // Pins come from the venues table. They used to be three hardcoded literals —
      // Capodoglio sat 160m west of its real address, in the middle of a street rather
      // than on Murazzi del Po, and adding a venue meant editing this file.
      // Tonight's events, so a venue with something on can say so. Uses the 06:00
       // ISOT day, the same boundary as check-in and karaoke, so a Monday night
       // still reads as Monday at 01:00.
      const isotToday = () => {
        const d = new Date(Date.now() - 6 * 3600 * 1000);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      };
      const today = isotToday();

      const [{ data: venues, error }, cal] = await Promise.all([
        db.from('venue_public')
          .select('name, address, neighbourhood, lat, lng, member_discount, active')
          .eq('active', true),
        db.rpc('calendar_between', { p_from: today, p_to: today }),
      ]);

      // Keyed by venue name — calendar_between returns venue_name, venue_public returns
      // name, and there is no shared id between them.
      // Today only, for the live/tonight state.
      const todayEvents = cal.error ? [] : (cal.data || []);

      const tonightByVenue = {};
      if (!cal.error) {
        (cal.data || []).forEach(e => {
          const startsAt = new Date(`${e.event_date}T${(e.start_time || '00:00:00')}`);
          // "Live" only once it has actually started (with a 30-minute run-up for
          // people arriving early). Anything else tonight is "Tonight", not live —
          // the map must not claim a night is running at three in the afternoon.
          const live = Date.now() >= startsAt.getTime() - 30 * 60 * 1000;
          const prev = tonightByVenue[e.venue_name];
          if (!prev || (live && !prev.live)) {
            tonightByVenue[e.venue_name] = {
              title: e.title,
              time: (e.start_time || '').slice(0, 5),
              eventId: e.event_id,
              date: e.event_date,
              venue: e.venue_name,
              live,
            };
          }
        });
      }

      if (error) {
        console.error('Could not load venues:', error.message);
        map.setView([45.0620, 7.6890], 14);
        return;
      }

      // Only plot venues that actually have coordinates. An approximate pin on a
      // partner's venue sends students to the wrong door.
      const located = (venues || []).filter(v => v.lat != null && v.lng != null);

      if (!located.length) {
        map.setView([45.0620, 7.6890], 13);   // Turin centre, nothing to show yet
        return;
      }

      located.forEach(v => {
        const isClub = /club|zenit/i.test(v.name);
        const on = tonightByVenue[v.name];

        const cls = on ? (on.live ? 'live' : 'tonight') : (isClub ? 'party' : '');
        const label = on
          ? `<div class="pin-label">${on.live
               ? `<span class="dot"></span>LIVE · ${escapeHtml(on.title)}`
               : `${escapeHtml(on.title)} · ${escapeHtml(on.time)}`}</div>`
          : '';

        LAYER.partners.group.addLayer(L.marker([v.lat, v.lng], {
          icon: icon(isClub ? 'fa-compact-disc' : 'fa-martini-glass', cls, label),
          zIndexOffset: on ? 1000 : 0,   // a live venue sits above the others
        })
          .bindPopup(
            `<b>${escapeHtml(v.name)}</b><br>` +
            (on ? `<b>${on.live ? 'Happening now' : 'Tonight'}: ${escapeHtml(on.title)}` +
                  `${on.time ? ' · ' + escapeHtml(on.time) : ''}</b>` +
                  (on.eventId ? ` <a href="event.html?e=${on.eventId}&d=${on.date}">details</a>` : '') +
                  '<br>' : '') +
            `${escapeHtml(v.address || v.neighbourhood || '')}` +
            (v.member_discount ? `<br>${escapeHtml(v.member_discount)}` : '')
          ));
      });

      renderLiveBanner(tonightByVenue);

      // A separate, wider read for the cards: they list each venue's weekly nights, and
      // today's query cannot show a Saturday on a Tuesday.
      const wk = await db.rpc('calendar_between', {
        p_from: today,
        p_to: new Date(Date.now() + 14 * 86400000).toISOString().slice(0, 10),
      });
      renderVenueCards(venues || [], tonightByVenue, wk.error ? todayEvents : (wk.data || []));

      await loadGems(map);
      watchNearby(venues || [], tonightByVenue);

      // Fit every pin rather than centring on a guessed midpoint — with one venue
      // off-screen it looked like the map was wrong.
      mapRef = map;
      LAYER.partners.count = located.length;
      applyLayers();
      renderLayerBar();

      map.fitBounds(located.map(v => [v.lat, v.lng]), { padding: [40, 40], maxZoom: 16 });
    }

    /* ── Near a venue with something on ─────────────────────────────────────
     * If you are standing outside Rough on a Monday, the app should say so rather than
     * make you find the pin.
     *
     * Location is requested ONCE and not watched: a continuous watch drains a phone at
     * exactly the moment someone is out for the night, and the answer does not change
     * while they stand still. Coordinates are compared and dropped — nothing is stored
     * and nothing is sent anywhere.
     *
     * Only fires for a venue that HAS a night on. Being near a bar on a Tuesday is not
     * news, and a notification that is usually noise gets dismissed reflexively.
     * ------------------------------------------------------------------- */
    function metresBetween(a, b, c, d) {
      const R = 6371000, r = Math.PI / 180;
      return 2 * R * Math.asin(Math.sqrt(
        Math.sin((c - a) * r / 2) ** 2 +
        Math.cos(a * r) * Math.cos(c * r) * Math.sin((d - b) * r / 2) ** 2));
    }

    function watchNearby(venues, tonightByVenue) {
      const live = venues.filter(v => v.lat && v.lng && tonightByVenue[v.name]);
      if (!live.length || !navigator.geolocation) return;

      // Dismissed for the session, not forever — next time they open the app it is back.
      if (sessionStorage.getItem('isot_near_dismissed')) return;

      navigator.geolocation.getCurrentPosition((pos) => {
        let best = null;
        for (const v of live) {
          const d = metresBetween(pos.coords.latitude, pos.coords.longitude, v.lat, v.lng);
          if (d <= 300 && (!best || d < best.d)) best = { v, d };
        }
        if (!best) return;

        const on = tonightByVenue[best.v.name];
        const bar = document.createElement('div');
        bar.className = 'live-banner';
        bar.style.cssText += 'position:sticky;top:64px;z-index:60;margin-bottom:12px';
        bar.innerHTML = `
          <i class="fa-solid fa-location-crosshairs" style="color:var(--pink)"></i>
          <div style="flex:1">
            <b style="color:#FFF">You're ${Math.round(best.d)}m from ${escapeHtml(best.v.name)}</b>
            <div class="dim" style="font-size:0.8rem">
              ${on.live ? 'Happening now' : 'Tonight'} — ${escapeHtml(on.title)}${on.time ? ' · ' + escapeHtml(on.time) : ''}
            </div>
          </div>
          ${on.eventId ? `<a href="event.html?e=${on.eventId}&d=${on.date}" class="btn btn-pink"
             style="width:auto;padding:6px 14px;font-size:0.78rem;flex-shrink:0">Open</a>` : ''}
          <button type="button" aria-label="Dismiss"
                  style="background:transparent;border:none;color:var(--text-dim);font-size:1rem;cursor:pointer;padding:4px"
                  onclick="sessionStorage.setItem('isot_near_dismissed','1');this.parentElement.remove()">
            <i class="fa-solid fa-xmark"></i>
          </button>`;
        const main = document.querySelector('main.shell');
        main.insertBefore(bar, main.firstChild);
      },
      // Silent on refusal. Someone who declined location does not need to be told again
      // every time they open the map.
      () => {}, { enableHighAccuracy: false, timeout: 8000, maximumAge: 300000 });
    }

    /* ── Gems ──────────────────────────────────────────────────────────────
     * A point on the map with nothing physical at it. You go there, the app checks
     * where you are, you leave a photo.
     *
     * The distance check is done by claim_gem() in the database. A check in this file
     * would be bypassed by anyone who opens the console, and then the whole thing is
     * theatre. Nothing here decides whether a claim succeeds.
     * ------------------------------------------------------------------- */
    let gems = [];
    let claiming = null;   // the gem whose sheet is open

    async function loadGems(map) {
      const [{ data, error }, score] = await Promise.all([
        db.rpc('gems_for_map'),
        db.rpc('my_gem_score'),
      ]);

      // 028 may not be applied yet; the map should still work without gems.
      if (error) { console.warn('gems:', error.message); return; }
      gems = data || [];

      if (!score.error && score.data && score.data.total > 0) {
        const s = score.data;
        document.getElementById('gemScore').hidden = false;
        document.getElementById('gemScore').className = 'score-strip';
        document.getElementById('gemScore').innerHTML = `
          <div><div class="n">${s.points}</div><div class="l">points</div></div>
          <div><div class="n">${s.found}/${s.total}</div><div class="l">gems found</div></div>
          <div class="dim" style="flex:1;font-size:0.8rem;text-align:right">
            Go to the place, take a photo there.
          </div>`;
      }

      gems.forEach(g => {
        const icon = L.divIcon({
          className: 'isot-pin-wrapper',
          html: `<div class="gem-pin ${g.found_by_me ? 'found' : ''}">${g.found_by_me ? '\u2713' : '\ud83d\udc8e'}</div>`,
          iconSize: [30, 30], iconAnchor: [15, 15],
        });
        LAYER.gems.group.addLayer(
          L.marker([g.lat, g.lng], { icon, zIndexOffset: 500 })
            .on('click', () => openGem(g.id)));
      });

      // gems_for_map() resolves after the first paint, so the count is only known now.
      LAYER.gems.count = gems.length;
      applyLayers();
      renderLayerBar();
    }

    function openGem(id) {
      const g = gems.find(x => x.id === id);
      if (!g) return;
      claiming = g;

      let sheet = document.getElementById('gemSheet');
      if (!sheet) {
        sheet = document.createElement('div');
        sheet.className = 'modal-backdrop';
        sheet.id = 'gemSheet';
        sheet.onclick = () => sheet.classList.remove('active');
        sheet.innerHTML = `
          <div class="modal-sheet" onclick="event.stopPropagation()">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px">
              <div><div class="eyebrow" id="gemPoints"></div>
                   <h3 style="font-size:1.15rem;color:#FFF;margin-top:2px" id="gemName"></h3></div>
              <button type="button" onclick="document.getElementById('gemSheet').classList.remove('active')"
                      style="background:transparent;border:none;color:var(--text-muted);font-size:1.3rem;cursor:pointer">
                <i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="gemBody" style="margin-top:12px"></div>
          </div>`;
        document.body.appendChild(sheet);
      }

      document.getElementById('gemPoints').textContent =
        g.found_by_me ? 'Found' : g.points + ' points';
      document.getElementById('gemName').textContent = g.name;

      const body = document.getElementById('gemBody');

      if (g.found_by_me) {
        body.innerHTML = `
          ${g.photo_path ? `<img src="${escapeHtml(photoUrl(g.photo_path))}" alt="Your photo" style="width:100%;border-radius:14px;display:block;margin-bottom:12px" />` : ''}
          <p style="font-size:0.9rem;color:var(--text-muted)">${escapeHtml(g.reveal || 'You found this one.')}</p>
          <p class="dim" style="font-size:0.78rem;margin-top:10px">
            ${g.found_count} ${g.found_count === 1 ? 'person has' : 'people have'} found this.
          </p>`;
      } else {
        body.innerHTML = `
          <p style="font-size:0.9rem;color:var(--text-muted)">${escapeHtml(g.hint || 'Somewhere in Turin.')}</p>
          <p class="dim" style="font-size:0.78rem;margin-top:10px">
            Be within ${g.radius_m}m and take a photo there.
            ${g.found_count ? g.found_count + ' found it so far.' : 'Nobody has found this one yet.'}
          </p>
          <div id="gemAlert" style="margin-top:12px" hidden></div>
          <!-- capture="environment" opens the camera instead of the photo library, which
               closes the "send me your picture" loophole. It is not unbypassable — some
               Android browsers ignore it, and a desktop still shows a file dialog — so
               the GPS check in claim_gem() remains the actual proof. -->
          <input type="file" id="gemFile" accept="image/*" capture="environment" style="display:none"
                 onchange="onGemPhoto(event)" />
          <button type="button" class="btn btn-pink" style="margin-top:14px"
                  onclick="document.getElementById('gemFile').click()">
            <i class="fa-solid fa-camera"></i> I'm here — take the photo
          </button>`;
      }

      sheet.classList.add('active');
    }

    function photoUrl(path) {
      return db.storage.from('gem-photos').getPublicUrl(path).data.publicUrl;
    }

    function gemSay(msg, kind) {
      const el = document.getElementById('gemAlert');
      if (!el) return;
      el.hidden = false;
      el.className = 'alert alert-' + (kind || 'error');
      el.textContent = msg;
    }

    async function onGemPhoto(ev) {
      const file = ev.target.files && ev.target.files[0];
      if (!file || !claiming) return;
      const g = claiming;

      const btn = document.querySelector('#gemBody .btn-pink');
      const restore = btn ? busy(btn, 'Checking where you are…') : () => {};

      // Location first. If they are not there, nothing is uploaded — no orphan photo
      // in storage for a claim that was never going to succeed.
      let pos;
      try {
        pos = await new Promise((res, rej) =>
          navigator.geolocation.getCurrentPosition(res, rej,
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }));
      } catch (e) {
        restore();
        gemSay(e && e.code === 1
          ? 'ISOT needs your location to check you are here. Allow it in your browser settings and try again.'
          : 'Could not get your location. Step outside and try again.');
        return;
      }

      // Shrunk before it leaves the phone. A raw photo is 3–5 MB and the free tier
      // gives 1 GB total; resized, the same claim costs about 300 KB. Re-encoding also
      // drops EXIF, so a member's camera metadata does not travel with the upload.
      if (btn) btn.innerHTML = '<span class="spinner"></span> Preparing photo…';
      let blob;
      try {
        blob = await shrinkImage(file);
      } catch (e) {
        restore(); gemSay(e.message || 'Could not read that photo.'); return;
      }

      if (btn) btn.innerHTML = '<span class="spinner"></span> Uploading…';
      const path = `${g.id}/${Date.now()}.jpg`;
      const { error: upErr } = await db.storage.from('gem-photos')
        .upload(path, blob, { contentType: 'image/jpeg', upsert: false });

      if (upErr) { restore(); gemSay('Photo upload failed — ' + upErr.message); return; }

      const { data, error } = await db.rpc('claim_gem', {
        p_gem_id: g.id,
        p_lat: pos.coords.latitude,
        p_lng: pos.coords.longitude,
        p_accuracy: pos.coords.accuracy,
        p_photo_path: path,
      });

      restore();

      if (error)        { gemSay(error.message); return; }
      if (!data.ok)     { gemSay(data.reason); return; }

      gemSay(`Found it — ${data.points} points.`, 'success');
      // Reload so the pin, the score and the reveal all update together.
      setTimeout(() => location.reload(), 1200);
    }

    /* One card per active venue, from the same rows that drew the pins. The weekly
       nights come from the calendar rather than being typed in, so a time can only be
       wrong here if it is wrong everywhere. */
    function renderVenueCards(venues, tonightByVenue, allEvents) {
      const host = document.getElementById('venueCards');
      if (!host) return;

      if (!venues.length) {
        host.innerHTML = '<p class="dim" style="font-size:0.86rem;padding:18px 0">No partner venues yet.</p>';
        return;
      }

      host.innerHTML = venues.map(v => {
        const q = encodeURIComponent(`${v.address || v.name} Torino`);
        const on = tonightByVenue[v.name];

        // Distinct weekly nights at this venue, taken from the calendar.
        const seen = new Set();
        const nights = (allEvents || [])
          .filter(e => e.venue_name === v.name)
          .filter(e => { if (seen.has(e.title)) return false; seen.add(e.title); return true; })
          .slice(0, 4);

        return `
        <div class="card card-glass" style="margin-bottom:16px">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px">
            <div style="min-width:0">
              <h2 style="font-size:1.2rem;color:#FFF;margin:0">${escapeHtml(v.name)}</h2>
              <p style="color:var(--text-muted);font-size:0.85rem;margin:0">
                ${escapeHtml(v.neighbourhood ? v.neighbourhood + ' • ' : '')}${escapeHtml(v.address || '')}
              </p>
            </div>
            ${v.member_discount ? '<span class="badge badge-socio" style="flex-shrink:0">Perks</span>' : ''}
          </div>

          ${v.member_discount
            ? `<div class="dim" style="font-size:0.86rem;margin-bottom:10px">
                 <i class="fa-solid fa-ticket text-pink"></i> ${escapeHtml(v.member_discount)}
               </div>`
            : ''}

          ${nights.length ? `
            <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">
              ${nights.map(n => `
                <span class="badge badge-participant">
                  ${escapeHtml(n.title)} (${escapeHtml((n.start_time || '').slice(0,5))})
                </span>`).join('')}
            </div>` : ''}

          ${(() => {
            // Posters for what is actually coming here. A venue card that shows the
            // next three nights as artwork sells the place far better than a list of
            // times — and the images already exist, they were just only on the calendar.
            const upcoming = (allEvents || [])
              .filter(e => e.venue_name === v.name && e.poster_url)
              .slice(0, 3);
            if (!upcoming.length) return '';
            return `
              <div style="display:flex;gap:8px;margin-top:12px;overflow-x:auto;padding-bottom:2px">
                ${upcoming.map(e => `
                  <a href="event.html?e=${e.event_id}&d=${e.event_date}"
                     style="flex-shrink:0;width:96px;text-decoration:none">
                    <img src="${escapeHtml(e.poster_url)}" alt="${escapeHtml(e.title)}" loading="lazy"
                         style="width:96px;height:120px;object-fit:cover;border-radius:8px 8px 18px 8px;display:block" />
                    <div class="dim" style="font-size:0.68rem;margin-top:4px;line-height:1.3">
                      ${escapeHtml(new Date(e.event_date + 'T00:00:00')
                        .toLocaleDateString([], { weekday:'short', day:'numeric', month:'short' }))}
                    </div>
                  </a>`).join('')}
              </div>`;
          })()}

          ${on ? `<div style="margin-top:10px;font-size:0.84rem;color:var(--pink)">
                    <i class="fa-solid fa-tower-broadcast"></i>
                    ${on.live ? 'Happening now' : 'On tonight'} — ${escapeHtml(on.title)}
                  </div>` : ''}

          <div class="venue-card-actions">
            <a href="https://maps.google.com/?q=${q}" target="_blank" rel="noopener"
               class="btn btn-pink" style="width:auto;padding:6px 14px;font-size:0.8rem">
              <i class="fa-solid fa-diamond-turn-right"></i> Google Maps
            </a>
            <a href="https://maps.apple.com/?q=${q}" target="_blank" rel="noopener"
               class="btn btn-outline" style="width:auto;padding:6px 14px;font-size:0.8rem">
              <i class="fa-solid fa-location-arrow"></i> Apple Maps
            </a>
          </div>
        </div>`;
      }).join('');
    }

    /* Above the map as well as on it: someone opening this page at a bar should not
       have to find the right pin to learn a night is running. */
    function renderLiveBanner(byVenue) {
      const el = document.getElementById('liveBanner');
      if (!el) return;

      const entries = Object.entries(byVenue);
      if (!entries.length) { el.hidden = true; return; }

      entries.sort((a, b) => Number(b[1].live) - Number(a[1].live));
      const [venue, ev] = entries[0];

      el.hidden = false;
      el.className = 'live-banner';
      el.innerHTML = ev.live
        ? `<i class="fa-solid fa-tower-broadcast" style="color:var(--pink)"></i>
           <div><b style="color:#FFF">Live now — ${escapeHtml(ev.title)}</b>
           <div class="dim" style="font-size:0.8rem">${escapeHtml(venue)}${ev.time ? ' · started ' + escapeHtml(ev.time) : ''}</div></div>`
        : `<i class="fa-solid fa-calendar-day" style="color:var(--pink)"></i>
           <div><b style="color:#FFF">Tonight — ${escapeHtml(ev.title)}</b>
           <div class="dim" style="font-size:0.8rem">${escapeHtml(venue)}${ev.time ? ' · from ' + escapeHtml(ev.time) : ''}</div></div>`;
    }

    document.addEventListener('DOMContentLoaded', initPartnerMap);
  </script>
</body>
</html>
