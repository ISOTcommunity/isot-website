<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>ISOT Partner Venues & Map</title>

  <link rel="icon" href="../assets/LOGOS/scritta isot.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="vendor/leaflet.css" />
  <link rel="stylesheet" href="css/app.css" />

  <style>
    #mapContainer {
      height: 280px;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border-light);
      margin-bottom: 24px;
    }
  </style>
</head>
<body>

  <div id="gate"><div class="spinner"></div></div>

  <!-- Top Bar -->
  <header class="topbar">
    <a href="home.html" class="topbar-title" style="display: flex; align-items: center; gap: 8px;">
      <i class="fa-solid fa-store text-pink"></i>
      <span>Partner Network</span>
    </a>
    <div style="display: flex; align-items: center; gap: 10px;">
      <div id="headerAvatar" style="cursor: pointer;" data-open-drawer></div>
      <button type="button" id="burgerBtn" aria-label="Account menu" style="background: transparent; border: none; color: #FFF; font-size: 1.3rem; cursor: pointer; padding: 6px;">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
  </header>

  <main class="shell">

    <div style="margin-bottom: 16px;">
      <div class="eyebrow"><i class="fa-solid fa-map-location-dot"></i> Turin Venues Map</div>
      <h1 style="font-size: 1.8rem; margin-top: 4px;">Explore Partner Spots</h1>
    </div>

    <!-- Leaflet Dark Map -->
    <div id="mapContainer"></div>

    <!-- Partner Venue Cards with Category Logos -->
    <div class="card card-glass" style="margin-bottom: 16px;">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <img src="../assets/LOGOS/Drink.jpeg" alt="Drinks" style="width: 44px; height: 44px; border-radius: 12px; object-fit: cover;" />
          <div>
            <h2 style="font-size: 1.2rem; color: #FFF; margin: 0;">Rough Bar</h2>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin: 0;">San Salvario • Via San Salvario 12</p>
          </div>
        </div>
        <span class="badge badge-socio">20% OFF</span>
      </div>

      <div style="display: flex; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-light);">
        <span class="badge badge-participant"><i class="fa-solid fa-microphone"></i> Monday Karaoke</span>
        <span class="badge badge-participant"><i class="fa-solid fa-glass-cheers"></i> Saturday Pre-Party</span>
      </div>
    </div>

    <div class="card card-glass">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <img src="../assets/LOGOS/Tog.jpeg" alt="Together & Social" style="width: 44px; height: 44px; border-radius: 12px; object-fit: cover;" />
          <div>
            <h2 style="font-size: 1.2rem; color: #FFF; margin: 0;">Capodoglio</h2>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin: 0;">Murazzi del Po 37</p>
          </div>
        </div>
        <span class="badge badge-socio">20% OFF</span>
      </div>

      <div style="display: flex; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-light);">
        <span class="badge badge-participant"><i class="fa-solid fa-users"></i> Thursday Social Hub</span>
        <span class="badge badge-participant"><i class="fa-solid fa-music"></i> DJ Nights</span>
      </div>
    </div>

  </main>

  <!-- Mobile Bottom Tab Bar -->
  <nav class="tabbar">
    <a href="events.html" class="tab-item">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      Calendar
    </a>
    <a href="partner.html" class="tab-item active">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0h4m-4 0V9a2 2 0 012-2h2a2 2 0 012 2v12"/></svg>
      Partners
    </a>
    <a href="home.html" class="tab-item">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 011-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      Home
    </a>
    <a href="../blog.html" class="tab-item">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
      Network
    </a>
    <button type="button" class="tab-item" style="background:transparent;border:none;cursor:pointer;font-family:inherit;" data-open-drawer>
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      Menu
    </button>
  </nav>

  <script src="vendor/supabase.js"></script>
  <script src="vendor/leaflet.js"></script>
  <script src="js/isot.js"></script>

  <script>
    async function initPartnerMap() {
      const me = await requireAuth();
      document.getElementById('headerAvatar').innerHTML = renderGeoAvatar(me.member_code, 36);

      const map = L.map('mapContainer').setView([45.0560, 7.6820], 14);

      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap &copy; CARTO'
      }).addTo(map);

      L.marker([45.0545, 7.6832]).addTo(map)
        .bindPopup('<b>Rough Bar</b><br>20% Member Discount');

      L.marker([45.0578, 7.6915]).addTo(map)
        .bindPopup('<b>Capodoglio</b><br>20% Member Discount');
    }

    document.addEventListener('DOMContentLoaded', initPartnerMap);
  </script>
</body>
</html>
