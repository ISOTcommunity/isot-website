  <style>
    .bal-card {
      background: linear-gradient(150deg, rgba(212,175,80,.13), var(--bg-card));
      border: 1px solid rgba(212,175,80,.34);
      border-radius: 20px; padding: 22px; margin-bottom: 18px;
    }
    .bal-n { font-size: 3rem; font-weight: 700; color: #FFF; line-height: 1;
             font-variant-numeric: tabular-nums; }
    .bal-l { font-size: .68rem; letter-spacing: .12em; text-transform: uppercase;
             color: var(--gold, #D4AF50); font-weight: 700; margin-top: 6px; }

    /* Early bird */
    .eb {
      border-radius: 18px; padding: 16px; margin-bottom: 18px;
      border: 1px solid var(--border-light); background: var(--bg-card);
    }
    .eb.live { border-color: rgba(67,219,143,.45);
               background: linear-gradient(150deg, rgba(67,219,143,.12), var(--bg-card)); }
    .eb-tag { font-size: .62rem; font-weight: 700; letter-spacing: .13em;
              text-transform: uppercase; margin-bottom: 7px; }

    /* Token */
    .tok { border-radius: 20px; overflow: hidden; margin-bottom: 14px;
           border: 1px solid rgba(212,175,80,.4); background: var(--bg-card); }
    .tok-poster { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; }
    .tok-body { padding: 16px; }
    .tok-kind { font-size: 1.15rem; font-weight: 700; color: #FFF; }
    .tok-note { font-size: .82rem; color: var(--text-muted); margin-top: 3px; }
    .tok-exp  { font-size: .72rem; color: var(--gold, #D4AF50); margin-top: 8px; font-weight: 600; }

    /* Burnt proof — the bit a screenshot cannot fake */
    .burnt {
      border-radius: 20px; padding: 22px 18px; margin-bottom: 14px; text-align: center;
      border: 1px solid rgba(243,108,81,.45);
      background: linear-gradient(150deg, rgba(243,108,81,.14), var(--bg-card));
    }
    .burnt-stamp {
      font-size: 1.5rem; font-weight: 700; letter-spacing: .16em; color: #F8A18E;
      text-transform: uppercase;
    }
    .burnt-clock {
      font-size: 2.3rem; font-weight: 700; color: #FFF; line-height: 1.05; margin-top: 10px;
      font-variant-numeric: tabular-nums; letter-spacing: .02em;
    }
    .burnt-date { font-size: .88rem; color: var(--text-muted); margin-top: 2px; }
    .burnt-since { font-size: .76rem; color: #F8A18E; margin-top: 10px; font-weight: 600; }
    .burnt-who { font-size: .82rem; color: var(--text-muted); margin-top: 12px;
                 border-top: 1px solid var(--border-light); padding-top: 12px; }
    .burnt-who strong { color: #FFF; }

    /* Live clock under the button — deliberately the same footprint as the button above
       it, so the two read as one control: "this is live, now use it". */
    .live-clock {
      width: 100%; margin-top: 10px;
      min-height: 48px; padding: 8px 16px; border-radius: var(--radius-sm);
      background: rgba(67,219,143,.14); border: 1px solid rgba(67,219,143,.45);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1px;
    }
    .lc-time {
      font-size: 1.45rem; font-weight: 700; color: #8FD99A; line-height: 1;
      font-variant-numeric: tabular-nums; letter-spacing: .03em;
    }
    .lc-date { font-size: .66rem; color: rgba(143,217,154,.75); font-weight: 600; }

    .bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.07);
           margin-top: 16px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 99px;
                background: linear-gradient(90deg, #D4AF50, #43DB8F); transition: width .6s ease; }

    .rule { display: flex; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--border-light); }
    .rule:last-child { border-bottom: none; }
    .rule-ico { width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
                background: rgba(212,175,80,.12); color: #D4AF50;
                display: flex; align-items: center; justify-content: center; font-size: .9rem; }
    .rule-body { flex: 1; min-width: 0; }
    .rule-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .rule-title { font-size: .92rem; font-weight: 700; color: #FFF; }
    .rule-pts { font-size: .82rem; font-weight: 700; color: #8FD99A; white-space: nowrap; }
    .rule-txt { font-size: .78rem; color: var(--text-muted); line-height: 1.5; margin-top: 3px; }
    .rule-prog { font-size: .72rem; color: var(--text-dim); margin-top: 6px; }
    .rule-prog strong { color: #FFF; }

    .hrow { display: flex; gap: 12px; padding: 10px 0;
            border-bottom: 1px solid var(--border-light); align-items: center; }
    .hrow:last-child { border-bottom: none; }
    .hpts { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 46px;
            text-align: right; }
    .hpts.pos { color: var(--green); }
    .hpts.neg { color: var(--text-dim); }
  </style>
</head>
<body>

      </button>
    </div>
  </header>

  <main class="shell">
    <div id="panel"><div class="spinner" style="margin:40px auto"></div></div>
  </main>

  <script src="vendor/supabase.js"></script>
  <script src="js/isot.js"></script>
  <script>
    let me = null;
    let data = null;      // my_rewards()
    let eb = null;        // early_bird_status()
    let game = null;      // game_state(): rules, progress
    let board = [];       // game_leaderboard()
    let trade = { open: false };  // trade_status(): only during Monday karaoke
    let clockTimer = null;

    // The device clock is not trusted: a member can set their phone to anything. Every
    // time shown here is derived from the server's clock plus the elapsed time since we
    // measured the offset — so the seconds on screen are the bar's seconds.
    let serverOffsetMs = 0;
    function setServerNow(iso) {
      if (!iso) return;
      serverOffsetMs = new Date(iso.replace(' ', 'T')).getTime() - Date.now();
    }
    function serverNow() { return new Date(Date.now() + serverOffsetMs); }

    const pad = n => String(n).padStart(2, '0');
    function clockText(d) { return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
    function dateText(d)  {
      return d.toLocaleDateString('en-GB',
        { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }

    async function init() {
      me = await requireAuth();
      document.getElementById('headerAvatar').innerHTML = renderUserAvatarHtml(me, 36);
      await load();
    }

    async function load() {
      const [r, e, g, lb, ts] = await Promise.all([
        db.rpc('my_rewards'),
        db.rpc('early_bird_status'),
        db.rpc('game_state'),
        db.rpc('game_leaderboard', { p_limit: 10 }),
        db.rpc('trade_status'),
      ]);
      if (r.error) {
        document.getElementById('panel').innerHTML =
          `<p class="dim" style="text-align:center;padding:30px">Could not load your rewards.</p>`;
        return;
      }
      data = r.data; eb = e.data || {};
      game = g.data || null; board = lb.data || [];
      trade = (ts && ts.data) || { open: false };
      setServerNow(data.server_now || eb.server_now);
      render();
    }

    function render() {
      const tokens = data.tokens || [];
      const burned = data.just_burned || [];
      const hist   = data.history || [];

      const cost = data.shot_cost;
      const toNext = Math.max(0, cost - data.balance);
      const pct = Math.min(100, Math.round((data.balance / cost) * 100));

      document.getElementById('panel').innerHTML = `
        <div class="bal-card">
          <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px">
            <div>
              <div class="bal-n">${data.balance}</div>
              <div class="bal-l">Points</div>
            </div>
            ${game ? `<div style="text-align:right">
              <div style="font-size:1.1rem;font-weight:700;color:#FFF">${game.earned_month}</div>
              <div class="dim" style="font-size:.62rem;letter-spacing:.1em;text-transform:uppercase">
                earned this month</div></div>` : ''}
          </div>

          <!-- Distance to the next shot: the one number that makes a score feel like a game. -->
          <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
          <div style="font-size:.78rem;color:var(--text-muted);margin-top:7px">
            ${toNext > 0
              ? `<strong style="color:#FFF">${toNext}</strong> more points to a free shot`
              : `Enough for a shot — trade it below or keep saving`}
          </div>

          ${data.balance >= cost && trade.open ? `
            <button type="button" class="btn btn-pink" id="btnExchange" style="width:100%;margin-top:14px">
              <i class="fa-solid fa-right-left"></i> Trade ${cost} points for a shot at ${escapeHtml(trade.venue || 'the bar')}
            </button>`
          : data.balance >= cost ? `
            <div class="dim" style="font-size:.76rem;margin-top:12px;line-height:1.5">
              <i class="fa-solid fa-lock" style="color:#D4AF50"></i>
              Trading opens during <strong style="color:#FFF">Monday karaoke at Rough</strong>.
            </div>` : ''}
        </div>

        ${renderEarlyBird()}

        ${burned.length ? `<div class="eyebrow" style="margin:18px 0 8px">Just used</div>
          ${burned.map(renderBurnt).join('')}` : ''}

        ${tokens.length ? `<div class="eyebrow" style="margin:18px 0 8px">
            Your shots &middot; ${tokens.length}</div>
          ${tokens.map(renderToken).join('')}` : ''}

        ${renderHowToPlay()}

        ${renderBoard()}

        ${hist.length ? `
          <div class="eyebrow" style="margin:22px 0 8px">How you got here</div>
          <div class="card card-glass" style="padding:4px 16px">
            ${hist.map(h => `
              <div class="hrow">
                <div style="flex:1;min-width:0">
                  <div style="font-size:.86rem;color:#FFF">${escapeHtml(h.note || h.kind)}</div>
                  <div class="dim" style="font-size:.7rem;margin-top:2px">
                    ${new Date(h.created_at).toLocaleDateString('en-GB',
                       { day:'numeric', month:'short' })}</div>
                </div>
                <div class="hpts ${h.points >= 0 ? 'pos' : 'neg'}">
                  ${h.points >= 0 ? '+' : ''}${h.points}</div>
              </div>`).join('')}
          </div>` : ''}

        <p class="dim" style="font-size:.74rem;text-align:center;margin-top:22px;line-height:1.5">
          Shots are poured by the bar. Show your phone and let them press the button.
        </p>`;

      const ex = document.getElementById('btnExchange');
      if (ex) ex.addEventListener('click', exchange);
      document.querySelectorAll('[data-give]').forEach(b =>
        b.addEventListener('click', () => armToken(b.dataset.give)));
      const claim = document.getElementById('btnClaim');
      if (claim) claim.addEventListener('click', claimEarlyBird);

      startClock();
    }

    // Every number comes from game_state(), which reads the same functions the triggers
    // pay out from — so this page cannot drift from what the game actually does.
    function renderHowToPlay() {
      if (!game) return '';
      const r = game.rules, p = game.progress;
      const rule = (icon, title, pts, body, prog) => `
        <div class="rule">
          <div class="rule-ico"><i class="fa-solid ${icon}"></i></div>
          <div class="rule-body">
            <div class="rule-top">
              <span class="rule-title">${title}</span>
              <span class="rule-pts">${pts}</span>
            </div>
            <div class="rule-txt">${body}</div>
            ${prog ? `<div class="rule-prog">${prog}</div>` : ''}
          </div>
        </div>`;

      return `
        <div class="eyebrow" style="margin:24px 0 10px">How to play</div>
        <div class="card card-glass" style="padding:6px 16px">
          ${rule('fa-qrcode', 'Come to a night', `+${r.attendance}`,
            'At Karaoke or the Social Hub, find a volunteer and show your ISOT card. Once per night.',
            `You have been scanned at <strong>${p.nights}</strong> night${p.nights === 1 ? '' : 's'}`)}
          ${rule('fa-microphone', 'Sing', `+${r.song}`,
            'Every song you actually sing on Monday karaoke — counted when the host marks it done.',
            `<strong>${p.songs}</strong> song${p.songs === 1 ? '' : 's'} so far`)}
          ${rule('fa-user-group', 'Make friends', `+${r.friends}`,
            `Every ${r.step} friends you connect with in the app.`,
            `<strong>${p.friends}</strong> friends · next reward at ${p.friends_next}`)}
          ${rule('fa-paper-plane', 'Bring people', `+${r.invites}`,
            `Every ${r.step} people you invite who then turn up to that night and get scanned.`,
            `<strong>${p.invites}</strong> came · next reward at ${p.invites_next}`)}
          ${rule('fa-gem', 'Find gems', 'varies',
            'Hidden spots on the map. Go there, take the photo, claim it.',
            `<a href="partner.html" style="color:var(--pink)">Open the map &rarr;</a>`)}
        </div>

        <div class="eyebrow" style="margin:22px 0 10px">Spend it</div>
        <div class="card card-glass" style="padding:6px 16px">
          ${rule('fa-martini-glass-citrus', 'A free shot', `${r.shot_cost} pts`,
            'Trade points for a shot during Monday karaoke at Rough — from when the doors open until the night ends. The shot is for that night only. Show the phone, the bartender taps.',
            null)}
          ${rule('fa-clock', 'Monday early bird', 'free',
            `Say <strong>going</strong> to karaoke before ${r.eb_deadline}, then open this page at the bar between
             ${r.eb_from} and ${r.eb_until}. The shot only exists in that window. One per person.`,
            null)}
        </div>`;
    }

    function renderBoard() {
      if (!board || !board.length) return '';
      const medal = n => n === 1 ? '#D4AF50' : n === 2 ? '#C4BDE0' : n === 3 ? '#C9A46A' : 'var(--text-dim)';
      return `
        <div class="eyebrow" style="margin:24px 0 10px">This month's leaderboard</div>
        <div class="card card-glass" style="padding:4px 16px">
          ${board.map(b => `
            <div class="hrow" style="${b.is_me ? 'background:rgba(212,90,232,.08);margin:0 -16px;padding-inline:16px' : ''}">
              <div style="width:22px;font-weight:700;color:${medal(b.rank)};font-variant-numeric:tabular-nums">${b.rank}</div>
              <div style="width:30px;height:30px;border-radius:50%;overflow:hidden;flex-shrink:0">
                ${renderUserAvatarHtml({ full_name: b.name, avatar_url: b.avatar_url, member_code: b.member_code }, 30)}
              </div>
              <div style="flex:1;min-width:0;font-size:.88rem;color:#FFF">
                ${escapeHtml(b.name)}${b.is_me ? ' <span style="color:var(--pink);font-size:.72rem">you</span>' : ''}
              </div>
              <div class="hpts pos">${b.points}</div>
            </div>`).join('')}
        </div>
        <p class="dim" style="font-size:.7rem;margin-top:6px">Points earned since the 1st. Spending a shot does not lose you your place.</p>`;
    }

    function renderEarlyBird() {
      if (!eb || !eb.applicable) return '';
      if (eb.already) return '';        // the token itself is shown below

      if (!eb.rsvp_in_time) {
        return `<div class="eb">
          <div class="eb-tag" style="color:var(--text-dim)">Tonight's free shot</div>
          <div style="font-size:.88rem;color:var(--text-muted);line-height:1.5">
            You needed to say <strong style="color:#FFF">going</strong> before
            ${escapeHtml(eb.deadline)} today to get one. Next Monday.
          </div></div>`;
      }
      if (!eb.window_open) {
        return `<div class="eb">
          <div class="eb-tag" style="color:var(--gold,#D4AF50)">Tonight's free shot</div>
          <div style="font-size:.88rem;color:var(--text-muted);line-height:1.5">
            You are on the list. Open this page between
            <strong style="color:#FFF">${escapeHtml(eb.opens)}</strong> and
            <strong style="color:#FFF">${escapeHtml(eb.closes)}</strong> at the bar to claim it.
          </div></div>`;
      }
      return `<div class="eb live">
        <div class="eb-tag" style="color:var(--green)">
          <i class="fa-solid fa-bolt"></i> Open now &middot; until ${escapeHtml(eb.closes)}</div>
        <div style="font-size:1rem;font-weight:700;color:#FFF;margin-bottom:10px">
          Your free shot is ready</div>
        <button type="button" class="btn btn-pink" id="btnClaim" style="width:100%">
          Claim it</button>
      </div>`;
    }

    function renderToken(t) {
      return `
        <div class="tok">
          ${t.poster_url ? `<img class="tok-poster" src="${escapeHtml(t.poster_url)}" alt="" />` : ''}
          <div class="tok-body">
            <div class="tok-kind">Free shot</div>
            <div class="tok-note">${escapeHtml(t.note || '')}</div>
            <div class="tok-exp">
              <i class="fa-regular fa-clock"></i>
              Expires ${new Date(t.expires_at).toLocaleTimeString('en-GB',
                 { hour:'2-digit', minute:'2-digit' })}
            </div>
            <button type="button" class="btn btn-pink" data-give="${t.id}"
                    style="width:100%;margin-top:12px">
              Give to the bar
            </button>

            <!-- Same size as the button, directly under it: the bartender sees the seconds
                 moving BEFORE they tap, which is what proves the screen is live and not a
                 screenshot of somebody else's token. -->
            <div class="live-clock" data-liveclock>
              <span class="lc-time" data-clock>--:--:--</span>
              <span class="lc-date" data-date></span>
            </div>
          </div>
        </div>`;
    }

    function renderBurnt(b) {
      return `
        <div class="burnt" data-burnt="${b.redeemed_at}">
          <div class="burnt-stamp">Used</div>
          <div class="burnt-clock" data-clock>--:--:--</div>
          <div class="burnt-date" data-date></div>
          <div class="burnt-since" data-since></div>
          <div class="burnt-who">
            <strong>${escapeHtml(me.full_name || 'Member')}</strong><br>
            <span style="font-size:.74rem">${escapeHtml(b.note || '')}</span>
          </div>
        </div>`;
    }

    // One ticking clock for every burnt card, so a screenshot is stale the moment it is
    // taken — that is the whole anti-reuse mechanism, so it must never stop.
    function startClock() {
      if (clockTimer) clearInterval(clockTimer);
      const tick = () => {
        const now = serverNow();

        // Every clock on the page — the live ones on unused tokens and the frozen-proof
        // ones on burnt cards — reads from the same server-corrected time.
        document.querySelectorAll('[data-clock]').forEach(el => {
          el.textContent = clockText(now);
        });
        document.querySelectorAll('[data-date]').forEach(el => {
          el.textContent = dateText(now);
        });

        document.querySelectorAll('[data-burnt]').forEach(card => {
          const at = new Date(card.dataset.burnt.replace(' ', 'T'));
          const s = Math.max(0, Math.round((now - at) / 1000));
          card.querySelector('[data-since]').textContent =
            s < 60 ? `burned ${s}s ago` : `burned ${Math.floor(s / 60)}m ${s % 60}s ago`;
        });
      };
      tick();
      if (document.querySelector('[data-clock]')) clockTimer = setInterval(tick, 250);
    }

    async function claimEarlyBird() {
      const { data: res, error } = await db.rpc('claim_early_bird');
      if (error) { alert(error.message); return; }
      if (!res.granted) {
        alert({
          'outside the window':   `It opens at ${res.opens} and closes at ${res.closes}.`,
          'no RSVP before noon':  'You needed to say going before midday today.',
          'no karaoke tonight':   'No karaoke tonight.',
          'already claimed tonight': 'You already claimed tonight.',
        }[res.reason] || 'Not available right now.');
      }
      await load();
    }

    // Two steps on purpose: burning is final and it happens in a loud room. The first tap
    // is the member's, the second is the bartender's.
    function armToken(id) {
      const wrap = document.createElement('div');
      wrap.style.cssText = `position:fixed;inset:0;z-index:1200;background:rgba(0,0,0,.86);
        backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:24px`;
      wrap.innerHTML = `
        <div style="max-width:420px;width:100%;text-align:center">
          <div style="font-size:.68rem;font-weight:700;letter-spacing:.14em;
                      text-transform:uppercase;color:var(--gold,#D4AF50);margin-bottom:10px">
            Hand the phone over</div>
          <h2 style="font-size:1.5rem;color:#FFF;margin-bottom:14px">Bartender taps below</h2>

          <!-- The clock belongs here above all: this is the screen the bartender is
               reading at the moment they decide to pour. Seconds moving = a live phone. -->
          <div class="live-clock" style="margin:0 0 18px">
            <span class="lc-time" data-clock style="font-size:1.8rem">--:--:--</span>
            <span class="lc-date" data-date></span>
          </div>

          <p class="dim" style="font-size:.86rem;line-height:1.55;margin-bottom:18px">
            This uses the shot immediately and cannot be undone.</p>
          <button type="button" id="doBurn" class="btn btn-pink"
                  style="width:100%;padding:18px;font-size:1.05rem">
            Use the shot now</button>
          <button type="button" id="cancelBurn" class="btn btn-outline"
                  style="width:100%;margin-top:10px">Not yet</button>
        </div>`;
      document.body.appendChild(wrap);
      // The overlay's clock is new to the DOM, so paint it immediately rather than letting
      // it sit on "--:--:--" until the next tick.
      startClock();
      wrap.querySelector('#cancelBurn').addEventListener('click', () => wrap.remove());
      wrap.querySelector('#doBurn').addEventListener('click', async () => {
        const btn = wrap.querySelector('#doBurn');
        const done = busy(btn, 'Using…');
        const { data: res, error } = await db.rpc('redeem_token',
          { p_token: id, p_venue: null, p_note: null });
        if (typeof done === 'function') done();
        if (error) { alert(error.message); wrap.remove(); await load(); return; }
        setServerNow(res.server_now);
        wrap.remove();
        await load();
      });
    }

    async function exchange() {
      if (!confirm(`Trade ${data.shot_cost} points for a free shot?`)) return;
      const { error } = await db.rpc('exchange_points_for_shot');
      if (error) { alert(error.message); return; }
      await load();
    }

    init();
  </script>
</body>
</html>
