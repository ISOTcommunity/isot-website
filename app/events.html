<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>ISOT Events Calendar</title>

  <link rel="icon" href="../assets/LOGOS/scritta isot.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="css/app.css" />
  <style>
    .view-toggle-bar {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      padding: 4px;
      margin-bottom: 16px;
      gap: 4px;
    }
    .view-btn {
      flex: 1;
      padding: 8px 12px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .view-btn.active {
      background: var(--pink);
      color: #FFF;
      box-shadow: 0 4px 12px rgba(238, 9, 121, 0.3);
    }

    .month-filter-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin: 0 -18px 20px;
      padding: 0 18px 4px;
      scrollbar-width: none;
    }
    .month-filter-strip::-webkit-scrollbar { display: none; }
    .month-pill {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-fast);
    }
    .month-pill.active {
      background: rgba(238, 9, 121, 0.15);
      border-color: var(--pink);
      color: var(--pink);
    }

    .event-card-item {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 14px;
      display: flex;
      gap: 14px;
      transition: var(--transition-spring);
    }
    .event-card-item:hover {
      border-color: var(--pink);
      transform: translateY(-2px);
    }
    .event-date-box {
      width: 58px;
      height: 64px;
      background: rgba(238, 9, 121, 0.12);
      border: 1px solid var(--border-glow);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      text-align: center;
    }
    .event-date-box .day-num {
      font-size: 1.35rem;
      font-weight: 800;
      color: #FFF;
      line-height: 1;
    }
    .event-date-box .day-name {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--pink);
      text-transform: uppercase;
      margin-top: 3px;
    }

    /* Monthly Grid View */
    .monthly-grid {
      display: grid;
      grid-template-columns: repeat(1, 1fr);
      gap: 16px;
    }
    .month-section-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 18px;
    }
    .month-section-header {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--pink);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-light);
      padding-bottom: 10px;
    }

    /* Weekly View Cards */
    .week-day-group {
      margin-bottom: 20px;
    }
    .week-day-header {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .week-day-header::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-light);
    }
  </style>
</head>
<body>

  <div id="gate"><div class="spinner"></div></div>

  <!-- Top Bar -->
  <header class="topbar">
    <a href="home.html" class="topbar-title" style="display: flex; align-items: center; gap: 8px;">
      <i class="fa-solid fa-calendar-days text-pink"></i>
      <span>ISOT Calendar</span>
    </a>
    <div style="display: flex; align-items: center; gap: 10px;">
      <div id="headerAvatar" style="cursor: pointer;" data-open-drawer></div>
      <button type="button" id="burgerBtn" aria-label="Account menu" style="background: transparent; border: none; color: #FFF; font-size: 1.3rem; cursor: pointer; padding: 6px;">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
  </header>

  <main class="shell">

    <div style="margin-bottom: 16px;">
      <div class="eyebrow"><i class="fa-solid fa-sparkles"></i> Official Schedule (Sep – Dec 2026)</div>
      <h1 style="font-size: 1.8rem; margin-top: 4px;">ISOT Calendar</h1>
    </div>

    <!-- View Mode Switcher (List | Weekly | Monthly) -->
    <div class="view-toggle-bar">
      <button type="button" class="view-btn active" id="btnListView" onclick="setViewMode('list')">
        <i class="fa-solid fa-list-ul"></i> List
      </button>
      <button type="button" class="view-btn" id="btnWeeklyView" onclick="setViewMode('weekly')">
        <i class="fa-solid fa-calendar-week"></i> Weekly
      </button>
      <button type="button" class="view-btn" id="btnMonthlyView" onclick="setViewMode('monthly')">
        <i class="fa-solid fa-calendar-days"></i> Monthly
      </button>
    </div>

    <!-- Month Filter Pills -->
    <div class="month-filter-strip" id="monthFilterStrip">
      <button type="button" class="month-pill active" onclick="filterMonth('all')">All Months</button>
      <button type="button" class="month-pill" onclick="filterMonth('sep')">September</button>
      <button type="button" class="month-pill" onclick="filterMonth('oct')">October</button>
      <button type="button" class="month-pill" onclick="filterMonth('nov')">November</button>
      <button type="button" class="month-pill" onclick="filterMonth('dec')">December</button>
    </div>

    <!-- Events Container -->
    <div id="eventsContainer"></div>

  </main>

  <!-- Mobile Bottom Tab Bar -->
  <nav class="tabbar">
    <a href="home.html" class="tab-item">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 011-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      Home
    </a>
    <a href="profile.html" class="tab-item">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 9h.01M9 9h.01M12 12h.01M12 15h.01M3 20.4V3.6A1.6 1.6 0 014.6 2h14.8A1.6 1.6 0 0121 3.6v16.8M3 20.4h18"/></svg>
      Card
    </a>
    <a href="events.html" class="tab-item active">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      Calendar
    </a>
  </nav>

  <script src="vendor/supabase.js"></script>
  <script src="js/isot.js"></script>

      { id: 22, date: '2026-11-20', month: 'nov', dayName: 'FRI', dayNum: '20', title: 'ISOT Zenit Party', venue: 'Zenit Club', time: '23:00', cat: 'party', logo: '../assets/LOGOS/Party.jpeg' },

      // DECEMBER

      { id: 34, date: '2026-12-21', month: 'dec', dayName: 'MON', dayNum: '21', title: 'ISOT Karaoke Night', venue: 'Rough Bar', time: '21:00', cat: 'karaoke', logo: '../assets/LOGOS/Karaoke.png', link: 'karaoke.html' }
    ];

    const MONTH_LABELS = { sep: 'September 2026', oct: 'October 2026', nov: 'November 2026', dec: 'December 2026' };

    let currentView = 'list';
    let currentMonth = 'all';

    async function initEventsCalendar() {
      const me = await requireAuth();
      document.getElementById('headerAvatar').innerHTML = renderGeoAvatar(me.member_code, 36);

      renderEvents();
    }

    function setViewMode(mode) {
      currentView = mode;
      document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
      if (mode === 'list') document.getElementById('btnListView').classList.add('active');
      if (mode === 'weekly') document.getElementById('btnWeeklyView').classList.add('active');
      if (mode === 'monthly') document.getElementById('btnMonthlyView').classList.add('active');
      renderEvents();
    }

    function filterMonth(m) {
      currentMonth = m;
      document.querySelectorAll('.month-pill').forEach(pill => pill.classList.remove('active'));
      event.target.classList.add('active');
      renderEvents();
    }

    function getFilteredEvents() {
      if (currentMonth === 'all') return EVENTS_DATA;
      return EVENTS_DATA.filter(item => item.month === currentMonth);
    }

    function renderEvents() {
      const container = document.getElementById('eventsContainer');
      const items = getFilteredEvents();

      if (!items.length) {
        container.innerHTML = '<div class="card card-glass" style="text-align:center;padding:30px">No events for this selection.</div>';
        return;
      }

      if (currentView === 'list') {
        container.innerHTML = items.map(item => renderEventItemHtml(item)).join('');
      } else if (currentView === 'weekly') {
        container.innerHTML = renderWeeklyView(items);
      } else if (currentView === 'monthly') {
        container.innerHTML = renderMonthlyView(items);
      }
    }

    function renderEventItemHtml(item) {
      return `
        <div class="event-card-item">
          <div class="event-date-box">
            <span class="day-num">${item.dayNum}</span>
            <span class="day-name">${item.dayName}</span>
          </div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
              <div style="display:flex;align-items:center;gap:8px">
                <img src="${item.logo}" alt="" style="width:24px;height:24px;border-radius:6px;object-fit:cover;" />
                <span class="badge badge-socio">20% OFF</span>
                ${item.special ? `<span class="badge badge-live">${item.special}</span>` : ''}
              </div>
              <span class="dim" style="font-size:0.75rem">${item.time}</span>
            </div>
            <h2 style="font-size:1.05rem;color:#FFF;margin-bottom:4px">${escapeHtml(item.title)}</h2>
            <p class="dim" style="margin-bottom:8px"><i class="fa-solid fa-location-dot text-pink"></i> ${escapeHtml(item.venue)}</p>
            ${item.link ? `<a href="${item.link}" class="btn btn-pink" style="width:auto;padding:5px 12px;font-size:0.78rem;display:inline-flex">Join Song Queue</a>` : `<a href="profile.html" class="btn btn-outline" style="width:auto;padding:5px 12px;font-size:0.78rem;display:inline-flex">Show Member Card</a>`}
          </div>
        </div>
      `;
    }

    function renderWeeklyView(items) {
      const days = ['MON', 'FRI', 'SAT'];
      let html = '';

      days.forEach(day => {
        const dayEvents = items.filter(e => e.dayName === day);
        if (dayEvents.length) {
          const dayLabel = day === 'MON' ? 'Mondays • Karaoke @ Rough' : (day === 'FRI' ? 'Fridays • ISOT Zenit Parties' : 'Saturdays • ISOT Pre-Parties');
          html += `
            <div class="week-day-group">
              <div class="week-day-header"><i class="fa-solid fa-calendar-day text-pink"></i> ${dayLabel}</div>
              ${dayEvents.map(item => renderEventItemHtml(item)).join('')}
            </div>
          `;
        }
      });

      return html || '<div class="card card-glass" style="text-align:center;padding:30px">No events for this week selection.</div>';
    }

    function renderMonthlyView(items) {
      const months = ['sep', 'oct', 'nov', 'dec'];
      let html = '<div class="monthly-grid">';

      months.forEach(mKey => {
        const mEvents = items.filter(e => e.month === mKey);
        if (mEvents.length) {
          html += `
            <div class="month-section-card">
              <div class="month-section-header">
                <span>${MONTH_LABELS[mKey]}</span>
                <span class="badge badge-participant" style="font-size:0.75rem">${mEvents.length} Events</span>
              </div>
              ${mEvents.map(item => renderEventItemHtml(item)).join('')}
            </div>
          `;
        }
      });

      html += '</div>';
      return html;
    }

    document.addEventListener('DOMContentLoaded', initEventsCalendar);
  </script>
</body>
