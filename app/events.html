<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ISOT Events Calendar</title>

  <link rel="icon" href="icon-180.png" type="image/png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-title" content="ISOT" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0B0F19" />
  <!-- Vercel Web Analytics -->
  <script defer src="/_vercel/insights/script.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="css/app.css" />
  <style>
    .view-toggle-bar {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      padding: 4px;
      margin-bottom: 16px;
      gap: 4px;
    }
    .view-btn {
      flex: 1;
      padding: 8px 12px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .view-btn.active {
      background: var(--pink);
      color: #FFF;
      box-shadow: 0 4px 12px rgba(238, 9, 121, 0.3);
    }

    /* Month Navigation Controls */
    .cal-nav-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 10px 14px;
    }
    .cal-nav-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-light);
      color: #FFF;
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition-fast);
    }
    .cal-nav-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--pink);
    }
    .cal-month-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #FFF;
    }

    /* 7-Column Month Calendar Matrix */
    .cal-matrix {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 10px;
      margin-bottom: 20px;
    }
    .cal-matrix-head {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--pink);
      text-align: center;
      padding: 6px 0;
      text-transform: uppercase;
    }
    .cal-matrix-day {
      min-height: 48px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 6px 2px;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: var(--transition-fast);
    }
    .cal-matrix-day:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .cal-matrix-day.other-month {
      opacity: 0.2;
      pointer-events: none;
    }
    .cal-matrix-day.has-event {
      border-color: rgba(238, 9, 121, 0.4);
      background: rgba(238, 9, 121, 0.12);
    }
    .cal-matrix-day.selected {
      border-color: var(--pink);
      background: rgba(238, 9, 121, 0.28);
      box-shadow: 0 0 14px rgba(238, 9, 121, 0.4);
    }
    .cal-day-num {
      font-size: 0.88rem;
      font-weight: 700;
      color: #FFF;
    }
    .cal-event-dots {
      display: flex;
      gap: 3px;
    }
    .cal-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--pink);
    }
    .cal-dot.party { background: #FF6A00; }
    .cal-dot.karaoke { background: #EBC17F; }

    /* List Event Cards */
    .event-card-item {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: var(--transition-spring);
    }
    .event-card-item:hover {
      border-color: var(--pink);
      transform: translateY(-2px);
    }
    .event-card-top {
      display: flex;
      gap: 14px;
    }
    .event-date-box {
      width: 58px;
      height: 64px;
      background: rgba(238, 9, 121, 0.12);
      border: 1px solid var(--border-glow);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      text-align: center;
    }
    .event-date-box .day-num {
      font-size: 1.35rem;
      font-weight: 800;
      color: #FFF;
      line-height: 1;
    }
    .event-date-box .day-name {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--pink);
      text-transform: uppercase;
      margin-top: 3px;
    }

    /* RSVP & Who's Going Avatar Stack Bar */
    .rsvp-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 12px;
      border-top: 1px solid var(--border-light);
    }
    .avatar-stack-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      cursor: pointer;
    }
    .avatar-stack {
      display: flex;
      align-items: center;
    }
    .avatar-stack-item-box {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1.5px solid var(--bg-card);
      margin-left: -8px;
      overflow: hidden;
      flex-shrink: 0;
      background: #1E293B;
    }
    .avatar-stack-item-box:first-child {
      margin-left: 0;
    }
    .avatar-stack-count {
      font-size: 0.76rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-rsvp {
      padding: 5px 14px;
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-light);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      transition: var(--transition-fast);
    }
    .btn-rsvp:hover {
      border-color: var(--pink);
      color: #FFF;
    }
    .btn-rsvp.going {
      background: rgba(16, 185, 129, 0.16);
      border-color: #10B981;
      color: #10B981;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.25);
    }

    /* Modal Sheet for Attendees Profile Cards */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(11, 15, 25, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 1000;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-sheet {
      width: 100%;
      max-width: 480px;
      background: var(--bg-darker);
      border: 1px solid var(--border-glow);
      border-bottom: none;
      border-radius: 28px 28px 0 0;
      padding: 24px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal-backdrop.active .modal-sheet {
      transform: translateY(0);
    }

    .attendee-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      margin-bottom: 10px;
    }
    .attendee-info { flex: 1; min-width: 0; }
    .attendee-name { font-size: 0.95rem; font-weight: 700; color: #FFF; margin-bottom: 4px; }
    .attendee-meta-pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .meta-pill {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-light);
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
  </style>
</head>
<body>

        <span id="notifBellBadge" style="display: none; position: absolute; top: -2px; right: -2px; background: var(--pink); color: #FFF; font-size: 0.65rem; font-weight: 700; border-radius: 10px; min-width: 16px; height: 16px; align-items: center; justify-content: center; padding: 0 4px; border: 1.5px solid var(--bg-dark);">0</span>

  <!-- Attendees Profile List Modal Drawer -->
  <div class="modal-backdrop" id="attendeesModal" onclick="closeAttendeesModal()">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
        <div>
          <div class="eyebrow"><i class="fa-solid fa-users text-pink"></i> Attending Members</div>
          <h2 style="font-size:1.3rem;color:#FFF;margin-top:2px" id="modalEventTitle">Event Name</h2>

        <button type="button" onclick="closeAttendeesModal()" style="background:transparent;border:none;color:var(--text-muted);font-size:1.4rem;cursor:pointer">

  <script src="vendor/supabase.js"></script>

  <script>
    // The calendar comes from the database. This was 42 hardcoded event objects, which
    // meant changing a time required editing HTML and redeploying — and the calendar
    // disagreed with the check-in system, because resolve_instance() reads the database
    // while this read an array.
    //
    // Recurring events are rules, not rows per date: calendar_between() expands them.
    // Each occurrence is keyed `${event_id}|${date}` because one event now happens on
    // many dates.
    let EVENTS_DATA = [];

    const CATEGORY_LOGO = {
      karaoke: '../assets/LOGOS/Karaoke.png',
      social:  '../assets/LOGOS/Tog.jpeg',
      party:   '../assets/LOGOS/Party.jpeg',
      drinks:  '../assets/LOGOS/Drink.jpeg',
      career:  '../assets/LOGOS/Busines.jpeg',
      sports:  '../assets/LOGOS/Sport.jpeg',
    };

    const DAY_NAMES = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];

    async function loadCalendar() {
      // Wide enough to cover the month and week views without refetching as you page.
      const from = new Date(); from.setMonth(from.getMonth() - 1);
      const to   = new Date(); to.setMonth(to.getMonth() + 6);
      const iso  = d => d.toISOString().slice(0, 10);

      const { data, error } = await db.rpc('calendar_between', {
        p_from: iso(from), p_to: iso(to),
      });

      if (error) {
        console.error('Could not load the calendar:', error.message);
        EVENTS_DATA = [];
        return;
      }

      EVENTS_DATA = (data || []).map(e => {
        const d = new Date(e.event_date + 'T00:00:00');
        return {
          id: `${e.event_id}|${e.event_date}`,   // unique per occurrence
          eventId: e.event_id,
          instanceId: e.instance_id,
          date: e.event_date,
          year: d.getFullYear(),
          monthIdx: d.getMonth(),
          dayNum: d.getDate(),
          dayName: DAY_NAMES[d.getDay()],
          title: e.title,
          venue: e.venue_address ? `${e.venue_name} • ${e.venue_address}` : e.venue_name,
          venueName: e.venue_name,
          time: (e.start_time || '').slice(0, 5),
          cat: e.category || 'social',
          logo: CATEGORY_LOGO[e.category] || CATEGORY_LOGO.social,
          goingCount: Number(e.going_count) || 0,
          link: e.has_karaoke ? 'karaoke.html' : null,
          membersOnly: e.members_only,
          special: e.description || null,
        };
      });
    }

    async function loadMyRsvps() {
      const from = new Date(); from.setMonth(from.getMonth() - 1);
      const to   = new Date(); to.setMonth(to.getMonth() + 6);
      const iso  = d => d.toISOString().slice(0, 10);

      const { data, error } = await db.rpc('my_rsvps', { p_from: iso(from), p_to: iso(to) });
      if (error) { console.error('Could not load your RSVPs:', error.message); return; }

      userRsvps = {};
      (data || []).forEach(r => { userRsvps[`${r.event_id}|${r.event_date}`] = true; });
    }


    const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

    let meProfile = null;
    let userRsvps = {};   // filled by loadMyRsvps() from the database
    let currentView = 'list';
    let currYear = 2026;
    let currMonthIdx = Math.max(7, new Date().getMonth()); // Default to current month (August = 7)
    let currWeekStart = new Date(2026, 7, 24); // Week of Aug 24, 2026
    let selectedDateStr = null;

    async function initEventsCalendar() {
      try {
        meProfile = await requireAuth();
        if (document.getElementById('headerAvatar')) {
          document.getElementById('headerAvatar').innerHTML = renderUserAvatarHtml(meProfile, 36);
        }
        await loadCalendar();
        await loadMyRsvps();
      } catch (err) {
        console.error('Events init note:', err);
      } finally {
        const gate = document.getElementById('gate');
        if (gate) gate.remove();
        renderMainView();
      }
    }

    async function toggleRsvp(occurrenceKey) {
      // RSVPs were kept in localStorage, so they never synced between a phone and a
      // laptop and the board could not see them. toggle_rsvp() creates the event
      // instance if that night has never been touched, then flips the row.
      const [eventId, date] = occurrenceKey.split('|');

      const { data, error } = await db.rpc('toggle_rsvp', {
        p_event_id: eventId, p_date: date,
      });

      if (error) { alert('Could not update your RSVP: ' + error.message); return; }

      if (data.going) userRsvps[occurrenceKey] = true;
      else delete userRsvps[occurrenceKey];

      const occ = EVENTS_DATA.find(e => e.id === occurrenceKey);
      if (occ) { occ.goingCount = data.going_count; occ.instanceId = data.instance_id; }

      renderMainView();
    }

    function openAttendeesModal(eventTitle, eventId) {
      const isGoing = !!userRsvps[eventId];
      let html = '';

      if (isGoing && meProfile) {
        html += renderMemberCardHtml(meProfile, true);
      }

      if (!isGoing) {
        html = `<div class="dim" style="text-align:center;padding:30px">No members have marked going yet. Click "I'm Going" to join the list!</div>`;
      }

      document.getElementById('modalEventTitle').textContent = eventTitle;
      document.getElementById('attendeesListContainer').innerHTML = html;
      document.getElementById('attendeesModal').classList.add('active');
    }

    function closeAttendeesModal() {
      document.getElementById('attendeesModal').classList.remove('active');
    }

    let invitedFriendsMap = {};

    async function openInviteModal(eventTitle, eventId) {
      let friendsList = [];

      // Connected friends come from the database. Reading localStorage here meant the
      // invite sheet showed whatever this browser happened to remember — including
      // people who had not accepted, and nobody added on another device.
      const { data: fRows } = await db
        .from('friendships')
        .select('user_id, friend_id, status')
        .eq('status', 'connected')
        .or(`user_id.eq.${meProfile.id},friend_id.eq.${meProfile.id}`);

      const friendState = {};
      (fRows || []).forEach(f => {
        friendState[f.user_id === meProfile.id ? f.friend_id : f.user_id] = 'connected';
      });
      const connectedIds = Object.keys(friendState).filter(id => friendState[id] === 'connected');

      try {
        const { data } = await db.from('profiles').select('*').neq('id', meProfile ? meProfile.id : '');
        if (data && data.length) {
          // Strictly filter ONLY connected/accepted friends
          friendsList = data.filter(p => connectedIds.includes(p.id));
        }
      } catch (e) {
        console.warn('Friends fetch note:', e);
      }

      let modal = document.getElementById('inviteFriendsModal');
      if (!modal) {
        modal = document.createElement('div');
        modal.className = 'modal-backdrop';
        modal.id = 'inviteFriendsModal';
        modal.onclick = () => modal.classList.remove('active');
        modal.innerHTML = `
          <div class="modal-sheet" onclick="event.stopPropagation()">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
              <div>
                <div class="eyebrow"><i class="fa-solid fa-paper-plane text-pink"></i> Event Invitations</div>
                <h3 style="font-size:1.15rem;color:#FFF;margin-top:2px" id="inviteModalTitle">Invite Friends</h3>
              </div>
              <button type="button" onclick="document.getElementById('inviteFriendsModal').classList.remove('active')" style="background:transparent;border:none;color:var(--text-muted);font-size:1.3rem;cursor:pointer"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p class="dim" style="font-size:0.82rem;margin-bottom:14px">Select which connected friends you want to invite:</p>
            <div id="friendsInviteListContainer" style="display:flex;flex-direction:column;gap:10px;max-height:50vh;overflow-y:auto;"></div>
          </div>
        `;
        document.body.appendChild(modal);
      }

      document.getElementById('inviteModalTitle').textContent = `Invite to ${eventTitle}`;

      const container = document.getElementById('friendsInviteListContainer');

      if (!friendsList.length) {
        container.innerHTML = `
          <div class="card card-glass" style="text-align:center;padding:26px">
            <i class="fa-solid fa-user-group text-pink" style="font-size:1.8rem;margin-bottom:10px"></i>
            <h4 style="font-size:1rem;color:#FFF;margin-bottom:4px">No Connected Friends Yet</h4>
            <p class="dim" style="font-size:0.82rem;margin-bottom:14px">Connect with students in the ISOT Network first to invite them to events!</p>
            <a href="network.html" class="btn btn-pink" style="width:auto;display:inline-flex;padding:6px 16px;font-size:0.82rem;">
              <i class="fa-solid fa-users"></i> Go to ISOT Network 🌐
            </a>
          </div>
        `;
      } else {
        container.innerHTML = friendsList.map(f => {
          const key = `${eventId}_${f.id}`;
          const isAlreadyInvited = !!invitedFriendsMap[key];

          return `
            <div class="card card-glass" style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;margin:0;">
              <div style="display:flex;align-items:center;gap:12px">
                ${renderUserAvatarHtml(f, 42)}
                <div>
                  <div style="font-weight:700;color:#FFF;font-size:0.9rem">${escapeHtml(f.full_name || 'Member')}</div>
                  <div class="dim" style="font-size:0.75rem">${escapeHtml(f.nationality || 'Turin Student')} • ${escapeHtml(f.university || 'UniTo')}</div>
                </div>
              </div>
              <button type="button" id="btnInvite_${key}" class="btn ${isAlreadyInvited ? 'btn-outline' : 'btn-pink'}" style="width:auto;padding:6px 14px;font-size:0.78rem;" onclick="sendSingleFriendInvite('${f.id}', '${escapeHtml(f.full_name)}', '${escapeHtml(eventTitle)}', ${eventId}, '${key}')">
                ${isAlreadyInvited ? '<i class="fa-solid fa-check text-green"></i> Invited' : '<i class="fa-solid fa-envelope"></i> Invite 💌'}
              </button>
            </div>
          `;
        }).join('');
      }

      modal.classList.add('active');
    }


    function sendSingleFriendInvite(friendId, friendName, eventTitle, eventId, key) {
      sendNotification(friendId, 'event_invite', `Event Invitation: ${eventTitle}`, `${meProfile ? meProfile.full_name : 'A friend'} invited you to join ${eventTitle}!`, eventId);
      invitedFriendsMap[key] = true;

      const btn = document.getElementById(`btnInvite_${key}`);
      if (btn) {
        btn.className = 'btn btn-outline';
        btn.innerHTML = '<i class="fa-solid fa-check text-green"></i> Invited ✅';
      }
    }

    function setViewMode(mode) {
      currentView = mode;
      document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
      if (mode === 'list') document.getElementById('btnListView').classList.add('active');
      if (mode === 'weekly') document.getElementById('btnWeeklyView').classList.add('active');
      if (mode === 'monthly') document.getElementById('btnMonthlyView').classList.add('active');
      renderMainView();
    }

    function changeMonth(delta) {
      currMonthIdx += delta;
      if (currMonthIdx < 7) currMonthIdx = 7; // Aug 2026
      if (currMonthIdx > 11) currMonthIdx = 11; // Dec 2026
      selectedDateStr = null;
      renderMainView();
    }

    function changeWeek(deltaDays) {
      currWeekStart.setDate(currWeekStart.getDate() + deltaDays);
      renderMainView();
    }

    function renderMainView() {
      const container = document.getElementById('calendarViewContainer');

      if (currentView === 'list') {
        container.innerHTML = renderListView();
      } else if (currentView === 'weekly') {
        container.innerHTML = renderWeeklyMatrixView();
      } else if (currentView === 'monthly') {
        container.innerHTML = renderMonthlyMatrixView();
      }
    }

    /* -------------------------------------------------------------
     * 1. MONTHLY MATRIX VIEW (7 Columns: Mon-Sun)
     * ------------------------------------------------------------- */
    function renderMonthlyMatrixView() {
      const firstDay = new Date(currYear, currMonthIdx, 1);
      const totalDays = new Date(currYear, currMonthIdx + 1, 0).getDate();
      
      const firstDayOfWeek = (firstDay.getDay() + 6) % 7;

      let html = `
        <div class="cal-nav-header">
          <button type="button" class="cal-nav-btn" onclick="changeMonth(-1)" ${currMonthIdx <= 7 ? 'disabled style="opacity:0.4"' : ''}>
            <i class="fa-solid fa-chevron-left"></i> Prev Month
          </button>
          <div class="cal-month-title">${MONTH_NAMES[currMonthIdx]} ${currYear}</div>
          <button type="button" class="cal-nav-btn" onclick="changeMonth(1)" ${currMonthIdx >= 11 ? 'disabled style="opacity:0.4"' : ''}>
            Next Month <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>

        <div class="cal-matrix">
          <div class="cal-matrix-head">MON</div>
          <div class="cal-matrix-head">TUE</div>
          <div class="cal-matrix-head">WED</div>
          <div class="cal-matrix-head">THU</div>
          <div class="cal-matrix-head">FRI</div>
          <div class="cal-matrix-head">SAT</div>
          <div class="cal-matrix-head">SUN</div>
      `;

      for (let i = 0; i < firstDayOfWeek; i++) {
        html += `<div class="cal-matrix-day other-month"><span class="cal-day-num"></span></div>`;
      }

      for (let day = 1; day <= totalDays; day++) {
        const mStr = String(currMonthIdx + 1).padStart(2, '0');
        const dStr = String(day).padStart(2, '0');
        const dateStr = `${currYear}-${mStr}-${dStr}`;

        const dayEvents = EVENTS_DATA.filter(e => e.date === dateStr);
        const hasEvents = dayEvents.length > 0;
        const isSelected = selectedDateStr === dateStr;

        let dotsHtml = '';
        if (hasEvents) {
          dotsHtml = '<div class="cal-event-dots">' + dayEvents.map(e => `<span class="cal-dot ${e.cat}"></span>`).join('') + '</div>';
        }

        html += `
          <div class="cal-matrix-day ${hasEvents ? 'has-event' : ''} ${isSelected ? 'selected' : ''}" onclick="selectDate('${dateStr}')">
            <span class="cal-day-num">${day}</span>
            ${dotsHtml}
          </div>
        `;
      }

      html += `</div>`;

      if (selectedDateStr) {
        const selectedEvents = EVENTS_DATA.filter(e => e.date === selectedDateStr);
        html += `
          <div class="card card-glass" style="margin-top:16px">
            <h3 style="margin-bottom:12px;font-size:1rem;color:var(--pink)">
              <i class="fa-solid fa-calendar-day"></i> Events on ${selectedDateStr}
            </h3>
            ${selectedEvents.length ? selectedEvents.map(e => renderEventCardHtml(e)).join('') : '<div class="dim">No events scheduled for this day.</div>'}
          </div>
        `;
      } else {
        const monthEvents = EVENTS_DATA.filter(e => e.monthIdx === currMonthIdx);
        html += `
          <div style="margin-top:16px">
            <div class="eyebrow" style="margin-bottom:10px">${MONTH_NAMES[currMonthIdx]} Schedule Feed</div>
            ${monthEvents.map(e => renderEventCardHtml(e)).join('')}
          </div>
        `;
      }

      return html;
    }

    function selectDate(dateStr) {
      selectedDateStr = selectedDateStr === dateStr ? null : dateStr;
      renderMainView();
    }

    /* -------------------------------------------------------------
     * 2. WEEKLY MATRIX VIEW
     * ------------------------------------------------------------- */
    function renderWeeklyMatrixView() {
      const weekStart = new Date(currWeekStart);
      const weekEnd = new Date(currWeekStart);
      weekEnd.setDate(weekEnd.getDate() + 6);

      const startStr = `${weekStart.getDate()} ${MONTH_NAMES[weekStart.getMonth()].slice(0,3)}`;
      const endStr = `${weekEnd.getDate()} ${MONTH_NAMES[weekEnd.getMonth()].slice(0,3)} ${weekEnd.getFullYear()}`;

      let html = `
        <div class="cal-nav-header">
          <button type="button" class="cal-nav-btn" onclick="changeWeek(-7)">
            <i class="fa-solid fa-chevron-left"></i> Prev Week
          </button>
          <div class="cal-month-title">${startStr} – ${endStr}</div>
          <button type="button" class="cal-nav-btn" onclick="changeWeek(7)">
            Next Week <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>
      `;

      let weekEventsFound = 0;
      for (let i = 0; i < 7; i++) {
        const d = new Date(weekStart);
        d.setDate(d.getDate() + i);

        const yStr = d.getFullYear();
        const mStr = String(d.getMonth() + 1).padStart(2, '0');
        const dNum = String(d.getDate()).padStart(2, '0');
        const dateStr = `${yStr}-${mStr}-${dNum}`;

        const dayEvents = EVENTS_DATA.filter(e => e.date === dateStr);
        if (dayEvents.length) {
          weekEventsFound += dayEvents.length;
          html += `
            <div class="week-day-group" style="margin-bottom:16px">
              <div class="week-day-header" style="font-weight:700;color:var(--text-dim);font-size:0.82rem;margin-bottom:8px">
                <i class="fa-solid fa-calendar-day text-pink"></i> ${d.toDateString().slice(0,10)}
              </div>
              ${dayEvents.map(e => renderEventCardHtml(e)).join('')}
            </div>
          `;
        }
      }

      if (!weekEventsFound) {
        html += `<div class="card card-glass" style="text-align:center;padding:30px">No ISOT events scheduled for this week.</div>`;
      }

      return html;
    }

    /* -------------------------------------------------------------
     * 3. LIST FEED VIEW
     * ------------------------------------------------------------- */
    function renderListView() {
      return EVENTS_DATA.map(item => renderEventCardHtml(item)).join('');
    }

    function renderEventCardHtml(item) {
      const isGoing = !!userRsvps[item.id];
      const totalCount = isGoing ? 1 : 0;

      let stackHtml = '';
      if (isGoing && meProfile) {
        stackHtml += `<div class="avatar-stack-item-box" title="You (${meProfile.full_name})">${renderUserAvatarHtml(meProfile, 26)}</div>`;
      }

      return `
        <div class="event-card-item">
          <div class="event-card-top">
            <div class="event-date-box">
              <span class="day-num">${item.dayNum}</span>
              <span class="day-name">${item.dayName}</span>
            </div>
            <div style="flex:1;min-width:0">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
                <div style="display:flex;align-items:center;gap:8px">
                  <div style="width:24px;height:24px;border-radius:6px;overflow:hidden;display:inline-flex;align-items:center;justify-content:center">
                    <img src="${item.logo}" alt="" style="width:100%;height:100%;object-fit:cover;${item.cat === 'karaoke' ? 'transform:scale(1.85);' : ''}" />
                  </div>
                  <span class="badge badge-socio">20% OFF</span>
                  ${item.special ? `<span class="badge badge-live">${item.special}</span>` : ''}
                </div>
                <span class="dim" style="font-size:0.75rem">${item.time}</span>
              </div>
              <h2 style="font-size:1.05rem;color:#FFF;margin-bottom:4px">${escapeHtml(item.title)}</h2>
              <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
                ${item.link ? `<a href="${item.link}" class="btn btn-pink" style="width:auto;padding:5px 12px;font-size:0.78rem;display:inline-flex">Join Song Queue</a>` : `<a href="profile.html" class="btn btn-outline" style="width:auto;padding:5px 12px;font-size:0.78rem;display:inline-flex">Show Member Card</a>`}
                <button type="button" class="btn btn-outline" style="width:auto;padding:5px 12px;font-size:0.78rem;display:inline-flex" onclick="openInviteModal('${escapeHtml(item.title)}', ${item.id})">
                  <i class="fa-solid fa-paper-plane text-pink"></i> Invite Friends
                </button>
              </div>
            </div>
          </div>

          <div class="rsvp-row">
            <div class="avatar-stack-wrapper" onclick="openAttendeesModal('${escapeHtml(item.title)}', ${item.id})">
              ${isGoing ? `<div class="avatar-stack">${stackHtml}</div><span class="avatar-stack-count"><strong>1 Going</strong> • You <i class="fa-solid fa-chevron-right text-pink" style="font-size:0.7rem;margin-left:4px"></i></span>` : `<span class="avatar-stack-count">Be the first to RSVP <i class="fa-solid fa-chevron-right text-pink" style="font-size:0.7rem;margin-left:4px"></i></span>`}
            </div>

            <button type="button" onclick="event.stopPropagation(); toggleRsvp(${item.id})" class="btn-rsvp ${isGoing ? 'going' : ''}">
              <i class="${isGoing ? 'fa-solid fa-circle-check' : 'fa-regular fa-calendar-plus'}"></i>
              <span>${isGoing ? "I'm Going!" : "I'm Going"}</span>
            </button>
          </div>
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', initEventsCalendar);
  </script>
</body>
</html>
