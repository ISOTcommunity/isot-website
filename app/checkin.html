<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>ISOT Event Check-In</title>

  <link rel="icon" href="../assets/LOGOS/scritta isot.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

  <div id="gate"><div class="spinner"></div></div>

  <header class="topbar">
    <a href="home.html" class="topbar-title" style="display: flex; align-items: center; gap: 8px;">
      <i class="fa-solid fa-location-dot text-pink"></i>
      <span>Event Poster Check-In</span>
    </a>
  </header>

  <main class="shell" style="text-align: center; padding-top: 40px;">

    <div class="card card-glow" style="padding: 36px 24px;">
      <div style="font-size: 3.5rem; color: var(--green); margin-bottom: 16px;"><i class="fa-solid fa-circle-check"></i></div>
      <h1 style="font-size: 2rem; margin-bottom: 8px;">Checked In!</h1>
      <p style="color: var(--text-muted); font-size: 1rem; margin-bottom: 24px;" id="checkinEventName">
        Welcome to Monday Karaoke Night @ Rough Bar!
      </p>

      <a href="home.html" class="btn btn-pink">Go to App Home →</a>
    </div>

  </main>

  <script src="vendor/supabase.js"></script>
  <script src="js/isot.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await requireAuth();
    });
  </script>
</body>
</html>
