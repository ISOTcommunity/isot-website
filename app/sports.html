  <style>
    #sportsMap {
      height: 340px;
      width: 100%;
      border-radius: 20px;
      border: 1px solid var(--border-glow);
      box-shadow: 0 12px 32px rgba(238, 9, 121, 0.2);
      margin-bottom: 20px;
    }
    
    .leaflet-control-attribution {
      background: rgba(11, 15, 25, 0.6) !important;
      color: var(--text-dim) !important;
      font-size: 0.65rem !important;
      border-radius: 6px 0 0 0;
    }
    .leaflet-control-attribution a { color: var(--text-dim) !important; }

    .filter-bar {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 20px;
      -webkit-overflow-scrolling: touch;
    }
    .filter-bar::-webkit-scrollbar { display: none; }

    .filter-btn {
      flex-shrink: 0;
      padding: 9px 16px;
      border-radius: 9999px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--border-light);
      color: var(--text-muted);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .filter-btn.active {
      background: linear-gradient(135deg, #EE0979, #FF6A00);
      border-color: transparent;
      color: #FFF;
      box-shadow: 0 6px 18px rgba(238, 9, 121, 0.4);
    }

    .sports-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .sports-card:hover {
      border-color: rgba(238, 9, 121, 0.5);
      transform: translateY(-2px);
    }

    .badge-free {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.78rem;
      font-weight: 700;
      background: rgba(34, 197, 94, 0.15);
      color: #22C55E;
      padding: 4px 10px;
      border-radius: 9999px;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
  </style>

<body>

  <main class="shell" style="padding-top:18px;padding-bottom:96px">

    <!-- Category Filter Bar -->

      <button class="filter-btn active" onclick="filterSports('all', this)"><i class="fa-solid fa-layer-group"></i> All Spots (11)</button>
      <button class="filter-btn" onclick="filterSports('basketball', this)"><i class="fa-solid fa-basketball"></i> Basketball Courts (6)</button>

  <script>
    const SPORTS_SPOTS = [
      // BASKETBALL COURTS
      {
        id: "dora-basket",
        name: "Parco Dora Playground (Covered Roof)",
        type: "basketball",
        address: "Via Nole / Via Borgaro (Area Vitali), 10149 Torino",
        coords: [45.0885, 7.6690],
        icon: "fa-basketball",
        badge: "Covered Roof • Rainproof 🔥",
        desc: "Turin's most famous streetball court under the massive industrial steel roof. High-energy pickup games every afternoon."
      },
      {
        id: "ruffini-basket",
        name: "Parco Ruffini Basketball Playground",
        type: "basketball",
        address: "Corso Trapani / Corso Rosselli, 10141 Torino",
        coords: [45.0645, 7.6405],
        icon: "fa-basketball",
        badge: "2 Full Courts + Night Lights",
        desc: "Famous outdoor streetball hub next to Palazzetto dello Sport. Packed with local and university players every day."
      },
      {
        id: "arbarello-basket",
        name: "Piazza Arbarello Court (City Centre)",
        type: "basketball",
        address: "Piazza Arbarello, 10122 Torino",
        coords: [45.0718, 7.6740],
        icon: "fa-basketball",
        badge: "Downtown Court",
        desc: "Renovated outdoor basketball court in the heart of Turin near Corso Siccardi."
      },
      {
        id: "ferrucci-basket",
        name: "Giardino Ferrucci (PoliTo Court)",
        type: "basketball",
        address: "Corso Ferrucci / Via Borsellino, 10138 Torino",
        coords: [45.0620, 7.6590],
        icon: "fa-basketball",
        badge: "2 Min Walk from PoliTo",
        desc: "Outdoor streetball court very popular with Politecnico engineering and architecture students after lectures."
      },
      {
        id: "valentino-basket",
        name: "Parco del Valentino Basketball Court",
        type: "basketball",
        address: "Viale Mattioli (Castello del Valentino), 10125 Torino",
        coords: [45.0535, 7.6850],
        icon: "fa-basketball",
        badge: "Park & River View",
        desc: "Outdoor basketball hoops inside Valentino Park, surrounded by trees near the riverbank."
      },
      {
        id: "colletta-basket",
        name: "Giardino Nicholas Green (CLE Court)",
        type: "basketball",
        address: "Corso Regio Parco / Lungo Dora Colletta, 10153 Torino",
        coords: [45.0780, 7.7050],
        icon: "fa-basketball",
        badge: "Near UniTo CLE Campus",
        desc: "Free public court close to UniTo Campus Luigi Einaudi in Vanchiglietta."
      },

      // PING PONG TABLES
      {
        id: "valentino-pingpong",
        name: "Parco del Valentino Ping Pong Zone",
        type: "pingpong",
        address: "Viale Virgiliano (Near Borgo Medievale), 10125 Torino",
        coords: [45.0520, 7.6840],
        icon: "fa-table-tennis-paddle-ball",
        badge: "Concrete Tables in Shade",
        desc: "Permanent stone/concrete ping pong tables under tree shade. Bring your own paddles & balls!"
      },
      {
        id: "dora-pingpong",
        name: "Parco Dora Ping Pong Tables",
        type: "pingpong",
        address: "Near Parco Dora Skatepark (Area Ingest), 10149 Torino",
        coords: [45.0890, 7.6650],
        icon: "fa-table-tennis-paddle-ball",
        badge: "Next to Skatepark",
        desc: "Outdoor concrete ping pong tables surrounded by the industrial park scenery."
      },
      {
        id: "reali-pingpong",
        name: "Giardini Reali Public Ping Pong",
        type: "pingpong",
        address: "Viale Primo Maggio / Piazza Castello, 10122 Torino",
        coords: [45.0735, 7.6880],
        icon: "fa-table-tennis-paddle-ball",
        badge: "Royal Gardens Area",
        desc: "Public outdoor ping pong zone right near the city center in the Royal Gardens area."
      },
      {
        id: "pellerina-pingpong",
        name: "Parco della Pellerina Ping Pong",
        type: "pingpong",
        address: "Corso Appio Claudio, 10146 Torino",
        coords: [45.0875, 7.6360],
        icon: "fa-table-tennis-paddle-ball",
        badge: "Near Central Pond",
        desc: "Concrete ping pong tables next to the duck pond and running track in Turin's largest green park."
      },
      {
        id: "ruffini-pingpong",
        name: "Parco Ruffini Outdoor Ping Pong",
        type: "pingpong",
        address: "Corso Rosselli Entrance, 10141 Torino",
        coords: [45.0640, 7.6420],
        icon: "fa-table-tennis-paddle-ball",
        badge: "Next to Workout Area",
        desc: "Outdoor ping pong tables alongside the outdoor calisthenics fitness zone."
      }
    ];

    let map = null;
    let markers = [];

    async function initSportsPage() {
      const me = await requireAuth();
      document.getElementById('headerAvatar').innerHTML = renderUserAvatarHtml(me, 36);

      // Initialize Leaflet Map
      map = L.map('sportsMap', { zoomControl: false, attributionControl: false }).setView([45.0684, 7.6740], 13);
      L.control.attribution({ prefix: false, position: 'bottomright' }).addAttribution('&copy; OSM').addTo(map);

      L.tileLayer('https://cartodb-basemaps-{s}.global.ssl.fastly.net/dark_all/{z}/{x}/{y}.png', {
        maxZoom: 19
      }).addTo(map);

      renderSports(SPORTS_SPOTS);
    }

    function renderSports(list) {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      const container = document.getElementById('sportsList');
      container.innerHTML = list.map(s => `
        <div class="sports-card">
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
            <span class="badge-free"><i class="fa-solid fa-circle-check"></i> 100% Free Public Access</span>
            <span style="font-size:0.75rem; color:var(--text-dim); font-weight:700;">${s.badge}</span>
          </div>
          <h3 style="font-size:1.2rem; color:#FFF; margin-bottom:4px;"><i class="fa-solid ${s.icon} text-pink"></i> ${s.name}</h3>
          <p style="font-size:0.82rem; color:var(--pink); margin-bottom:8px;"><i class="fa-solid fa-location-dot"></i> ${s.address}</p>
          <p style="color:var(--text-dim); font-size:0.86rem; line-height:1.5; margin-bottom:14px;">${s.desc}</p>
          <div style="display:flex; gap:10px;">
            <a href="https://maps.google.com/?q=${s.coords[0]},${s.coords[1]}" target="_blank" rel="noopener" class="btn btn-pink" style="flex:1; justify-content:center; padding:9px;">
              <i class="fa-solid fa-location-arrow"></i> Navigate to Court
            </a>
          </div>
        </div>
      `).join('');

      const bounds = L.latLngBounds();
      list.forEach(s => {
        const pinColor = s.type === 'basketball' ? '#FF6A00' : '#22C55E';
        const pinHtml = `<div class="isot-pin" style="background:${pinColor}; box-shadow: 0 0 16px ${pinColor}88;"><i class="fa-solid ${s.icon}"></i></div>`;
        const customPin = L.divIcon({
          className: 'isot-pin-wrapper',
          html: pinHtml,
          iconSize: [32, 32], iconAnchor: [16, 16]
        });

        const marker = L.marker(s.coords, { icon: customPin }).addTo(map).bindPopup(`<b>${s.name}</b><br>${s.badge}`);
        markers.push(marker);
        bounds.extend(s.coords);
      });

      if (list.length > 0) {
        map.fitBounds(bounds, { padding: [30, 30], maxZoom: 15 });
      }
    }

    function filterSports(type, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      let filtered = SPORTS_SPOTS;
      if (type === 'basketball') filtered = SPORTS_SPOTS.filter(s => s.type === 'basketball');
      if (type === 'pingpong') filtered = SPORTS_SPOTS.filter(s => s.type === 'pingpong');

      renderSports(filtered);
    }

    document.addEventListener('DOMContentLoaded', initSportsPage);
  </script>
