<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#000000" />
  <meta name="robots" content="noindex" />
  <title>Explore · ISOT App</title>

  <link rel="icon" href="logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/app.css" />
  <style>
    /* A grid, not a scrolling strip. Karaoke sat sixth in a horizontal scroll on the
       home screen, so the flagship night was the one thing nobody saw. */
    .cat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }
    .cat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md) var(--radius-md) var(--radius-arc) var(--radius-md);
      overflow: hidden;
      text-align: left;
      padding: 0;
      cursor: pointer;
      font-family: inherit;
      color: inherit;
      width: 100%;
      transition: var(--transition-fast);
    }
    .cat-card:hover { border-color: var(--border-strong); transform: translateY(-2px); }
    .cat-card:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
    .cat-card.empty { opacity: 0.55; }

    .cat-art {
      height: 96px;
      background: var(--bg-darker);
      display: flex; align-items: center; justify-content: center;
    }
    .cat-art img { width: 100%; height: 100%; object-fit: cover; }
    .cat-art img.contain { object-fit: contain; padding: 10px; }

    .cat-body { padding: 12px 13px 14px; }
    .cat-name { color: #FFF; font-weight: 700; font-size: 0.92rem; line-height: 1.25; }
    .cat-next { font-size: 0.76rem; color: var(--text-dim); margin-top: 5px; line-height: 1.4; }
    .cat-count {
      display: inline-block; margin-top: 8px; font-size: 0.68rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.06em;
      padding: 2px 9px; border-radius: 999px;
      background: var(--pink-glow); color: #FFF;
    }
    .cat-count.none { background: rgba(255,255,255,0.06); color: var(--text-dark); }
  </style>
</head>
<body>

  <div id="gate"><div class="spinner"></div></div>

  <header class="topbar">
    <a href="home.html" class="topbar-title">Explore</a>
    <button type="button" id="burgerBtn" aria-label="Account menu"
            style="background:transparent;border:none;color:#FFF;font-size:1.3rem;cursor:pointer;padding:6px">
      <i class="fa-solid fa-bars"></i>
    </button>
  </header>

  <main class="shell" style="max-width:620px">
    <div class="eyebrow">What ISOT does</div>
    <h1 style="font-size:1.7rem;margin-top:2px">Explore ISOT life</h1>
    <p class="dim" style="font-size:0.86rem;margin-top:6px;margin-bottom:18px">
      Every kind of night we run, and what is actually coming up in each.
    </p>

    <div class="cat-grid" id="grid">
      <div class="spinner" style="margin:36px auto"></div>
    </div>
  </main>

  <script src="vendor/supabase.js"></script>
  <script src="js/isot.js"></script>
  <script>
  /* Art per category. 'drinks' is deliberately absent — the aperitivo is part of the
     Social Hub and the Monday karaoke, not a night of its own, and a category with
     nothing in it is a dead end on the one screen meant to show what ISOT does. */
  const CATEGORIES = [
    { key: 'karaoke', name: 'Karaoke Night',      art: '../assets/characters/char_karaoke_singer.png', contain: true },
    { key: 'social',  name: 'Together & Social',  art: '../assets/LOGOS/Tog.jpeg' },
    { key: 'party',   name: 'Party & Nightlife',  art: '../assets/characters/char_dancer_1.png', contain: true },
    { key: 'career',  name: 'Career & Workshops', art: '../assets/LOGOS/Busines.jpeg' },
    { key: 'sports',  name: 'Sports & Trips',     art: '../assets/characters/char_cat_wizards.png', contain: true },
  ];

  (async () => {
    await requireAuth();

    const iso = d => d.toISOString().slice(0, 10);
    const { data, error } = await db.rpc('calendar_between', {
      p_from: iso(new Date()),
      p_to:   iso(new Date(Date.now() + 90 * 86400000)),
    });

    const el = document.getElementById('grid');
    if (error) {
      el.innerHTML = `<p class="dim" style="grid-column:1/-1;font-size:0.86rem">Could not load events: ${escapeHtml(error.message)}</p>`;
      return;
    }

    const events = data || [];

    el.innerHTML = CATEGORIES.map(c => {
      // Real events only. The category panels this replaces were hardcoded — one
      // advertised a workshop at a campus with a date that had already passed.
      const mine = events
        .filter(e => (e.category || 'social') === c.key)
        .sort((a, b) => a.event_date.localeCompare(b.event_date));

      const next = mine[0];
      const when = next
        ? new Date(next.event_date + 'T00:00:00')
            .toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' })
        : null;

      return `
        <button type="button" class="cat-card ${next ? '' : 'empty'}"
                onclick="location.href='events.html?cat=${c.key}'">
          <div class="cat-art">
            <img src="${c.art}" alt="" class="${c.contain ? 'contain' : ''}" />
          </div>
          <div class="cat-body">
            <div class="cat-name">${escapeHtml(c.name)}</div>
            <div class="cat-next">
              ${next
                ? `Next: ${escapeHtml(when)} · ${escapeHtml((next.start_time || '').slice(0,5))}<br />${escapeHtml(next.venue_name || '')}`
                : 'Nothing scheduled yet'}
            </div>
            <span class="cat-count ${mine.length ? '' : 'none'}">
              ${mine.length ? mine.length + ' coming up' : 'none planned'}
            </span>
          </div>
        </button>`;
    }).join('');
  })();
  </script>
</body>
</html>
