  <style>
    #tourMap { height: 46vh; min-height: 300px; width: 100%; background: #111; }
    .leaflet-control-attribution {
      background: rgba(0,0,0,0.5) !important; color: var(--text-dim) !important;
      font-size: 0.6rem !important;
    }
    .leaflet-control-attribution a { color: var(--text-dim) !important; text-decoration: none; }

    /* Numbered map markers. A location mark, not a gem — the number is the point,
       because the whole game is that the stops come in order. */
    .stop-pin { display:flex; align-items:center; justify-content:center;
      width:30px; height:30px; border-radius:50% 50% 50% 4px; transform: rotate(-45deg);
      font-weight:800; font-size:0.82rem; border:2px solid rgba(0,0,0,0.55);
      box-shadow:0 3px 10px rgba(0,0,0,0.6); }
    .stop-pin > span { transform: rotate(45deg); }
    .stop-pin.todo    { background:#1A1A22; color:var(--text-muted); border-color:rgba(255,255,255,0.28); }
    .stop-pin.done    { background:var(--green,#4ED88A); color:#07120C; }
    .stop-pin.current { background:var(--pink); color:var(--on-accent);
                        animation: stopPulse 1.9s ease-in-out infinite; }
    @keyframes stopPulse {
      0%,100% { box-shadow:0 3px 10px rgba(0,0,0,0.6), 0 0 0 0 var(--pink-glow); }
      50%     { box-shadow:0 3px 10px rgba(0,0,0,0.6), 0 0 0 13px rgba(212,90,232,0); }
    }

    .stop { display:flex; gap:14px; padding:16px 0; border-bottom:1px solid var(--border-light); }
    .stop:last-child { border-bottom:none; }
    .stop-num { flex-shrink:0; width:30px; height:30px; border-radius:50%; display:flex;
      align-items:center; justify-content:center; font-weight:800; font-size:0.82rem;
      background:#1A1A22; color:var(--text-muted); border:1px solid var(--border-light); }
    .stop.done .stop-num    { background:var(--green,#4ED88A); color:#07120C; border-color:transparent; }
    .stop.current .stop-num { background:var(--pink); color:var(--on-accent); border-color:transparent; }
    .stop.todo  .stop-name  { color:var(--text-muted); }
    .stop-name  { font-weight:600; font-size:1rem; margin-bottom:3px; }
    .stop-hint  { font-size:0.86rem; color:var(--text-muted); line-height:1.5; }
    .stop-leg   { font-size:0.74rem; color:var(--text-dim); margin:2px 0 6px; }
    .stop-reveal { font-size:0.84rem; color:var(--text-dim); line-height:1.5; margin-top:7px;
      padding-left:11px; border-left:2px solid var(--green,#4ED88A); }

    .prog-track { height:6px; border-radius:3px; background:rgba(255,255,255,0.10); overflow:hidden; }
    .prog-fill  { height:100%; background:var(--pink); border-radius:3px; transition:width .5s ease; }

    .goldchip { display:inline-flex; align-items:center; gap:5px; font-size:0.7rem;
      font-weight:700; text-transform:uppercase; letter-spacing:0.05em;
      color:#FFC978; background:rgba(255,201,120,0.12); padding:3px 9px; border-radius:999px; }
  </style>
</head>
<body>

  <div id="gate"><div class="spinner"></div></div>

  <header class="topbar">
    <a href="home.html" class="topbar-title" style="display:flex;align-items:center;gap:8px">
      <i class="fa-solid fa-route text-pink"></i>
      <span>One Day in Turin</span>
    </a>
    <div style="display:flex;align-items:center;gap:12px">
      <a href="partner.html" style="color:#FFF;font-size:1.15rem;padding:4px" title="Map"><i class="fa-solid fa-map-location-dot"></i></a>
      <div id="headerAvatar" style="cursor:pointer" data-open-drawer></div>
      <button type="button" id="burgerBtn" aria-label="Account menu" style="background:transparent;border:none;color:#FFF;font-size:1.3rem;cursor:pointer;padding:6px">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
  </header>

  <div id="tourMap"></div>

  <main class="shell" style="padding-top:18px;padding-bottom:96px">
    <div id="tourHead"></div>
    <div class="card card-glass" style="margin-top:16px">
      <div id="stopList"></div>
    </div>
  </main>

  <script src="vendor/supabase.js"></script>
  <script src="vendor/leaflet.js"></script>
  <script src="js/isot.js"></script>
  <script>
  (async () => {
    const me = await requireAuth();
    const av = document.getElementById('headerAvatar');
    if (av) av.innerHTML = renderUserAvatarHtml(me, 36);
    if (typeof ensureNav === 'function') ensureNav();

    // The trail is picked by id when one is passed, otherwise the first active trail.
    // There is one today; the page does not assume there will only ever be one.
    const wanted = new URLSearchParams(location.search).get('t');
    let trailId = wanted;
    if (!trailId) {
      const { data: list } = await db.rpc('trails_list');
      if (!list || !list.length) {
        document.getElementById('tourHead').innerHTML =
          '<p class="muted">No walk is running at the moment.</p>';
        return;
      }
      trailId = list[0].id;
    }

    let T = null;
    let map = null, roadLine = null, markerLayer = null, brightLine = null;

    async function load() {
      const { data, error } = await db.rpc('trail_detail', { p_trail: trailId });
      if (error || !data || !data.ok) {
        document.getElementById('tourHead').innerHTML =
          '<p class="muted">Could not load the walk.</p>';
        return;
      }
      T = data;
      T.stops.sort((a, b) => a.position - b.position);
      drawHead();
      drawMap();
      drawStops();
    }

    function drawHead() {
      const pct = T.total ? Math.round((T.done / T.total) * 100) : 0;
      document.getElementById('tourHead').innerHTML = `
        <p class="eyebrow" style="margin-bottom:6px">Walking tour</p>
        <h1 style="font-size:1.6rem;margin-bottom:8px">${escapeHtml(T.name)}</h1>
        <p class="muted" style="font-size:0.9rem;line-height:1.6">${escapeHtml(T.blurb || '')}</p>

        <div style="display:flex;gap:18px;flex-wrap:wrap;margin:16px 0 10px;font-size:0.82rem">
          <span class="dim"><i class="fa-solid fa-route"></i> ${T.distance_km} km${T.walk_minutes ? ` · ${T.walk_minutes} min walking` : ''}</span>
          <span class="dim"><i class="fa-solid fa-location-dot"></i> ${T.total} stops</span>
          <span class="dim"><i class="fa-solid fa-sun"></i> Sunset ${escapeHtml(T.sunset_local || '—')}</span>
          <span class="dim"><i class="fa-solid fa-star"></i> +${T.bonus_points} to finish</span>
        </div>

        <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
        <p class="dim" style="font-size:0.78rem;margin-top:7px">
          ${T.completed
            ? 'Finished. You walked the whole thing.'
            : `${T.done} of ${T.total} stops done.`}
        </p>`;
    }

    function drawMap() {
      // Null lat/lng becomes 0 through Number(), which draws the route out into the
      // Atlantic rather than failing. Refuse instead.
      if (T.stops.some(s => s.lat == null || s.lng == null)) {
        document.getElementById('tourMap').innerHTML =
          '<p class="muted" style="padding:24px;text-align:center">Route unavailable.</p>';
        console.warn('trail: stop coordinates missing — is migration 031 applied?');
        return;
      }
      const marks = T.stops.map(s => [Number(s.lat), Number(s.lng)]);

      // The road follows real pavement. T.route is 493 points of Valhalla pedestrian
      // routing stored by migration 033; joining the stops directly would cut through
      // the Palazzo Reale and across the Po. If it is missing we fall back to the
      // straight line rather than showing no road at all — wrong shape beats nothing,
      // and the console says which.
      let pts = marks;
      if (Array.isArray(T.route) && T.route.length > 1) {
        pts = T.route.map(c => [Number(c[0]), Number(c[1])]);
      } else {
        console.warn('trail: no street geometry — is migration 033 applied?');
      }

      if (!map) {
        map = L.map('tourMap', { zoomControl: false, attributionControl: false });
        L.control.attribution({ prefix: false, position: 'bottomright' })
          .addAttribution('&copy; OSM').addTo(map);
        L.tileLayer('https://cartodb-basemaps-{s}.global.ssl.fastly.net/dark_all/{z}/{x}/{y}.png',
          { maxZoom: 19 }).addTo(map);
        markerLayer = L.layerGroup().addTo(map);
      }

      // The road. Drawn twice: a wide dark casing underneath so the bright line reads
      // against pale buildings and dark parks alike, then the line itself on top.
      if (roadLine) roadLine.remove();
      const casing = L.polyline(pts, { color: '#000', weight: 11, opacity: 0.55, lineJoin: 'round', lineCap: 'round' });
      brightLine  = L.polyline(pts, { color: '#D45AE8', weight: 5, opacity: 0.95, lineJoin: 'round', lineCap: 'round' });
      roadLine = L.layerGroup([casing, brightLine]).addTo(map);

      markerLayer.clearLayers();
      T.stops.forEach((s, i) => {
        const cls = s.done ? 'done' : (s.current ? 'current' : 'todo');
        L.marker(marks[i], {
          icon: L.divIcon({
            className: 'stop-pin-wrap',
            html: `<div class="stop-pin ${cls}"><span>${s.position}</span></div>`,
            iconSize: [30, 30], iconAnchor: [15, 30],
          }),
          zIndexOffset: s.current ? 1000 : 0,
        }).addTo(markerLayer)
          .on('click', () => {
            const el = document.getElementById('stop-' + s.position);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          });
      });

      map.fitBounds(L.latLngBounds(pts), { padding: [38, 38] });

      drawRoad();
    }

    /* Draw the road on, rather than having it appear. Leaflet renders a polyline as
       an SVG <path>, so the honest way to animate it is the path's own length: hide
       the whole stroke with a dash gap, then close the gap. No library, no redraw per
       frame, and the browser does it on the compositor.

       Runs once per page load, not on every refresh after a claim — an animation you
       cannot skip stops being a flourish and starts being a wait. */
    let roadDrawn = false;
    function drawRoad() {
      if (!brightLine) return;
      const path = brightLine.getElement && brightLine.getElement();
      if (!path || !path.getTotalLength) return;

      // Someone who has asked their system for less motion gets the finished road.
      const still = window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (roadDrawn || still) return;
      roadDrawn = true;

      const len = path.getTotalLength();
      path.style.strokeDasharray  = len;
      path.style.strokeDashoffset = len;
      // Force a reflow so the browser registers the offset before the transition,
      // otherwise both values land in the same frame and nothing animates.
      void path.getBoundingClientRect();
      path.style.transition = 'stroke-dashoffset 2.2s cubic-bezier(0.33, 0.9, 0.3, 1)';
      requestAnimationFrame(() => { path.style.strokeDashoffset = '0'; });

      // Clear the dash once it has arrived, so later redraws are plain solid strokes.
      setTimeout(() => {
        path.style.transition = '';
        path.style.strokeDasharray = '';
        path.style.strokeDashoffset = '';
      }, 2400);
    }

    function drawStops() {
      document.getElementById('stopList').innerHTML = T.stops.map(s => {
        const cls = s.done ? 'done' : (s.current ? 'current' : 'todo');
        return `
        <div class="stop ${cls}" id="stop-${s.position}">
          <div class="stop-num">${s.done ? '<i class="fa-solid fa-check"></i>' : s.position}</div>
          <div style="flex:1;min-width:0">
            <div class="stop-name">${escapeHtml(s.name)}
              ${s.golden_hour ? '<span class="goldchip" style="margin-left:7px"><i class="fa-solid fa-sun"></i> Sunset</span>' : ''}
            </div>
            ${s.leg_m ? `<div class="stop-leg"><i class="fa-solid fa-person-walking"></i> ${s.leg_m} m from the last stop · about ${s.leg_minutes} min</div>` : ''}
            <div class="stop-hint">${escapeHtml(s.hint || '')}</div>
            ${s.reveal ? `<div class="stop-reveal">${escapeHtml(s.reveal)}</div>` : ''}
            ${s.current ? `
              <div id="claimAlert" style="margin-top:11px" hidden></div>
              <input type="file" id="stopFile" accept="image/*" capture="environment"
                     style="display:none" onchange="onStopPhoto(event)" />
              <button type="button" class="btn btn-pink" style="margin-top:11px"
                      onclick="document.getElementById('stopFile').click()">
                <i class="fa-solid fa-camera"></i> I'm here — take the photo
              </button>
              <p class="dim" style="font-size:0.76rem;margin-top:8px">
                Within ${s.radius_m}m of the spot. ${s.points} points.
              </p>` : ''}
          </div>
        </div>`;
      }).join('');
    }

    function say(msg, kind) {
      const el = document.getElementById('claimAlert');
      if (!el) return;
      el.hidden = false;
      el.className = 'alert alert-' + (kind || 'error');
      el.textContent = msg;
    }

    // Same shape as the gem claim on the map page: location checked before anything is
    // uploaded, so a failed claim leaves no orphan photo in storage.
    window.onStopPhoto = async function (ev) {
      const file = ev.target.files && ev.target.files[0];
      if (!file) return;
      const s = T.stops.find(x => x.current);
      if (!s) return;

      const btn = document.querySelector('.stop.current .btn-pink');
      const restore = btn ? busy(btn, 'Checking where you are…') : () => {};

      let pos;
      try {
        pos = await new Promise((res, rej) =>
          navigator.geolocation.getCurrentPosition(res, rej,
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }));
      } catch (e) {
        restore();
        say(e && e.code === 1
          ? 'ISOT needs your location to check you are here. Allow it in your browser settings and try again.'
          : 'Could not get your location. Step out from under the arcades and try again.');
        return;
      }

      if (btn) btn.innerHTML = '<span class="spinner"></span> Preparing photo…';
      let blob;
      try { blob = await shrinkImage(file); }
      catch (e) { restore(); say(e.message || 'Could not read that photo.'); return; }

      if (btn) btn.innerHTML = '<span class="spinner"></span> Uploading…';
      const path = `${s.id}/${Date.now()}.jpg`;
      const { error: upErr } = await db.storage.from('gem-photos')
        .upload(path, blob, { contentType: 'image/jpeg', upsert: false });
      if (upErr) { restore(); say('Photo upload failed — ' + upErr.message); return; }

      const { data, error } = await db.rpc('claim_gem', {
        p_gem_id: s.id,
        p_lat: pos.coords.latitude,
        p_lng: pos.coords.longitude,
        p_accuracy: pos.coords.accuracy,
        p_photo_path: path,
      });

      restore();
      if (error)    { say(error.message); return; }
      if (!data.ok) { say(data.reason); return; }

      say(data.bonus
        ? `That's the whole walk — ${data.points} points, plus ${data.bonus} for finishing.`
        : `Stop ${s.position} done — ${data.points} points.`, 'success');

      // Reload the trail rather than the page: the road, the pins and the list all
      // move forward together, and the map keeps its position.
      setTimeout(load, 1100);
    };

    await load();
  })();
  </script>
</body>
