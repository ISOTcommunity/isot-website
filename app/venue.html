<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="robots" content="noindex" />
  <title>ISOT · Venue</title>

  <link rel="icon" href="logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/app.css" />
  <style>
    /* The one thing a bartender needs mid-shift, so it is the biggest thing on the page. */
    .scan-cta {
      display: flex; align-items: center; gap: 16px; text-decoration: none;
      padding: 22px 20px; border-radius: 22px; margin-bottom: 22px;
      background: linear-gradient(135deg, #D45AE8, #9B8FD4);
      box-shadow: 0 10px 28px rgba(212,90,232,.28);
    }
    .scan-cta i { font-size: 2.1rem; color: #0B0B0F; }
    .scan-cta .t { font-size: 1.25rem; font-weight: 700; color: #0B0B0F; line-height: 1.15; }
    .scan-cta .s { font-size: .8rem; color: rgba(11,11,15,.75); margin-top: 3px; }

    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 22px; }
    .stat { background: var(--bg-card); border: 1px solid var(--border-light);
            border-radius: 18px; padding: 18px; }
    .stat.gold { border-color: rgba(212,175,80,.34);
                 background: linear-gradient(150deg, rgba(212,175,80,.12), var(--bg-card)); }
    .stat .n { font-size: 2.2rem; font-weight: 700; color: #FFF; line-height: 1;
               font-variant-numeric: tabular-nums; }
    .stat .l { font-size: .64rem; letter-spacing: .1em; text-transform: uppercase;
               color: var(--text-dim); font-weight: 700; margin-top: 6px; }

    .ev { display: flex; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--border-light);
          align-items: center; }
    .ev:last-child { border-bottom: none; }
    .ev-date { width: 50px; flex-shrink: 0; text-align: center; border-radius: 12px;
               background: rgba(255,255,255,.05); padding: 6px 0; }
    .ev-date .d { font-size: 1.2rem; font-weight: 700; color: #FFF; line-height: 1; }
    .ev-date .m { font-size: .6rem; letter-spacing: .1em; text-transform: uppercase;
                  color: var(--pink); font-weight: 700; margin-top: 2px; }
    .ev-body { flex: 1; min-width: 0; }
    .ev-title { font-size: .92rem; font-weight: 700; color: #FFF; }
    .ev-meta { font-size: .76rem; color: var(--text-dim); margin-top: 2px; }
    .ev-going { font-size: .8rem; font-weight: 700; color: #8FD99A; white-space: nowrap; }

    .nrow { display: flex; justify-content: space-between; align-items: center;
            padding: 11px 0; border-bottom: 1px solid var(--border-light); }
    .nrow:last-child { border-bottom: none; }
    .nrow .d { font-size: .88rem; color: #FFF; }
    .nrow .c { font-size: 1rem; font-weight: 700; color: #D4AF50; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>

  <div id="gate"><div class="spinner"></div></div>

  <header class="topbar">
    <a href="venue.html" class="topbar-title" id="venueName">ISOT · Venue</a>
    <button type="button" id="burgerBtn" aria-label="Account menu"
            style="background:transparent;border:none;color:#FFF;font-size:1.3rem;cursor:pointer;padding:6px">
      <i class="fa-solid fa-bars"></i>
    </button>
  </header>

  <main class="shell" style="max-width:560px">
    <div class="eyebrow">ISOT partner</div>
    <h1 style="font-size:1.7rem;margin:2px 0 18px" id="title">Your bar</h1>

    <a href="scan.html" class="scan-cta">
      <i class="fa-solid fa-qrcode"></i>
      <div>
        <div class="t">Scan an ISOT card</div>
        <div class="s">Check a member's discount — once per person per night</div>
      </div>
    </a>

    <div id="panel"><div class="spinner" style="margin:40px auto"></div></div>

    <p class="dim" style="font-size:.74rem;margin-top:20px" id="stamp"></p>
  </main>

  <script src="vendor/supabase.js"></script>
  <script src="js/isot.js"></script>
  <script>
    let me = null;

    (async () => {
      me = await requireAuth();
      if (me.staff_role !== 'partner' && me.staff_role !== 'board') {
        denyAccess('This page is for ISOT partner venues.');
        return;
      }
      await load();
    })();

    const pad = n => String(n).padStart(2, '0');
    const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

    async function load() {
      const today = new Date();
      const in30  = new Date(Date.now() + 30 * 864e5);
      const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);

      const [shots, cal, disc] = await Promise.all([
        db.rpc('venue_token_summary', { p_days: 180 }),
        db.rpc('calendar_between', { p_from: iso(today), p_to: iso(in30) }),
        // Discount scans at this bar. RLS (002) already limits a partner to their own venue.
        me.partner_venue_id
          ? db.from('member_validations').select('id', { count: 'exact', head: true })
              .eq('venue_id', me.partner_venue_id).eq('result', 'valid')
              .gte('created_at', monthStart.toISOString())
          : Promise.resolve({ count: null }),
      ]);

      const panel = document.getElementById('panel');
      if (shots.error) {
        panel.innerHTML = `<div class="card card-glass" style="padding:20px">
          <p class="dim" style="margin:0">${escapeHtml(shots.error.message)}</p></div>`;
        return;
      }

      const s = shots.data || {};
      const venue = s.venue;
      if (venue) {
        document.getElementById('venueName').textContent = venue;
        document.getElementById('title').textContent = venue;
      }

      // The calendar is every ISOT night; a partner cares about the ones at their bar.
      const events = (cal.data || []).filter(e => !venue || e.venue_name === venue);
      const nights = s.by_night || [];

      panel.innerHTML = `
        <div class="stats">
          <div class="stat gold">
            <div class="n">${s.this_month || 0}</div>
            <div class="l">Free shots this month</div>
          </div>
          <div class="stat">
            <div class="n">${disc.count ?? '—'}</div>
            <div class="l">Discounts this month</div>
          </div>
        </div>

        <div class="eyebrow" style="margin-bottom:8px">Coming up here</div>
        ${events.length ? `
          <div class="card card-glass" style="padding:4px 16px;margin-bottom:22px">
            ${events.map(e => {
              const d = new Date(e.event_date + 'T12:00:00Z');
              return `<div class="ev">
                <div class="ev-date">
                  <div class="d">${d.getUTCDate()}</div>
                  <div class="m">${d.toLocaleDateString('en-GB', { weekday: 'short', timeZone: 'UTC' })}</div>
                </div>
                <div class="ev-body">
                  <div class="ev-title">${escapeHtml(e.headline || e.title)}</div>
                  <div class="ev-meta">${String(e.start_time).slice(0, 5)}${e.headline ? ' · ' + escapeHtml(e.title) : ''}</div>
                </div>
                <div class="ev-going">${e.going_count} going</div>
              </div>`;
            }).join('')}
          </div>` : `
          <div class="card card-glass" style="padding:20px;text-align:center;margin-bottom:22px">
            <p class="dim" style="margin:0;font-size:.86rem">No ISOT nights here in the next 30 days.</p>
          </div>`}

        <div class="eyebrow" style="margin-bottom:8px">Free shots, night by night</div>
        ${nights.length ? `
          <div class="card card-glass" style="padding:4px 16px">
            ${nights.map(n => {
              const d = new Date(n.night + 'T12:00:00Z');
              return `<div class="nrow">
                <div class="d">${d.toLocaleDateString('en-GB',
                  { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' })}</div>
                <div class="c">${n.shots}</div>
              </div>`;
            }).join('')}
          </div>
          <p class="dim" style="font-size:.72rem;margin-top:6px">
            Counted from the tokens used at your bar — ${s.total || 0} in the last 6 months.</p>` : `
          <div class="card card-glass" style="padding:20px;text-align:center">
            <p class="dim" style="margin:0;font-size:.86rem">
              No free shots used yet. They appear here the moment the first one is.</p>
          </div>`}`;

      document.getElementById('stamp').textContent =
        'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
  </script>
</body>
</html>
