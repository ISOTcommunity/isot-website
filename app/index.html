<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>ISOT App</title>
  
  <link rel="icon" href="logo.png" type="image/png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css" />

  <style>
    body {
      background: var(--bg-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div id="gate"><div class="spinner"></div></div>

  <script src="vendor/supabase.js"></script>
  <script src="js/isot.js"></script>

  <script>
    async function routeEntry() {
      let target = 'login.html';
      if (db) {
        const { data: { session } } = await db.auth.getSession();
        if (session) {
          target = 'home.html';
        }
      }

      // Handle relative path resolution for /app vs /app/ vs file://
      const isFolderWithoutSlash = location.pathname.endsWith('/app');
      const prefix = isFolderWithoutSlash ? 'app/' : '';

      location.replace(prefix + target);
    }
    document.addEventListener('DOMContentLoaded', routeEntry);
  </script>
</body>
</html>
