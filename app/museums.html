  <style>
    #museumMap {
      height: 340px;
      width: 100%;
      border-radius: 20px;
      border: 1px solid var(--border-glow);
      box-shadow: 0 12px 32px rgba(238, 9, 121, 0.2);
      margin-bottom: 20px;
    }
    
    .leaflet-control-attribution {
      background: rgba(11, 15, 25, 0.6) !important;
      color: var(--text-dim) !important;
      font-size: 0.65rem !important;
      border-radius: 6px 0 0 0;
    }
    .leaflet-control-attribution a { color: var(--text-dim) !important; }

    .filter-bar {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 20px;
      -webkit-overflow-scrolling: touch;
    }
    .filter-bar::-webkit-scrollbar { display: none; }

    .filter-btn {
      flex-shrink: 0;
      padding: 9px 16px;
      border-radius: 9999px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--border-light);
      color: var(--text-muted);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .filter-btn.active {
      background: linear-gradient(135deg, #EE0979, #FF6A00);
      border-color: transparent;
      color: #FFF;
      box-shadow: 0 6px 18px rgba(238, 9, 121, 0.4);
    }

    .museum-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .museum-card:hover {
      border-color: rgba(238, 9, 121, 0.5);
      transform: translateY(-2px);
    }

    .price-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.78rem;
      font-weight: 700;
      background: rgba(34, 197, 94, 0.15);
      color: #22C55E;
      padding: 4px 10px;
      border-radius: 9999px;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .price-chip.discount {
      background: rgba(238, 9, 121, 0.15);
      color: var(--pink);
      border-color: rgba(238, 9, 121, 0.3);
    }
  </style>
</head>
<body>

  <div id="gate"><div class="spinner"></div></div>

  <!-- Top Bar -->
  <header class="topbar">
    <a href="home.html" class="topbar-title" style="display:flex;align-items:center;gap:8px">
      <i class="fa-solid fa-landmark text-pink"></i>
      <span>Turin Museums Guide</span>
    </a>
    <div style="display:flex;align-items:center;gap:12px">

      <div id="headerAvatar" style="cursor:pointer" data-open-drawer></div>
      <button type="button" id="burgerBtn" aria-label="Account menu" style="background:transparent;border:none;color:#FFF;font-size:1.3rem;cursor:pointer;padding:6px">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
  </header>

  <main class="shell" style="padding-top:18px;padding-bottom:96px">

    <div style="margin-bottom: 16px;">
      <div class="eyebrow"><i class="fa-solid fa-[#FF6A00] fa-ticket"></i> Student Culture &amp; Heritage</div>
      <h1 style="font-size: 1.8rem; margin-top: 4px;">Turin Museums &amp; Student Discounts</h1>
      <p style="color: var(--text-dim); font-size: 0.88rem; margin-top: 4px;">Explore world-class culture, €2 student rates, and free admission days.</p>
    </div>

    <!-- Category Filter Bar -->
    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterMuseums('all', this)"><i class="fa-solid fa-layer-group"></i> All (8)</button>
      <button class="filter-btn" onclick="filterMuseums('top', this)"><i class="fa-solid fa-star"></i> Must-See Top 3</button>
      <button class="filter-btn" onclick="filterMuseums('student-deal', this)"><i class="fa-solid fa-piggy-bank"></i> €2 Student Rate</button>
      <button class="filter-btn" onclick="filterMuseums('art-cinema', this)"><i class="fa-solid fa-film"></i> Cinema &amp; Art</button>
      <button class="filter-btn" onclick="filterMuseums('cars', this)"><i class="fa-solid fa-car"></i> Cars &amp; Design</button>
    </div>

    <!-- Interactive Museum Map -->
    <div id="museumMap"></div>

    <!-- Museum Cards Container -->
    <div id="museumList"></div>

  </main>

  <!-- Mobile Bottom Tab Bar -->

  <script src="vendor/supabase.js"></script>

  <script>
    const MUSEUMS = [
      {
        id: "egizio",
        name: "Museo Egizio (Egyptian Museum)",
        category: "top",
        address: "Via Accademia delle Scienze 6, 10123 Torino",
        coords: [45.0684, 7.6843],
        studentRate: "€15 (Reduced)",
        dealBadge: "Must-See #1 World Class",
        isStudentDeal: false,
        isArtCinema: false,
        isCars: false,
        desc: "The world's second largest Egyptian museum after Cairo, housing over 30,000 ancient artifacts, mummies, and royal statues."
      },
      {
        id: "cinema",
        name: "National Museum of Cinema (Mole Antonelliana)",
        category: "top art-cinema",
        address: "Via Montebello 20, 10124 Torino",
        coords: [45.0689, 7.6931],
        studentRate: "€10 Student / Lift Combo €17",
        dealBadge: "Panoramic View + Cinema",
        isStudentDeal: false,
        isArtCinema: true,
        isCars: false,
        desc: "Located inside the iconic Mole Antonelliana tower. Spiral cinema exhibitions + panoramic glass elevator overlooking Turin & the Alps."
      },
      {
        id: "palazzo-reale",
        name: "Musei Reali (Royal Palace of Turin)",
        category: "top student-deal",
        address: "Piazzetta Reale 1, 10122 Torino",
        coords: [45.0726, 7.6861],
        studentRate: "€2.00 (EU Students 18–25)",
        dealBadge: "€2 EU Student Ticket 🔥",
        isStudentDeal: true,
        isArtCinema: false,
        isCars: false,
        desc: "Historic Royal Residence of the House of Savoy, featuring the Royal Armory (Armeria Reale), Galleria Sabauda, and free Royal Gardens."
      },
      {
        id: "mauto",
        name: "MAUTO - National Automobile Museum",
        category: "cars",
        address: "Corso Unità d'Italia 40, 10126 Torino",
        coords: [45.0315, 7.6742],
        studentRate: "€12 Student Rate",
        dealBadge: "Fiat & Ferrari Legacy",
        isStudentDeal: false,
        isArtCinema: false,
        isCars: true,
        desc: "World-famous car museum showcasing over 200 rare automobiles from vintage 1890 models to iconic Italian Ferraris, Alfa Romeos & Fiat concepts."
      },
      {
        id: "gam",
        name: "GAM - Civic Gallery of Modern & Contemporary Art",
        category: "art-cinema student-deal",
        address: "Via Magenta 31, 10128 Torino",
        coords: [45.0642, 7.6685],
        studentRate: "€8 Student / Free 1st Tuesday",
        dealBadge: "Free 1st Tuesday of Month",
        isStudentDeal: true,
        isArtCinema: true,
        isCars: false,
        desc: "Over 45,000 works of 19th & 20th century modern art, featuring paintings, sculptures, installations, and contemporary video art."
      },
      {
        id: "mao",
        name: "MAO - Museum of Eastern Art",
        category: "art-cinema",
        address: "Via San Domenico 28, 10122 Torino",
        coords: [45.0745, 7.6790],
        studentRate: "€8 Student Rate",
        dealBadge: "Asian Art & Culture",
        isStudentDeal: false,
        isArtCinema: true,
        isCars: false,
        desc: "Stunning collections of Asian art, featuring Japanese samurai armor, ancient Gandhara Buddhas, Chinese ceramics, and Islamic calligraphy."
      },
      {
        id: "palazzo-madama",
        name: "Palazzo Madama (Museum of Ancient Art)",
        category: "student-deal",
        address: "Piazza Castello, 10122 Torino",
        coords: [45.0710, 7.6853],
        studentRate: "€2.00 (EU Students 18–25)",
        dealBadge: "UNESCO Castle in Center",
        isStudentDeal: true,
        isArtCinema: false,
        isCars: false,
        desc: "Historic castle in Piazza Castello spanning Roman gates, medieval towers, and Baroque palace architecture with panoramic tower views."
      },
      {
        id: "pista500",
        name: "Pinacoteca Agnelli & Pista 500 (Lingotto)",
        category: "cars art-cinema",
        address: "Via Nizza 230, 10126 Torino",
        coords: [45.0322, 7.6655],
        studentRate: "€10 Student Rate",
        dealBadge: "Fiat Rooftop Test Track",
        isStudentDeal: false,
        isArtCinema: true,
        isCars: true,
        desc: "Exquisite private art collection on the roof of the former Lingotto Fiat factory, featuring an outdoor sculpture park along the historic rooftop race track."
      }
    ];

    let map = null;
    let markers = [];

    async function initMuseumsPage() {
      const me = await requireAuth();
      document.getElementById('headerAvatar').innerHTML = renderUserAvatarHtml(me, 36);

      // Initialize Leaflet Map
      map = L.map('museumMap', { zoomControl: false, attributionControl: false }).setView([45.0684, 7.6843], 13);
      L.control.attribution({ prefix: false, position: 'bottomright' }).addAttribution('&copy; OSM').addTo(map);

      L.tileLayer('https://cartodb-basemaps-{s}.global.ssl.fastly.net/dark_all/{z}/{x}/{y}.png', {
        maxZoom: 19
      }).addTo(map);

      renderMuseums(MUSEUMS);
    }

    function renderMuseums(list) {
      // Clear Map Markers
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      const listContainer = document.getElementById('museumList');
      listContainer.innerHTML = list.map(m => `
        <div class="museum-card">
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
            <span class="price-chip ${m.isStudentDeal ? 'discount' : ''}"><i class="fa-solid fa-tag"></i> ${m.studentRate}</span>
            <span style="font-size:0.75rem; color:var(--text-dim); font-weight:700;">${m.dealBadge}</span>
          </div>
          <h3 style="font-size:1.2rem; color:#FFF; margin-bottom:4px;">${m.name}</h3>
          <p style="font-size:0.82rem; color:var(--pink); margin-bottom:8px;"><i class="fa-solid fa-location-dot"></i> ${m.address}</p>
          <p style="color:var(--text-dim); font-size:0.86rem; line-height:1.5; margin-bottom:14px;">${m.desc}</p>
          <div style="display:flex; gap:10px;">
            <a href="https://maps.google.com/?q=${m.coords[0]},${m.coords[1]}" target="_blank" rel="noopener" class="btn btn-pink" style="flex:1; justify-content:center; padding:9px;">
              <i class="fa-solid fa-location-arrow"></i> Navigate
            </a>
          </div>
        </div>
      `).join('');

      // Add Pins to Map
      const bounds = L.latLngBounds();
      list.forEach(m => {
        const pinHtml = `<div class="isot-pin ${m.isStudentDeal ? 'live' : ''}" style="background:${m.isStudentDeal ? '#22C55E' : 'var(--pink)'};"><i class="fa-solid fa-landmark"></i></div>`;
        const customPin = L.divIcon({
          className: 'isot-pin-wrapper',
          html: pinHtml,
          iconSize: [32, 32], iconAnchor: [16, 16]
        });

        const marker = L.marker(m.coords, { icon: customPin }).addTo(map).bindPopup(`<b>${m.name}</b><br>${m.studentRate}`);
        markers.push(marker);
        bounds.extend(m.coords);
      });

      if (list.length > 0) {
        map.fitBounds(bounds, { padding: [30, 30], maxZoom: 15 });
      }
    }

    function filterMuseums(cat, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      let filtered = MUSEUMS;
      if (cat === 'top') filtered = MUSEUMS.filter(m => m.category.includes('top'));
      if (cat === 'student-deal') filtered = MUSEUMS.filter(m => m.isStudentDeal);
      if (cat === 'art-cinema') filtered = MUSEUMS.filter(m => m.isArtCinema);
      if (cat === 'cars') filtered = MUSEUMS.filter(m => m.isCars);

      renderMuseums(filtered);
    }

    document.addEventListener('DOMContentLoaded', initMuseumsPage);
  </script>
</body>
