      display: flex;

      gap: 12px;

    .student-card-top {

      border: 1px solid var(--border-light);
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 4px;

    .student-card-bottom {

      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border-light);

    .btn-connect {
      padding: 6px 14px;
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: var(--radius-full);
      border: 1px solid var(--pink);

  <script src="vendor/supabase.js"></script>
  <script src="js/isot.js"></script>

  <script>
    let allProfiles = [];
    let meProfile = null;
    // Filled by loadFriendships() from the database. Seeding it from localStorage meant
    // a stale local copy could contradict the server, and it never contained incoming
    // requests at all.
    let friendState = {};
    let currentFilter = 'all';

    async function initNetworkPage() {
      meProfile = await requireAuth();
      document.getElementById('headerAvatar').innerHTML = renderUserAvatarHtml(meProfile, 36);

      // Fetch real registered student profiles from Supabase profiles table
      try {
        // member_directory is a view exposing only directory-safe columns. Reading
        // profiles directly here returned every member's email, date_of_birth and
        // qr_secret — the HMAC key that signs their member QR — to any signed-in user.
        const { data, error } = await db.from('member_directory').select('*').neq('id', meProfile.id).order('created_at', { ascending: false });
        if (data) {
          allProfiles = data;
        }
      } catch (e) {
        console.warn('Profiles load note:', e);
      }

      // A friendship is ONE row: user_id asked, friend_id was asked. Reading only
      // .eq('user_id', me) returned outgoing requests only, so an incoming request was
      // invisible to the person who received it. Read both directions, and record which
      // way round it is — 'sent' and 'incoming' need different buttons.
      await loadFriendships();
      await loadInvites();

      renderStudents();
    }

    /** Friendship state comes from the database, never localStorage. Keyed by the other
     *  person's id, with the direction preserved:
     *    'connected' — accepted, either direction
     *    'sent'      — I asked, waiting on them
     *    'incoming'  — they asked, waiting on me
     */
    async function loadFriendships() {
      friendState = {};
      const { data, error } = await db
        .from('friendships')
        .select('user_id, friend_id, status')
        .or(`user_id.eq.${meProfile.id},friend_id.eq.${meProfile.id}`);

      if (error) { console.error('Could not load friendships:', error.message); return; }

      (data || []).forEach(f => {
        const other = f.user_id === meProfile.id ? f.friend_id : f.user_id;
        if (f.status === 'connected') friendState[other] = 'connected';
        else if (f.user_id === meProfile.id) friendState[other] = 'sent';
        else friendState[other] = 'incoming';
      });
    }

    async function sendFriendRequest(studentId) {
      const { error } = await db.from('friendships')
        .insert({ user_id: meProfile.id, friend_id: studentId, status: 'pending' });
      if (error) { alert('Could not send the request: ' + error.message); return; }

      await sendNotification(studentId, 'friend_request', 'New friend request',
        `${meProfile.full_name || 'A member'} sent you a friend request.`);
      await loadFriendships();
      renderStudents();
    }

    async function acceptFriendRequest(studentId) {
      // Update THEIR row. Writing a second row in the opposite direction — which is what
      // the old upsert did — left the original stuck at 'pending' and created a duplicate.
      const { error } = await db.from('friendships')
        .update({ status: 'connected' })
        .eq('user_id', studentId)
        .eq('friend_id', meProfile.id);
      if (error) { alert('Could not accept: ' + error.message); return; }

      await sendNotification(studentId, 'friend_accept', 'Friend request accepted',
        `${meProfile.full_name || 'A member'} accepted your friend request.`);
      await loadFriendships();
      renderStudents();
    }

    /** Decline, cancel, or unfriend — all the same thing: remove the row, whichever
     *  direction it was created in. */
    async function removeFriendship(studentId) {
      const { error } = await db.from('friendships')
        .delete()
        .or(`and(user_id.eq.${meProfile.id},friend_id.eq.${studentId}),` +
            `and(user_id.eq.${studentId},friend_id.eq.${meProfile.id})`);
      if (error) { alert('Could not remove: ' + error.message); return; }
      await loadFriendships();
      renderStudents();
    }

    async function toggleFriendship(studentId, action = null) {
      const current = friendState[studentId];
      if (action === 'accept')            return acceptFriendRequest(studentId);
      if (action === 'decline')           return removeFriendship(studentId);
      if (current === 'connected')        return removeFriendship(studentId);
      if (current === 'sent')             return removeFriendship(studentId);  // cancel
      if (current === 'incoming')         return acceptFriendRequest(studentId);
      return sendFriendRequest(studentId);
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-pill').forEach(btn => btn.classList.remove('active'));
      if (filter === 'all') document.getElementById('fAll').classList.add('active');
      if (filter === 'friends') document.getElementById('fFriends').classList.add('active');
      if (filter === 'requests') document.getElementById('fRequests').classList.add('active');
      if (filter === 'invites') document.getElementById('fInvites').classList.add('active');
      if (filter === 'unitto') document.getElementById('fUniTo').classList.add('active');
      if (filter === 'polito') document.getElementById('fPoliTo').classList.add('active');
      renderStudents();
    }

    function filterStudents() {
      renderStudents();
    }

    function renderStudents() {
      // "Invites" is a different kind of list — events you were invited to, not people —
      // so it takes over the container rather than filtering the student array.
      if (currentFilter === 'invites') { renderInvites(); return; }

      const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
      const connectedCount = Object.values(friendState).filter(s => s === 'connected').length;
      // Only incoming requests need action, so that is what the badge counts.
      const requestsCount = Object.values(friendState).filter(s => s === 'incoming').length;

      document.getElementById('friendsCount').textContent = connectedCount;
      document.getElementById('requestsCount').textContent = requestsCount;

      let list = allProfiles.filter(s => {
        const nameStr = (s.full_name || '').toLowerCase();
        const countryStr = (s.nationality || '').toLowerCase();
        const uniStr = (s.university || '').toLowerCase();
        const langStr = (s.languages || '').toLowerCase();

        if (q) {
          if (!nameStr.includes(q) && !countryStr.includes(q) && !uniStr.includes(q) && !langStr.includes(q)) return false;
        }

        if (currentFilter === 'friends' && friendState[s.id] !== 'connected') return false;
        if (currentFilter === 'requests' && friendState[s.id] !== 'incoming') return false;
        if (currentFilter === 'unitto' && !uniStr.includes('unito')) return false;
        if (currentFilter === 'polito' && !uniStr.includes('polito')) return false;

        return true;
      });

      const container = document.getElementById('studentContainer');
      if (!list.length) {
        container.innerHTML = `
          <div class="card card-glass" style="text-align:center;padding:34px">
            <i class="fa-solid fa-users text-pink" style="font-size:2rem;margin-bottom:10px"></i>
            <h3 style="font-size:1.1rem;color:#FFF;margin-bottom:4px">Nobody to show yet</h3>
            <p class="dim" style="font-size:0.85rem;margin-bottom:14px">No members match that search. Share the app with the people you meet at events and they will appear here.</p>
            <button type="button" class="btn btn-pink" style="width:auto;display:inline-flex;padding:6px 16px;font-size:0.82rem;" onclick="navigator.clipboard.writeText('https://isotcommunity.com'); alert('Community web app link copied!')">
              <i class="fa-solid fa-share-nodes"></i> Share Web App Link
            </button>
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(s => {
        const status = friendState[s.id];
        let btnHtml = '';
        if (status === 'connected') {
          // Inviting used to be possible only from the calendar: you had to already know
          // which night you wanted, then hunt for the person. Doing it from their card is
          // the other half of the same action. Connected friends only — an invite button
          // on every student in the directory is a spam vector.
          btnHtml = `
            <div style="display:flex;gap:6px">
              <button type="button" class="btn-connect" onclick="openEventInvite('${s.id}', '${escapeHtml(s.full_name || 'Member').replace(/'/g, "&#39;")}')"><i class="fa-solid fa-paper-plane"></i> Invite</button>
              <button type="button" class="btn-connect connected" onclick="toggleFriendship('${s.id}')"><i class="fa-solid fa-user-check"></i> Friends</button>
            </div>`;
        } else if (status === 'sent') {
          btnHtml = `<button type="button" class="btn-connect requested" onclick="toggleFriendship('${s.id}')"><i class="fa-solid fa-clock"></i> Sent</button>`;
        } else if (status === 'incoming') {
          // They asked you. Previously there was no state for this at all, so an incoming
          // request rendered as "+ Add Friend" and tapping it tried to create a duplicate.
          btnHtml = `
            <div style="display:flex;gap:6px">
              <button type="button" class="btn-connect" onclick="toggleFriendship('${s.id}', 'accept')"><i class="fa-solid fa-check"></i> Accept</button>
              <button type="button" class="btn-connect" style="background:transparent;border:1px solid var(--border-light);color:var(--text-dim)" onclick="toggleFriendship('${s.id}', 'decline')">Decline</button>
            </div>`;
        } else {
          btnHtml = `<button type="button" class="btn-connect" onclick="toggleFriendship('${s.id}')"><i class="fa-solid fa-user-plus"></i> + Add Friend</button>`;
        }

        const nation = s.nationality || 'Turin Student';
        const uni = s.university || 'Turin Campus';
        const langs = s.languages || 'English, Italian';

        return `
          <div class="student-card">
            <div class="student-card-top">
              <div class="student-avatar" style="width:52px;height:52px;border-radius:50%;overflow:hidden;flex-shrink:0;">
                ${renderUserAvatarHtml(s, 52)}
              </div>
              <div style="flex:1;min-width:0">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px">
                  <h3 style="font-size:1.05rem;color:#FFF;margin:0">${escapeHtml(s.full_name || 'Member')}</h3>
                  <span class="badge ${s.tier === 'socio' ? 'badge-socio' : 'badge-participant'}">${s.tier === 'socio' ? '20% OFF' : 'Member'}</span>
                </div>
                <div class="student-meta-pills">
                  <span class="student-meta-pill"><i class="fa-solid fa-earth-americas text-pink"></i> ${escapeHtml(nation)}</span>
                  <span class="student-meta-pill"><i class="fa-solid fa-graduation-cap text-gold"></i> ${escapeHtml(uni)}</span>
                </div>
              </div>
            </div>

            <div class="student-card-bottom">
              <div class="dim" style="font-size:0.75rem"><i class="fa-solid fa-comments text-green"></i> ${escapeHtml(langs)}</div>
              ${btnHtml}
            </div>
          </div>
        `;
      }).join('');
    }

    /* ── Invites addressed to me ────────────────────────────────────────────
     * my_invites() returns each invite WITH its event resolved — title, venue, time —
     * and whether I have already RSVPed. Without the event_date column added in 012
     * this could only have said "you were invited to Karaoke Night", which is not an
     * answer when it runs every Monday.
     */
    let myInvites = [];

    async function loadInvites() {
      const { data, error } = await db.rpc('my_invites');
      if (error) { console.warn('Could not load invites:', error.message); myInvites = []; return; }
      myInvites = data || [];
      const upcoming = myInvites.filter(i => !i.past).length;
      const badge = document.getElementById('invitesCount');
      if (badge) badge.textContent = upcoming;
    }

    function renderInvites() {
      const container = document.getElementById('studentContainer');
      const live = myInvites.filter(i => !i.past);

      if (!live.length) {
        container.innerHTML = `
          <div class="card card-glass" style="text-align:center;padding:34px">
            <i class="fa-solid fa-envelope-open-text text-pink" style="font-size:2rem;margin-bottom:10px"></i>
            <h3 style="font-size:1.1rem;color:#FFF;margin-bottom:4px">No invites right now</h3>
            <p class="dim" style="font-size:0.85rem">When a friend invites you to a night, it shows up here with the date and venue.</p>
          </div>`;
        return;
      }

      container.innerHTML = live.map((n, i) => {
        // An invite whose event was deleted still exists as a notification. Say so
        // rather than rendering a card with blank fields.
        if (!n.title) {
          return `
            <div class="card card-glass" style="margin-bottom:12px;padding:16px">
              <div style="font-weight:700;color:#FFF;font-size:0.95rem;margin-bottom:4px">Invite to an event that no longer exists</div>
              <p class="dim" style="font-size:0.82rem">${escapeHtml(n.message || '')}</p>
            </div>`;
        }

        const when = new Date(n.event_date + 'T00:00:00').toLocaleDateString([], {
          weekday: 'long', day: 'numeric', month: 'long' });
        const who = n.actor_name || 'A friend';

        return `
          <div class="card card-glass" style="margin-bottom:12px;padding:16px;${n.read ? '' : 'border-left:2px solid var(--pink);'}">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
              ${renderUserAvatarHtml({ full_name: who, avatar_url: n.actor_avatar, member_code: n.actor_id || '' }, 34)}
              <div class="dim" style="font-size:0.8rem"><strong style="color:#FFF">${escapeHtml(who)}</strong> invited you</div>
            </div>

            <h3 style="font-size:1.1rem;color:#FFF;margin:0 0 6px">${escapeHtml(n.title)}</h3>
            <div class="student-meta-pills" style="margin-bottom:12px">
              <span class="student-meta-pill"><i class="fa-solid fa-calendar-day text-pink"></i> ${escapeHtml(when)}</span>
              <span class="student-meta-pill"><i class="fa-solid fa-clock text-gold"></i> ${escapeHtml((n.start_time || '').slice(0,5))}</span>
              <span class="student-meta-pill"><i class="fa-solid fa-location-dot text-green"></i> ${escapeHtml(n.venue_name || '')}</span>
            </div>

            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <button type="button" id="invRsvp_${i}" class="btn ${n.going ? 'btn-outline' : 'btn-pink'}"
                      style="width:auto;padding:6px 14px;font-size:0.8rem"
                      onclick="rsvpFromInvite(${i}, '${n.event_id}', '${n.event_date}')">
                <i class="fa-solid ${n.going ? 'fa-circle-check text-green' : 'fa-calendar-plus'}"></i>
                ${n.going ? "You're going" : "I'm going"}
              </button>
              <a href="events.html" class="btn btn-outline" style="width:auto;padding:6px 14px;font-size:0.8rem;display:inline-flex">
                <i class="fa-solid fa-calendar"></i> Calendar
              </a>
            </div>
          </div>`;
      }).join('');
    }

    async function rsvpFromInvite(idx, eventId, eventDate) {
      const btn = document.getElementById('invRsvp_' + idx);
      if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; }

      const { data, error } = await db.rpc('toggle_rsvp',
        { p_event_id: eventId, p_date: eventDate });

      if (error) {
        if (btn) btn.disabled = false;
        alert('Could not RSVP: ' + error.message);
        renderInvites();
        return;
      }

      const inv = myInvites.find(x => x.event_id === eventId && x.event_date === eventDate);
      if (inv) inv.going = !!(data && data.going);
      renderInvites();
    }

    /* ── Invite a friend to a night, from their card ────────────────────────
     * The calendar is expanded server-side by calendar_between(), so a recurring
     * Monday is a list of real dates rather than a rule the client has to unroll.
     * The date is carried into the message: "Karaoke Night" alone is ambiguous when
     * it happens every week.
     */
    let inviteTargetId = null;

    async function openEventInvite(friendId, friendName) {
      inviteTargetId = friendId;

      let modal = document.getElementById('eventInviteModal');
      if (!modal) {
        modal = document.createElement('div');
        modal.className = 'modal-backdrop';
        modal.id = 'eventInviteModal';
        modal.onclick = () => modal.classList.remove('active');
        modal.innerHTML = `
          <div class="modal-sheet" onclick="event.stopPropagation()">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
              <div>
                <div class="eyebrow"><i class="fa-solid fa-paper-plane text-pink"></i> Event invitation</div>
                <h3 style="font-size:1.15rem;color:#FFF;margin-top:2px" id="eventInviteTitle">Invite</h3>
              </div>
              <button type="button" onclick="document.getElementById('eventInviteModal').classList.remove('active')" style="background:transparent;border:none;color:var(--text-muted);font-size:1.3rem;cursor:pointer"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p class="dim" style="font-size:0.82rem;margin-bottom:14px">Pick a night to invite them to:</p>
            <div id="eventInviteList" style="display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow-y:auto;"></div>
          </div>`;
        document.body.appendChild(modal);
      }

      document.getElementById('eventInviteTitle').textContent = 'Invite ' + friendName;
      const list = document.getElementById('eventInviteList');
      list.innerHTML = '<div class="spinner" style="margin:20px auto"></div>';
      modal.classList.add('active');

      const from = new Date();
      const to   = new Date(Date.now() + 21 * 86400000);
      const iso  = d => d.toISOString().slice(0, 10);

      const { data, error } = await db.rpc('calendar_between',
        { p_from: iso(from), p_to: iso(to) });

      if (error) {
        list.innerHTML = '<p class="dim" style="font-size:0.85rem">Could not load the calendar: '
          + escapeHtml(error.message) + '</p>';
        return;
      }
      if (!data || !data.length) {
        list.innerHTML = '<p class="dim" style="font-size:0.85rem">Nothing scheduled in the next three weeks.</p>';
        return;
      }

      list.innerHTML = data.map((e, i) => {
        const when = new Date(e.event_date + 'T00:00:00').toLocaleDateString([], {
          weekday: 'short', day: 'numeric', month: 'short' });
        return `
          <button type="button" id="invEvt_${i}" class="btn btn-outline"
                  style="width:100%;justify-content:flex-start;text-align:left;padding:10px 12px;font-size:0.84rem"
                  onclick="sendEventInvite(${i}, '${e.event_id}', '${e.event_date}', '${escapeHtml(e.title).replace(/'/g, "&#39;")}', '${escapeHtml(when)}', '${escapeHtml(e.venue_name || '')}')">
            <span style="display:flex;flex-direction:column;gap:2px">
              <span style="color:#FFF;font-weight:600">${escapeHtml(e.title)}</span>
              <span class="dim" style="font-size:0.76rem">${escapeHtml(when)} · ${escapeHtml((e.start_time || '').slice(0,5))} · ${escapeHtml(e.venue_name || '')}</span>
            </span>
          </button>`;
      }).join('');
    }

    async function sendEventInvite(idx, eventId, eventDate, title, when, venue) {
      const btn = document.getElementById('invEvt_' + idx);
      if (btn) { btn.disabled = true; }

      const res = await sendNotification(
        inviteTargetId, 'event_invite', 'Event invitation: ' + title,
        (meProfile.full_name || 'A friend') + ' invited you to ' + title +
        ' on ' + when + (venue ? ' at ' + venue : '') + '.',
        eventId, eventDate);

      if (!res || !res.ok) {
        if (btn) btn.disabled = false;
        alert('Could not send that invite: ' + ((res && res.error) || 'unknown error'));
        return;
      }
      if (btn) {
        btn.className = 'btn btn-outline';
        btn.style.borderColor = 'var(--green)';
        btn.innerHTML = '<span style="color:var(--green)"><i class="fa-solid fa-check"></i> Invite sent</span>';
      }
    }

    document.addEventListener('DOMContentLoaded', initNetworkPage);
  </script>
</body>
</html>
