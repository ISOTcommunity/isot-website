  <style>
    .b-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 22px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .b-card h2 { font-size: 1.05rem; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
    .b-card h2 i { color: var(--pink); font-size: 0.95rem; }
    .b-hint { font-size: 0.78rem; color: var(--text-dim); line-height: 1.45; margin: 0 0 12px; }

    .row {
      display: grid; grid-template-columns: 1fr 108px 78px; gap: 8px; align-items: center;
      padding: 8px 0; border-top: 1px solid var(--border-light);
    }
    .row:first-of-type { border-top: none; }
    .row label { font-size: 0.86rem; color: var(--text-main); line-height: 1.3; }
    .row label small { display: block; font-size: 0.7rem; color: var(--text-dim); margin-top: 2px; }
    .money {
      position: relative;
    }
    .money span { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 0.85rem; pointer-events: none; }
    .money input, .row select, .field select {
      width: 100%; box-sizing: border-box;
      background: var(--bg-darker); color: var(--text-main);
      border: 1px solid var(--border-light); border-radius: 12px;
      padding: 10px 8px 10px 24px; font: inherit; font-size: 0.9rem;
      font-variant-numeric: tabular-nums;
    }
    .row select, .field select { padding-left: 8px; font-size: 0.8rem; }
    .money input:focus, .row select:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

    .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border-light); }
    .toggle .t-text { font-size: 0.86rem; }
    .toggle .t-text small { display: block; font-size: 0.72rem; color: var(--text-dim); margin-top: 2px; }
    .switch { position: relative; width: 48px; height: 28px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch .knob { position: absolute; inset: 0; border-radius: 999px; background: var(--bg-raised); transition: background .2s; cursor: pointer; }
    .switch .knob::after { content: ''; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; }
    .switch input:checked + .knob { background: var(--accent); }
    .switch input:checked + .knob::after { transform: translateX(20px); }
    .switch input:focus-visible + .knob { outline: 2px solid var(--accent); outline-offset: 2px; }

    .field { margin: 6px 0 4px; }
    .field label { display: block; font-size: 0.78rem; color: var(--text-dim); margin-bottom: 6px; }

    .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    .sum-box { background: var(--bg-darker); border-radius: 16px; padding: 12px 10px; text-align: center; }
    .sum-box .v { font-size: 1.15rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .sum-box .l { font-size: 0.66rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 3px; font-weight: 700; }

    .stack { display: flex; height: 16px; border-radius: 999px; overflow: hidden; background: var(--bg-darker); margin: 4px 0 8px; }
    .stack div { height: 100%; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 0.72rem; color: var(--text-muted); margin-bottom: 4px; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }

    .rule { padding: 12px 0; border-top: 1px solid var(--border-light); }
    .rule:first-of-type { border-top: none; }
    .rule-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .rule-name { font-size: 0.9rem; font-weight: 700; }
    .rule-val { font-size: 0.9rem; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .bar { position: relative; height: 10px; border-radius: 999px; background: var(--bg-darker); margin: 8px 0 6px; overflow: hidden; }
    .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; }
    .bar .band { position: absolute; top: 0; bottom: 0; background: rgba(31, 212, 127, 0.22); border-left: 2px solid var(--green); border-right: 2px solid var(--green); }
    .rule-note { font-size: 0.76rem; color: var(--text-dim); line-height: 1.45; }
    .ok { color: var(--green); } .warn { color: var(--gold); } .bad { color: var(--red); }

    .big-num { font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; margin: 4px 0; }
    .tip { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border-light); font-size: 0.82rem; line-height: 1.45; color: var(--text-muted); }
    .tip:first-of-type { border-top: none; }
    .tip i { color: var(--gold); margin-top: 3px; }
    .tip a { color: var(--c-sky-blue); }
    .ai-steps { margin: 0 0 12px; padding-left: 20px; font-size: 0.82rem; color: var(--text-muted); line-height: 1.55; }
    .ai-steps li { margin-bottom: 4px; }
    .ai-box {
      width: 100%; box-sizing: border-box; min-height: 110px; resize: vertical;
      background: var(--bg-darker); color: var(--text-main);
      border: 1px solid var(--border-light); border-radius: 14px;
      padding: 12px; font: 0.8rem/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .ai-box:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .ai-privacy { font-size: 0.74rem; color: var(--text-dim); line-height: 1.5; background: rgba(255, 184, 31, 0.08);
      border: 1px solid rgba(255, 184, 31, 0.25); border-radius: 12px; padding: 10px 12px; margin: 0 0 12px; }
    .ai-msg { font-size: 0.8rem; margin: 8px 0 0; line-height: 1.45; }
    .ai-preview { margin-top: 12px; }
    .ai-preview table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    .ai-preview td { padding: 6px 2px; border-top: 1px solid var(--border-light); }
    .ai-preview td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
    .disclaimer { font-size: 0.72rem; color: var(--text-dim); line-height: 1.5; text-align: center; margin: 4px 8px 20px; }
  
    .lang { display: inline-flex; border: 1px solid var(--border-light); border-radius: 999px; overflow: hidden; flex-shrink: 0; }
    .lang button { background: transparent; border: none; color: var(--text-dim); font: inherit; font-size: 0.72rem; font-weight: 700; padding: 5px 11px; cursor: pointer; letter-spacing: 0.06em; }
    .lang button.on { background: var(--selected-bg); color: var(--on-selected); }
    .goal { background: var(--bg-darker); border-radius: 16px; padding: 12px; margin-bottom: 10px; }
    .goal-head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .goal-name { flex: 1; min-width: 0; background: transparent; border: none; border-bottom: 1px solid var(--border-light); color: var(--text-main); font: inherit; font-size: 0.95rem; font-weight: 700; padding: 4px 2px; }
    .goal-name:focus { outline: none; border-bottom-color: var(--accent); }
    .goal-x { background: transparent; border: none; color: var(--text-dim); font-size: 1rem; cursor: pointer; padding: 6px; }
    .goal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: end; }
    .goal-grid label:last-child { grid-column: 1 / -1; }
    .goal-grid label { font-size: 0.7rem; color: var(--text-dim); display: flex; flex-direction: column; gap: 4px; }
    .goal-grid .money input { padding: 9px 6px 9px 22px; font-size: 0.85rem; }
    .goal-date { width: 100%; box-sizing: border-box; background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-light); border-radius: 12px; padding: 8px 6px; font: inherit; font-size: 0.8rem; color-scheme: dark; }
    .goal .money input { background: var(--bg-card); }
  </style>
</head>
<body class="tone-violet">

  <div id="gate"><div class="spinner"></div></div>

  <header class="topbar">
    <a href="home.html" class="topbar-title" style="display:flex;align-items:center;gap:8px">
      <i class="fa-solid fa-wallet text-pink"></i>
      <span>Budget</span>
    </a>
    <div style="display:flex;align-items:center;gap:12px">
      <div id="headerAvatar" style="cursor:pointer" data-open-drawer></div>
      <button type="button" id="burgerBtn" aria-label="Account menu" style="background:transparent;border:none;color:#FFF;font-size:1.3rem;cursor:pointer;padding:6px">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
  </header>

  <main class="shell" style="padding-top:18px;padding-bottom:96px">

    <div style="margin-bottom: 16px;">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
        <div class="eyebrow" data-i18n="eyebrow"></div>
        <div class="lang" role="group" aria-label="Language">
          <button type="button" data-lang="en">EN</button><button type="button" data-lang="it">IT</button>
        </div>
      </div>
      <h1 style="font-size: 1.75rem; margin-top: 4px;" data-i18n="title"></h1>
      <p style="color: var(--text-dim); font-size: 0.88rem; margin-top: 4px;" data-i18n="intro"></p>
    </div>

    <!-- Fill with AI -->
    <section class="b-card">
      <h2><i class="fa-solid fa-wand-magic-sparkles"></i> <span data-i18n="ai_title"></span></h2>
      <p class="b-hint" data-i18n="ai_hint"></p>
      <ol class="ai-steps">
        <li data-i18n-html="ai_s1"></li>
        <li data-i18n-html="ai_s2"></li>
        <li data-i18n-html="ai_s3"></li>
      </ol>
      <p class="ai-privacy"><i class="fa-solid fa-shield-halved"></i> <span data-i18n="ai_privacy"></span></p>
      <button type="button" class="btn btn-pink" id="aiCopy" style="width:100%;justify-content:center;margin-bottom:12px"><i class="fa-solid fa-copy"></i> <span data-i18n="ai_copy"></span></button>
      <textarea class="ai-box" id="aiPaste" data-i18n-ph="ai_paste_ph" data-i18n-aria="ai_paste_ph"></textarea>
      <button type="button" class="btn btn-secondary" id="aiRead" style="width:100%;justify-content:center;margin-top:10px" data-i18n="ai_read"></button>
      <div class="ai-msg" id="aiMsg" role="status"></div>
      <div class="ai-preview" id="aiPreview" hidden></div>
    </section>

    <!-- Money in -->
    <section class="b-card">
      <h2><i class="fa-solid fa-arrow-down"></i> <span data-i18n="in_title"></span></h2>
      <p class="b-hint" data-i18n="in_hint"></p>
      <div id="incomeRows"></div>

      <div id="taxBox" hidden>
        <div class="row">
          <label for="taxPct"><span data-i18n="tax_label"></span><small data-i18n="tax_sub"></small></label>
          <div class="money"><span>%</span><input type="number" inputmode="decimal" min="0" max="80" id="taxPct" placeholder="?"></div>
          <div></div>
        </div>
      </div>

      <div class="toggle">
        <div class="t-text"><span data-i18n="edisu_toggle"></span><small data-i18n="edisu_toggle_sub"></small></div>
        <label class="switch"><input type="checkbox" id="hasEdisu"><span class="knob"></span></label>
      </div>
      <div id="edisuBox" hidden>
        <div class="row">
          <label for="edisuYear"><span data-i18n="edisu_amt"></span><small data-i18n="edisu_amt_sub"></small></label>
          <div class="money"><span>€</span><input type="number" inputmode="decimal" min="0" id="edisuYear" placeholder="0"></div>
          <div style="font-size:0.75rem;color:var(--text-dim)" data-i18n="per_year"></div>
        </div>
        <div class="row">
          <label for="edisuMonths"><span data-i18n="edisu_months"></span><small data-i18n="edisu_months_sub"></small></label>
          <div class="money"><span>#</span><input type="number" inputmode="numeric" min="1" max="12" id="edisuMonths" placeholder="12"></div>
          <div></div>
        </div>
        <div class="toggle">
          <div class="t-text"><span data-i18n="dorm_toggle"></span><small data-i18n="dorm_toggle_sub"></small></div>
          <label class="switch"><input type="checkbox" id="edisuDorm"><span class="knob"></span></label>
        </div>
        <div class="toggle">
          <div class="t-text"><span data-i18n="meals_toggle"></span><small data-i18n="meals_toggle_sub"></small></div>
          <label class="switch"><input type="checkbox" id="edisuMeals"><span class="knob"></span></label>
        </div>
      </div>
    </section>

    <!-- Money out -->
    <section class="b-card">
      <h2><i class="fa-solid fa-arrow-up"></i> <span data-i18n="out_title"></span></h2>
      <div class="field">
        <label for="housingType" data-i18n="housing_q"></label>
        <select id="housingType">
          <option value="shared" data-i18n="h_shared"></option>
          <option value="edisu" data-i18n="h_edisu"></option>
          <option value="studio" data-i18n="h_studio"></option>
          <option value="family" data-i18n="h_family"></option>
        </select>
      </div>
      <p class="b-hint" style="margin-top:10px" data-i18n="out_hint"></p>
      <div id="costRows"></div>
    </section>

    <!-- Results -->
    <section class="b-card" id="monthCard" aria-live="polite">
      <h2><i class="fa-solid fa-chart-simple"></i> <span data-i18n="res_title"></span></h2>
      <div class="summary">
        <div class="sum-box"><div class="v" id="sIn">€0</div><div class="l" data-i18n="s_in"></div></div>
        <div class="sum-box"><div class="v" id="sOut">€0</div><div class="l" data-i18n="s_out"></div></div>
        <div class="sum-box"><div class="v" id="sLeft">€0</div><div class="l" data-i18n="s_left"></div></div>
      </div>
      <p class="rule-note" id="taxLine" hidden style="margin:-4px 0 10px"></p>
      <div class="stack" id="stack"></div>
      <div class="legend" id="legend"></div>
    </section>

    <section class="b-card">
      <h2><i class="fa-solid fa-list-check"></i> <span data-i18n="rules_title"></span></h2>
      <p class="b-hint" data-i18n="rules_hint"></p>
      <div id="rules"></div>
    </section>

    <section class="b-card">
      <h2><i class="fa-solid fa-bullseye"></i> <span data-i18n="goals_title"></span></h2>
      <p class="b-hint" data-i18n="goals_hint"></p>
      <div id="goals"></div>
      <button type="button" class="btn btn-secondary" id="addGoal" style="width:100%;justify-content:center;margin-top:6px"><i class="fa-solid fa-plus"></i> <span data-i18n="goal_add"></span></button>
      <p class="rule-note" id="goalsSummary" style="margin-top:10px"></p>
    </section>

    <section class="b-card">
      <h2><i class="fa-solid fa-life-ring"></i> <span data-i18n="ef_title"></span></h2>
      <p class="b-hint" data-i18n="ef_hint"></p>
      <div class="big-num" id="efRange">€0</div>
      <div class="row" style="grid-template-columns:1fr 108px">
        <label for="efSaved"><span data-i18n="ef_saved"></span><small data-i18n="ef_saved_sub"></small></label>
        <div class="money"><span>€</span><input type="number" inputmode="decimal" min="0" id="efSaved" placeholder="0"></div>
      </div>
      <div class="bar"><div class="fill" id="efFill" style="background:var(--green)"></div></div>
      <div class="rule-note" id="efNote"></div>
    </section>

    <section class="b-card">
      <h2><i class="fa-solid fa-flag-checkered"></i> <span data-i18n="free_title"></span></h2>
      <p class="b-hint" data-i18n-html="free_hint"></p>
      <div class="big-num" id="freedom">€0</div>
      <div class="rule-note" id="freedomNote"></div>
    </section>

    <section class="b-card">
      <h2><i class="fa-solid fa-lightbulb"></i> <span data-i18n="tips_title"></span></h2>
      <div id="tips"></div>
    </section>

    <div style="display:flex;gap:10px;margin-bottom:14px">
      <button type="button" class="btn btn-secondary" id="resetBtn" style="flex:1;justify-content:center" data-i18n="reset"></button>
    </div>
    <p class="disclaimer" data-i18n="disclaimer"></p>
  </main>
