<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>ISOT Karaoke Queue</title>

  <link rel="icon" href="../assets/LOGOS/scritta isot.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="css/app.css" />

  <style>
    .position-hero-badge {
      background: linear-gradient(135deg, rgba(238, 9, 121, 0.2), rgba(255, 106, 0, 0.2));
      border: 1px solid var(--border-glow);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
    }
    .queue-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      margin-bottom: 10px;
    }
    .queue-row.my-row {
      border-color: var(--pink);
      background: rgba(238, 9, 121, 0.1);
    }
  </style>
</head>
<body>

  <div id="gate"><div class="spinner"></div></div>

  <!-- Top Bar -->
  <header class="topbar">
    <a href="home.html" class="topbar-title" style="display: flex; align-items: center; gap: 8px;">
      <i class="fa-solid fa-microphone text-pink"></i>
      <span>Monday Karaoke @ Rough</span>
    </a>
    <div id="headerAvatar"></div>
  </header>

  <main class="shell">

    <!-- Relative Queue Position Banner -->
    <div class="position-hero-badge">
      <div class="eyebrow"><i class="fa-solid fa-music"></i> Live Queue Status</div>
      <h1 style="font-size: 2.2rem; color: #FFF; margin-top: 4px;" id="posText">3 songs away</h1>
      <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 4px;" id="mySongSub">Your song: "Dancing Queen — ABBA"</p>
    </div>

    <div id="alertBox"></div>

    <!-- Song Request Form -->
    <div class="card card-glass" style="margin-bottom: 24px;">
      <h3 style="margin-bottom: 14px;"><i class="fa-solid fa-plus text-pink" style="margin-right: 6px;"></i> Request a Song</h3>
      
      <form id="songForm" onsubmit="submitSong(event)">
        <div class="field">
          <label>Song Title & Artist</label>
          <input type="text" id="songInput" required placeholder="e.g. Bohemian Rhapsody — Queen" />
        </div>
        <button type="submit" class="btn btn-pink" id="addBtn"><i class="fa-solid fa-paper-plane"></i> Add to Queue</button>
      </form>
    </div>

    <!-- Live Queue Stream -->
    <div class="card card-glass">
      <h3 style="margin-bottom: 14px;"><i class="fa-solid fa-list-ol text-gold" style="margin-right: 6px;"></i> Tonight's Song Lineup</h3>
      <div id="queueList">
        <div class="queue-row my-row">
          <div>
            <div style="font-weight: 700; color: #FFF;">Dancing Queen</div>
            <div class="dim">Requested by You • ABBA</div>
          </div>
          <span class="badge badge-socio">UP NEXT</span>
        </div>

        <div class="queue-row">
          <div>
            <div style="font-weight: 700; color: #FFF;">Wonderwall</div>
            <div class="dim">Alex • Oasis</div>
          </div>
          <span class="dim">#2</span>
        </div>

        <div class="queue-row">
          <div>
            <div style="font-weight: 700; color: #FFF;">Volare</div>
            <div class="dim">Marco • Domenico Modugno</div>
          </div>
          <span class="dim">#3</span>
        </div>
      </div>
    </div>

  </main>

  <!-- Mobile Bottom Tab Bar -->
  <nav class="tabbar">
    <a href="home.html" class="tab-item">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 011-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      Home
    </a>
    <a href="profile.html" class="tab-item">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 9h.01M9 9h.01M12 12h.01M12 15h.01M3 20.4V3.6A1.6 1.6 0 014.6 2h14.8A1.6 1.6 0 0121 3.6v16.8M3 20.4h18"/></svg>
      Card
    </a>
    <a href="karaoke.html" class="tab-item active">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 .895-2 3-2 3 .895 3 2zm12 0c0 1.105-1.343 2-3 2s-3-.895-3-2 .895-2 3-2 3 .895 3 2zM9 10l12-3"/></svg>
      Karaoke
    </a>
  </nav>

  <script src="vendor/supabase.js"></script>
  <script src="js/isot.js"></script>

  <script>
    let currentUser = null;

    async function initKaraoke() {
      currentUser = await requireAuth();
      document.getElementById('headerAvatar').innerHTML = renderGeoAvatar(currentUser.member_code, 36);
    }

    function submitSong(e) {
      e.preventDefault();
      const val = document.getElementById('songInput').value.trim();
      if (!val) return;

      // Duplicate warning check
      if (val.toLowerCase().includes('wonderwall') || val.toLowerCase().includes('volare')) {
        setAlert(document.getElementById('alertBox'), 'Note: This song was already requested tonight! We added it anyway 🎶', 'info');
      } else {
        setAlert(document.getElementById('alertBox'), 'Song added to line-up!', 'success');
      }

      document.getElementById('mySongSub').textContent = `Your song: "${val}"`;
      document.getElementById('songInput').value = '';
    }

    document.addEventListener('DOMContentLoaded', initKaraoke);
  </script>
</body>
</html>
