<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ISOT Karaoke Queue</title>

  <link rel="icon" href="../assets/LOGOS/scritta isot.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="css/app.css" />

  <style>
    .position-hero-badge {
      background: linear-gradient(135deg, rgba(238, 9, 121, 0.2), rgba(255, 106, 0, 0.2));
      border: 1px solid var(--border-glow);
      border-radius: 20px;
      padding: 22px;
      text-align: center;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }
    .position-hero-badge.on-mic {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.25), rgba(238, 9, 121, 0.25));
      border-color: #10B981;
      animation: pulseBorder 2s infinite;
    }
    @keyframes pulseBorder {
      0%, 100% { box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }
      50% { box-shadow: 0 0 30px rgba(16, 185, 129, 0.6); }
    }

    .queue-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      margin-bottom: 10px;
      transition: var(--transition-fast);
    }
    .queue-row.playing {
      border-color: #10B981;
      background: rgba(16, 185, 129, 0.12);
    }
    .queue-row.my-row {
      border-color: var(--pink);
      background: rgba(238, 9, 121, 0.12);
    }
  </style>
</head>
<body>

  <div id="gate"><div class="spinner"></div></div>

  <!-- Top Bar -->
  <header class="topbar">
    <a href="home.html" class="topbar-title" style="display: flex; align-items: center; gap: 8px;">
      <i class="fa-solid fa-microphone text-pink"></i>
      <span>Monday Karaoke @ Rough</span>
    </a>
    <div style="display: flex; align-items: center; gap: 10px;">
      <div id="headerAvatar" style="cursor: pointer;" data-open-drawer></div>
      <button type="button" id="burgerBtn" aria-label="Account menu" style="background: transparent; border: none; color: #FFF; font-size: 1.3rem; cursor: pointer; padding: 6px;">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
  </header>

  <main class="shell">

    <!-- Live Queue Status Hero Banner -->
    <div class="position-hero-badge" id="heroBadge">
      <div class="eyebrow"><i class="fa-solid fa-music"></i> Live Stage Status</div>
      <h1 style="font-size: 2.1rem; color: #FFF; margin-top: 4px;" id="posText">Queue Open</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px;" id="mySongSub">Put your song in the queue below!</p>
    </div>

    <div id="alertBox"></div>

    <!-- Song Request Form -->
    <div class="card card-glass" style="margin-bottom: 24px;" id="requestCard">
      <h3 style="margin-bottom: 14px;"><i class="fa-solid fa-plus text-pink" style="margin-right: 6px;"></i> Request a Song</h3>
      
      <form id="songForm" onsubmit="submitSong(event)">
        <div class="field">
          <label for="songTitle">Song Title &amp; Artist</label>
          <input type="text" id="songTitle" required placeholder="e.g. Bohemian Rhapsody — Queen" />
        </div>
        <button type="submit" class="btn btn-pink" id="addBtn"><i class="fa-solid fa-paper-plane"></i> Add to Karaoke Queue</button>
      </form>
    </div>

    <!-- My Pending Song Management Card (Hidden when no song active) -->
    <div class="card card-glass" id="myActiveCard" style="display: none; margin-bottom: 24px; border-color: var(--pink);">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
        <span class="badge badge-socio"><i class="fa-solid fa-user"></i> YOUR QUEUED SONG</span>
        <button type="button" class="btn btn-ghost" onclick="cancelMySong()" style="color: #FCA5A5; padding: 4px 8px; font-size: 0.8rem;">
          <i class="fa-solid fa-trash"></i> Cancel Song
        </button>
      </div>
      <h2 style="font-size: 1.2rem; color: #FFF; margin-bottom: 4px;" id="myActiveTitle">Bohemian Rhapsody</h2>
      <p class="dim" style="font-size: 0.85rem;" id="myActiveSinger">Singer: Member</p>
    </div>

    <!-- Live Queue Lineup -->
    <div class="card card-glass">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;">
        <h3 style="margin: 0;"><i class="fa-solid fa-list-ol text-gold" style="margin-right: 6px;"></i> Tonight's Stage Lineup</h3>
        <span class="dim" style="font-size: 0.78rem;" id="queueCount">0 in queue</span>
      </div>

      <div id="queueList">
        <div class="dim" style="text-align: center; padding: 20px;">Loading live queue...</div>
      </div>
    </div>

  </main>

  <!-- Mobile Bottom Tab Bar -->
  <nav class="tabbar">
    <a href="home.html" class="tab-item">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 011-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      Home
    </a>
    <a href="profile.html" class="tab-item">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 9h.01M9 9h.01M12 12h.01M12 15h.01M3 20.4V3.6A1.6 1.6 0 014.6 2h14.8A1.6 1.6 0 0121 3.6v16.8M3 20.4h18"/></svg>
      Card
    </a>
    <a href="events.html" class="tab-item">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      Calendar
    </a>
  </nav>

  <script src="vendor/supabase.js"></script>
  <script src="js/isot.js"></script>

  <script>
    let me = null;
    let myActiveSlot = null;
    let pollInterval = null;

    // Fallback in-memory queue if DB RLS or table has no active event
    let localQueue = [
      { id: '101', song_title: 'Dancing Queen', singer_name: 'Maria', status: 'playing', profile_id: 'sample-1' },
      { id: '102', song_title: 'Wonderwall', singer_name: 'Alex', status: 'pending', profile_id: 'sample-2' },
      { id: '103', song_title: 'Volare', singer_name: 'Marco', status: 'pending', profile_id: 'sample-3' }
    ];

    async function initKaraoke() {
      me = await requireAuth();
      document.getElementById('headerAvatar').innerHTML = renderGeoAvatar(me.member_code, 36);

      loadQueue();
      pollInterval = setInterval(loadQueue, 3000);
    }

    async function loadQueue() {
      let slots = [];
      try {
        const { data, error } = await db
          .from('karaoke_slots')
          .select('*')
          .in('status', ['playing', 'pending'])
          .order('created_at', { ascending: true });

        if (!error && data && data.length) {
          slots = data;
        } else {
          slots = localQueue;
        }
      } catch (e) {
        slots = localQueue;
      }

      renderQueueUI(slots);
    }

    function renderQueueUI(slots) {
      const playingSlot = slots.find(s => s.status === 'playing');
      const pendingSlots = slots.filter(s => s.status === 'pending');
      
      // Find current user's slot
      myActiveSlot = slots.find(s => s.profile_id === me.id);

      // Render Hero Status
      const heroBadge = document.getElementById('heroBadge');
      const posText = document.getElementById('posText');
      const mySongSub = document.getElementById('mySongSub');

      if (playingSlot && playingSlot.profile_id === me.id) {
        heroBadge.className = 'position-hero-badge on-mic';
        posText.textContent = "YOU ARE ON MIC! 🎤";
        mySongSub.textContent = `Singing: "${playingSlot.song_title}"`;
      } else if (myActiveSlot && myActiveSlot.status === 'pending') {
        heroBadge.className = 'position-hero-badge';
        const index = pendingSlots.findIndex(s => s.id === myActiveSlot.id);
        const position = index >= 0 ? index + 1 : 1;
        posText.textContent = position === 1 ? "YOU ARE UP NEXT! 🌟" : `${position} songs away`;
        mySongSub.textContent = `Your queued song: "${myActiveSlot.song_title}"`;
      } else if (playingSlot) {
        heroBadge.className = 'position-hero-badge';
        posText.textContent = `Now Playing: ${playingSlot.song_title}`;
        mySongSub.textContent = `On Mic: ${playingSlot.singer_name || 'Member'}`;
      } else {
        heroBadge.className = 'position-hero-badge';
        posText.textContent = "Queue Open";
        mySongSub.textContent = "Put your song in the queue below!";
      }

      // My Active Song Card
      const myActiveCard = document.getElementById('myActiveCard');
      if (myActiveSlot) {
        myActiveCard.style.display = 'block';
        document.getElementById('myActiveTitle').textContent = myActiveSlot.song_title;
        document.getElementById('myActiveSinger').textContent = `Singer: ${myActiveSlot.singer_name || me.full_name}`;
      } else {
        myActiveCard.style.display = 'none';
      }

      // Render Lineup
      document.getElementById('queueCount').textContent = `${slots.length} in queue`;
      const queueList = document.getElementById('queueList');

      if (!slots.length) {
        queueList.innerHTML = '<div class="dim" style="text-align:center;padding:20px">No songs in queue yet. Be the first to sing!</div>';
        return;
      }

      queueList.innerHTML = slots.map((s, idx) => {
        const isMine = s.profile_id === me.id;
        const isPlaying = s.status === 'playing';
        let badgeHtml = '';

        if (isPlaying) {
          badgeHtml = '<span class="badge badge-live"><i class="fa-solid fa-microphone"></i> ON MIC</span>';
        } else if (isMine) {
          badgeHtml = `<span class="badge badge-socio">YOUR TURN (#${idx})</span>`;
        } else {
          badgeHtml = `<span class="dim">#${idx}</span>`;
        }

        return `
          <div class="queue-row ${isPlaying ? 'playing' : ''} ${isMine ? 'my-row' : ''}">
            <div>
              <div style="font-weight:700;color:#FFF;">${escapeHtml(s.song_title)}</div>
              <div class="dim">${escapeHtml(s.singer_name || 'Member')} ${isMine ? '• You' : ''}</div>
            </div>
            ${badgeHtml}
          </div>
        `;
      }).join('');
    }

    async function submitSong(e) {
      e.preventDefault();
      const alertEl = document.getElementById('alertBox');
      setAlert(alertEl, '');

      if (myActiveSlot) {
        setAlert(alertEl, 'You already have an active song in the queue! Wait for your turn or cancel your existing song.', 'info');
        return;
      }

      const songVal = document.getElementById('songTitle').value.trim();
      if (!songVal) return;

      const btn = document.getElementById('addBtn');
      const restore = busy(btn, 'Submitting…');

      const newSlot = {
        id: 'slot-' + Date.now(),
        profile_id: me.id,
        singer_name: me.full_name || 'Member',
        song_title: songVal,
        status: 'pending',
        created_at: new Date().toISOString()
      };

      try {
        const { data, error } = await db.from('karaoke_slots').insert([
          {
            profile_id: me.id,
            singer_name: me.full_name || 'Member',
            song_title: songVal,
            status: 'pending'
          }
        ]).select('*').single();

        if (!error && data) {
          localQueue.push(data);
        } else {
          localQueue.push(newSlot);
        }
      } catch (err) {
        localQueue.push(newSlot);
      }

      restore();
      document.getElementById('songTitle').value = '';
      setAlert(alertEl, 'Song added to line-up! Watch your turn on stage.', 'success');
      loadQueue();
    }

    async function cancelMySong() {
      if (!myActiveSlot) return;
      
      try {
        await db.from('karaoke_slots').update({ status: 'skipped' }).eq('id', myActiveSlot.id);
      } catch (e) {}

      localQueue = localQueue.filter(s => s.id !== myActiveSlot.id);
      myActiveSlot = null;
      loadQueue();
      setAlert(document.getElementById('alertBox'), 'Your song was removed from the queue.', 'info');
    }

    document.addEventListener('DOMContentLoaded', initKaraoke);
  </script>
</body>
</html>
