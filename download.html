<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <title>Get the ISOT App</title>
  <meta name="description" content="Scan to get the ISOT app — karaoke queue, member card and events for international students in Turin." />

  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #F6F7F9;
      --dim: #B9BFCB;
      --orchid: #D45AE8;
      --amber: #E69321;
      --line: rgba(255,255,255,0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #000;
      color: var(--ink);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4vmin;
      -webkit-font-smoothing: antialiased;
    }

    /* Landscape on a laptop or a TV at the bar; stacks on a phone held portrait. */
    .stage {
      display: grid;
      grid-template-columns: minmax(0, 0.85fr) minmax(0, 1fr);
      gap: 5vmin;
      align-items: center;
      width: 100%;
      max-width: 1280px;
    }
    @media (max-aspect-ratio: 1/1) {
      .stage { grid-template-columns: 1fr; gap: 4vmin; }
      .poster { max-height: 42vh; }
    }

    .poster {
      width: 100%;
      height: auto;
      border-radius: 18px 18px 46px 18px;   /* the ISOT arc corner */
      display: block;
      border: 1px solid var(--line);
    }

    .panel { text-align: center; }

    .kicker {
      font-size: clamp(0.7rem, 1.6vmin, 0.95rem);
      text-transform: uppercase;
      letter-spacing: 0.22em;
      color: var(--amber);
      font-weight: 700;
      margin-bottom: 1.6vmin;
    }
    h1 {
      font-size: clamp(1.7rem, 5.2vmin, 3.4rem);
      line-height: 1.05;
      font-weight: 800;
      margin-bottom: 2.4vmin;
      text-wrap: balance;
    }
    h1 em { font-style: normal; color: var(--orchid); }

    /* The QR is the point of the screen, so it gets the space. White quiet zone is
       required — scanners need the margin, not just the code. */
    #qr {
      background: #FFF;
      padding: 2.2vmin;
      border-radius: 14px;
      display: inline-block;
      line-height: 0;
    }
    #qr img, #qr canvas { display: block; width: 100%; height: auto; }
    .qr-wrap { width: min(46vmin, 340px); margin: 0 auto; }

    .url {
      margin-top: 2.2vmin;
      font-size: clamp(0.95rem, 2.2vmin, 1.35rem);
      font-weight: 700;
      letter-spacing: 0.01em;
    }
    .what {
      margin-top: 2.4vmin;
      display: flex;
      gap: 1.4vmin 3vmin;
      justify-content: center;
      flex-wrap: wrap;
      color: var(--dim);
      font-size: clamp(0.8rem, 1.9vmin, 1.05rem);
    }
    .what span { display: inline-flex; align-items: center; gap: 0.7vmin; }
    /* Half-disc bullet — the identity's smallest piece. */
    .what span::before {
      content: '';
      width: 0.9em; height: 0.45em;
      background: var(--orchid);
      border-radius: 0.9em 0.9em 0 0;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="stage">
    <img class="poster"
         src="/assets/optimized/karaoke_night_app_2026-08-31.jpg"
         alt="ISOT Karaoke Night poster — 31 August, Rough Dive Bar. You need the app for karaoke." />

    <div class="panel">
      <div class="kicker">Rough Dive Bar</div>
      <h1>Scan to get the <em>ISOT app</em></h1>

      <div class="qr-wrap"><div id="qr"></div></div>

      <div class="url">isotcommunity.com/app</div>

      <div class="what">
        <span>Karaoke queue</span>
        <span>Member card</span>
        <span>Events</span>
      </div>
    </div>
  </div>

  <script src="/app/vendor/qrcode.min.js"></script>
  <script>
    // Rendered here rather than reusing the poster's own QR: on a laptop screen the
    // embedded one is only a few hundred pixels and fails from across a bar. This one
    // scales to the display. Level H so it still reads at an angle, in low light, with
    // a hand in the way.
    new QRCode(document.getElementById('qr'), {
      text: 'https://isotcommunity.com/app',
      width: 640,
      height: 640,
      colorDark: '#000000',
      colorLight: '#FFFFFF',
      correctLevel: QRCode.CorrectLevel.H
    });
  </script>
</body>
</html>
