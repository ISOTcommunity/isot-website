<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article Reader | ISOT Turin Student Guide</title>
  <meta name="description" content="Read full guides and articles for international students in Turin on ISOT Community." />
  <link rel="icon" href="assets/LOGOS/scritta isot.png" type="image/png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root {
      --bg-dark: #0F172A;
      --bg-card: #1E293B;
      --bg-darker: #0B1120;
      --pink: #EE0979;
      --pink-glow: rgba(238, 9, 121, 0.35);
      --navy: #243673;
      --orange: #FF6A00;
      --text-main: #F8FAFC;
      --text-muted: #CBD5E1;
      --text-dim: #94A3B8;
      --border-light: rgba(255, 255, 255, 0.12);
      --font-display: 'Amatic SC', cursive, sans-serif;
      --font-body: 'Outfit', sans-serif;
      --radius-md: 20px;
      --radius-lg: 32px;
      --radius-full: 9999px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body { background-color: var(--bg-dark); color: var(--text-main); font-family: var(--font-body); line-height: 1.8; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #243673; border-radius: 9999px; }

    a { color: var(--pink); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .container { width: 100%; max-width: 900px; margin: 0 auto; padding: 0 24px; }

    .header {
      position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-light);
    }
    .nav-box { display: flex; align-items: center; justify-content: space-between; height: 80px; }
    .nav-logo img { height: 48px; width: auto; }

    .post-header { padding-top: 130px; padding-bottom: 30px; }
    .post-category-tag {
      display: inline-block; font-size: 0.8rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1.5px; color: var(--pink); margin-bottom: 16px;
      background: rgba(238, 9, 121, 0.12); padding: 6px 16px; border-radius: var(--radius-full);
      border: 1px solid rgba(238, 9, 121, 0.3);
    }
    .post-main-title { font-size: 2.5rem; font-weight: 800; color: #FFF; line-height: 1.25; margin-bottom: 20px; }
    .post-author-bar { display: flex; align-items: center; gap: 16px; font-size: 0.95rem; color: var(--text-dim); }

    /* Featured Hero Image Banner */
    .post-hero-image-box {
      width: 100%; height: 400px; border-radius: var(--radius-lg); overflow: hidden;
      margin: 24px 0 40px; border: 1px solid var(--border-light);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5); position: relative; background: var(--bg-card);
    }
    .post-hero-image-box img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }

    /* Content Body Strict Contrast Overrides */
    .post-content-body { padding-bottom: 60px; font-size: 1.15rem; color: var(--text-muted); line-height: 1.8; }
    
    /* OVERRIDE ALL INLINE STYLES FROM WORDPRESS / ELEMENTOR */
    .post-content-body,
    .post-content-body *,
    .post-content-body div,
    .post-content-body span,
    .post-content-body p,
    .post-content-body li,
    .post-content-body td,
    .post-content-body th {
      color: #CBD5E1 !important;
      background-color: transparent !important;
    }

    .post-content-body h1,
    .post-content-body h2,
    .post-content-body h3,
    .post-content-body h4,
    .post-content-body h5,
    .post-content-body h6,
    .post-content-body strong,
    .post-content-body b {
      color: #FFFFFF !important;
      font-weight: 700 !important;
    }

    .post-content-body h2 { font-size: 1.8rem; margin: 40px 0 18px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 10px; }
    .post-content-body h3 { font-size: 1.4rem; margin: 30px 0 14px; }
    .post-content-body p { margin-bottom: 22px; }
    
    .post-content-body a,
    .post-content-body a * {
      color: #EE0979 !important;
      font-weight: 600 !important;
      text-decoration: underline !important;
    }
    .post-content-body a:hover { color: #FF6A00 !important; }

    .post-content-body ul, .post-content-body ol { margin-bottom: 24px; padding-left: 28px; }
    .post-content-body li { margin-bottom: 10px; }
    
    .post-content-body blockquote {
      border-left: 4px solid var(--pink); padding: 20px 24px; margin: 32px 0;
      font-style: italic; color: #FFF !important; background: rgba(238,9,121,0.08) !important;
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
    }

    .post-content-body img {
      max-width: 100% !important; height: auto !important; border-radius: var(--radius-md) !important;
      margin: 32px 0 !important; display: block !important; border: 1px solid var(--border-light) !important;
      box-shadow: 0 12px 30px rgba(0,0,0,0.4) !important;
    }

    .post-content-body code {
      background: rgba(255,255,255,0.1) !important; padding: 3px 8px; border-radius: 6px;
      font-family: monospace; color: #FF6A00 !important; font-size: 0.95em;
    }

    .back-btn {
      display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: #FFF;
      background: rgba(255,255,255,0.05); padding: 10px 22px; border-radius: var(--radius-full);
      border: 1px solid var(--border-light); margin-bottom: 20px; transition: all 0.2s ease;
    }
    .back-btn:hover { background: var(--pink); text-decoration: none; border-color: var(--pink); }

    .footer { background: #070B14; border-top: 1px solid var(--border-light); padding: 60px 0 30px; text-align: center; }
  </style>
</head>
<body>

  <!-- Sticky Header -->
  <header class="header">
    <div class="container nav-box">
      <a href="index.html" class="nav-logo">
        <img src="assets/LOGOS/scritta isot.png" alt="ISOT Logo" />
      </a>
      <a href="blog.html" class="back-btn" style="margin-bottom:0;">← Back to Guides</a>
    </div>
  </header>

  <!-- Article Container -->
  <article class="container">
    <div class="post-header">
      <a href="blog.html" class="back-btn">← Back to All Guides</a>
      <br />
      <span class="post-category-tag" id="articleCat"><i class="fa-solid fa-book-open"></i> Student Guide</span>
      <h1 class="post-main-title" id="articleTitle">Loading Guide Title...</h1>
      <div class="post-author-bar">
        <span><i class="fa-solid fa-user-pen"></i> ISOT Editorial Team</span>
        <span>•</span>
        <span id="articleDate"><i class="fa-regular fa-calendar"></i> Published in Turin</span>
      </div>
    </div>

    <!-- Featured Hero Banner Image -->
    <div class="post-hero-image-box" id="heroImageBox">
      <img id="articleHeroImg" src="assets/optimized/social_group_1.jpg" alt="ISOT Student Guide Turin" />
    </div>

    <div class="post-content-body" id="articleBody">
      <p>Loading full article content...</p>
    </div>
  </article>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p style="color: var(--text-dim); font-size: 0.9rem; margin-bottom: 12px;">© 2026 ISOT Community (Associazione di Promozione Sociale) • Turin, Italy</p>
      <a href="blog.html" style="color: var(--pink); font-size: 0.9rem;">Return to All Guides & Articles →</a>
    </div>
  </footer>

  <script>
    // Hero image mapping by slug
    const HERO_IMAGES = {
      'codice-fiscale-turin-guide': 'assets/optimized/social_group_1.jpg',
      'permesso-di-soggiorno-turin-guide': 'assets/optimized/social_group_3.jpg',
      'healthcare-tessera-sanitaria-turin': 'assets/optimized/social_hub_1.jpg',
      'turin-public-transport-gtt-student-pass': 'assets/optimized/social_group_4.jpg',
      'universities-and-colleges-in-turin-for-international-students': 'assets/optimized/career_workshop_1.jpg',
      'a-complete-guide-to-living-in-turin-for-international-students': 'assets/optimized/social_group_2.jpg',
      'isot-brazilian-karaoke-night-at-rough-bar-san-salvario': 'assets/optimized/karaoke_night_1.jpg',
      'happy-nowruz-iranian-new-year-isot-community': 'assets/optimized/cultural_event_1.jpg',
      'studenthousinginturin': 'assets/optimized/social_hub_3.jpg',
      'italianacademicexamsystem': 'assets/optimized/career_workshops_02.jpg',
      'turin-student-canteens': 'assets/optimized/social_group_6.jpg',
      'edisuscholarship2024': 'assets/optimized/career_workshop_2.jpg',
      'saahorizon2025': 'assets/optimized/social_hub_2.jpg',
      'celebrating-migration-a-journey-of-resilience-and-opportunity': 'assets/optimized/social_group_5.jpg',
      'sexual-behaviour-in-italy': 'assets/optimized/social_hub_dsc_1829.jpg',
      'post_medical1': 'assets/optimized/social_hub_dsc_1850.jpg',
      'welcome': 'assets/optimized/social_group_1.jpg'
    };

    // Load article data from exported JSON
    async function loadArticle() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug') || 'a-complete-guide-to-living-in-turin-for-international-students';

      // Set hero image
      const heroSrc = HERO_IMAGES[slug] || 'assets/optimized/social_group_1.jpg';
      document.getElementById('articleHeroImg').src = heroSrc;

      try {
        const res = await fetch('assets/wp_exported_data.json');
        const data = await res.json();
        const posts = data.posts || [];
        
        const post = posts.find(p => p.slug === slug) || posts[0];

        if (post) {
          const cleanTitle = (post.title.rendered || 'Guide').replace(/[—–]/g, '-');
          document.getElementById('articleTitle').innerText = cleanTitle;
          document.title = cleanTitle + ' | ISOT Turin';
          document.getElementById('articleDate').innerHTML = '<i class="fa-regular fa-calendar"></i> ' + new Date(post.date).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
          
          // Clean up HTML content (fix broken images & elementor wrapper artifacts)
          let bodyHtml = post.content.rendered || '<p>Content preview available.</p>';
          
          // Replace old WP uploads URLs or broken image tags if needed
          bodyHtml = bodyHtml.replace(/src="https:\/\/isotcommunity\.com\/wp-content\/uploads\/[^"]+"/g, `src="${heroSrc}"`);

          document.getElementById('articleBody').innerHTML = bodyHtml;

          // Ensure inline images have error handlers
          document.querySelectorAll('.post-content-body img').forEach(img => {
            img.onerror = function() {
              this.src = heroSrc;
            };
          });

          // Dynamic Canonical & JSON-LD Article Schema (ISO 8601 date)
          const isoDate = post.date ? new Date(post.date).toISOString().split('T')[0] : '2026-08-22';
          const cleanDesc = (post.excerpt ? post.excerpt.rendered.replace(/<[^>]*>/g, '').replace(/[—–]/g, '-').trim() : cleanTitle);

          let canonical = document.querySelector("link[rel='canonical']");
          if (!canonical) {
            canonical = document.createElement('link');
            canonical.rel = 'canonical';
            document.head.appendChild(canonical);
          }
          canonical.href = "https://isotcommunity.com/" + slug;

          const jsonLd = {
            "@context": "https://schema.org",
            "@type": "Article",
            "headline": cleanTitle,
            "description": cleanDesc,
            "datePublished": isoDate,
            "dateModified": isoDate,
            "mainEntityOfPage": {
              "@type": "WebPage",
              "@id": "https://isotcommunity.com/" + slug
            },
            "author": {
              "@type": "Organization",
              "name": "ISOT Editorial Team",
              "url": "https://isotcommunity.com"
            },
            "publisher": {
              "@type": "Organization",
              "name": "ISOT Community",
              "logo": {
                "@type": "ImageObject",
                "url": "https://isotcommunity.com/assets/LOGOS/scritta%20isot.png"
              }
            }
          };
          const ldScript = document.createElement('script');
          ldScript.type = 'application/ld+json';
          ldScript.text = JSON.stringify(jsonLd);
          document.head.appendChild(ldScript);
        }
      } catch (err) {
        console.log('Fetching local json, rendering fallback title for slug:', slug);
        document.getElementById('articleTitle').innerText = slug.replace(/-/g, ' ').toUpperCase();
        document.getElementById('articleBody').innerHTML = '<p>This comprehensive guide provides key instructions for international students living and studying in Turin. Check back for full PDF downloadable versions.</p>';
      }
    }

    loadArticle();
  </script>
</body>
</html>
