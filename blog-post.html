<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article Reader | ISOT Turin Student Guide</title>
  <meta name="description" content="Read full guides and articles for international students in Turin on ISOT Community." />
  <link rel="icon" href="assets/LOGOS/scritta isot.png" type="image/png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root {
      --bg-dark: #0F172A;
      --bg-card: #1E293B;
      --bg-darker: #0B1120;
      --pink: #EE0979;
      --pink-glow: rgba(238, 9, 121, 0.35);
      --navy: #243673;
      --orange: #FF6A00;
      --text-main: #F8FAFC;
      --text-muted: #CBD5E1;
      --text-dim: #94A3B8;
      --border-light: rgba(255, 255, 255, 0.12);
      --font-display: 'Amatic SC', cursive, sans-serif;
      --font-body: 'Outfit', sans-serif;
      --radius-md: 20px;
      --radius-lg: 32px;
      --radius-full: 9999px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body { background-color: var(--bg-dark); color: var(--text-main); font-family: var(--font-body); line-height: 1.8; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #243673; border-radius: 9999px; }

    a { color: var(--pink); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .container { width: 100%; max-width: 900px; margin: 0 auto; padding: 0 24px; }

    .header {
      position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-light);
    }
    .nav-box { display: flex; align-items: center; justify-content: space-between; height: 80px; }
    .nav-logo img { height: 48px; width: auto; }

    .post-header { padding-top: 150px; padding-bottom: 40px; border-bottom: 1px solid var(--border-light); }
    .post-category-tag {
      display: inline-block; font-size: 0.8rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1.5px; color: var(--pink); margin-bottom: 16px;
    }
    .post-main-title { font-size: 2.8rem; font-weight: 800; color: #FFF; line-height: 1.2; margin-bottom: 20px; }
    .post-author-bar { display: flex; align-items: center; gap: 16px; font-size: 0.9rem; color: var(--text-dim); }

    .post-content-body { padding: 50px 0; font-size: 1.1rem; color: var(--text-muted); }
    .post-content-body h2 { font-size: 1.8rem; font-weight: 700; color: #FFF; margin: 30px 0 16px; }
    .post-content-body h3 { font-size: 1.4rem; font-weight: 700; color: #FFF; margin: 24px 0 12px; }
    .post-content-body p { margin-bottom: 20px; }
    .post-content-body ul, .post-content-body ol { margin-bottom: 20px; padding-left: 24px; }
    .post-content-body li { margin-bottom: 8px; }
    .post-content-body blockquote {
      border-left: 4px solid var(--pink); padding-left: 20px; margin: 30px 0;
      font-style: italic; color: #FFF; background: rgba(238,9,121,0.05); padding: 20px; border-radius: 0 var(--radius-md) var(--radius-md) 0;
    }

    .back-btn {
      display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: #FFF;
      background: rgba(255,255,255,0.05); padding: 10px 20px; border-radius: var(--radius-full);
      border: 1px solid var(--border-light); margin-bottom: 30px;
    }
    .back-btn:hover { background: var(--pink); text-decoration: none; border-color: var(--pink); }

    .footer { background: #070B14; border-top: 1px solid var(--border-light); padding: 60px 0 30px; text-align: center; }
  </style>
</head>
<body>

  <!-- Sticky Header -->
  <header class="header">
    <div class="container nav-box">
      <a href="index.html" class="nav-logo">
        <img src="assets/LOGOS/scritta isot.png" alt="ISOT Logo" />
      </a>
      <a href="blog.html" class="back-btn" style="margin-bottom:0;">← Back to Guides</a>
    </div>
  </header>

  <!-- Article Container -->
  <article class="container">
    <div class="post-header">
      <a href="blog.html" class="back-btn">← Back to All Guides</a>
      <br />
      <span class="post-category-tag" id="articleCat"><i class="fa-solid fa-book-open"></i> Student Guide</span>
      <h1 class="post-main-title" id="articleTitle">Loading Guide Title...</h1>
      <div class="post-author-bar">
        <span><i class="fa-solid fa-user-pen"></i> ISOT Editorial Team</span>
        <span>•</span>
        <span id="articleDate"><i class="fa-regular fa-calendar"></i> Published in Turin</span>
      </div>
    </div>

    <div class="post-content-body" id="articleBody">
      <p>Loading full article content...</p>
    </div>
  </article>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p style="color: var(--text-dim); font-size: 0.9rem; margin-bottom: 12px;">© 2026 ISOT Community (Associazione di Promozione Sociale) • Turin, Italy</p>
      <a href="blog.html" style="color: var(--pink); font-size: 0.9rem;">Return to All Guides & Articles →</a>
    </div>
  </footer>

  <script>
    // Load article data from exported JSON or fallback matching slug
    async function loadArticle() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug') || 'a-complete-guide-to-living-in-turin-for-international-students';

      try {
        const res = await fetch('assets/wp_exported_data.json');
        const data = await res.json();
        const posts = data.posts || [];
        
        const post = posts.find(p => p.slug === slug) || posts[0];

        if (post) {
          const cleanTitle = (post.title.rendered || 'Guide').replace(/[—–]/g, '-');
          document.getElementById('articleTitle').innerText = cleanTitle;
          document.title = cleanTitle + ' | ISOT Turin';
          document.getElementById('articleDate').innerHTML = '<i class="fa-regular fa-calendar"></i> ' + new Date(post.date).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
          document.getElementById('articleBody').innerHTML = post.content.rendered || '<p>Content preview available.</p>';

          // Dynamic Canonical & JSON-LD Article Schema (ISO 8601 date)
          const isoDate = post.date ? new Date(post.date).toISOString().split('T')[0] : '2026-08-22';
          const cleanDesc = (post.excerpt ? post.excerpt.rendered.replace(/<[^>]*>/g, '').replace(/[—–]/g, '-').trim() : cleanTitle);

          let canonical = document.querySelector("link[rel='canonical']");
          if (!canonical) {
            canonical = document.createElement('link');
            canonical.rel = 'canonical';
            document.head.appendChild(canonical);
          }
          canonical.href = "https://isotcommunity.com/" + slug;

          const jsonLd = {
            "@context": "https://schema.org",
            "@type": "Article",
            "headline": cleanTitle,
            "description": cleanDesc,
            "datePublished": isoDate,
            "dateModified": isoDate,
            "mainEntityOfPage": {
              "@type": "WebPage",
              "@id": "https://isotcommunity.com/" + slug
            },
            "author": {
              "@type": "Organization",
              "name": "ISOT Editorial Team",
              "url": "https://isotcommunity.com"
            },
            "publisher": {
              "@type": "Organization",
              "name": "ISOT Community",
              "logo": {
                "@type": "ImageObject",
                "url": "https://isotcommunity.com/assets/LOGOS/scritta%20isot.png"
              }
            }
          };
          const ldScript = document.createElement('script');
          ldScript.type = 'application/ld+json';
          ldScript.text = JSON.stringify(jsonLd);
          document.head.appendChild(ldScript);
        }
      } catch (err) {
        console.log('Fetching local json, rendering fallback title for slug:', slug);
        document.getElementById('articleTitle').innerText = slug.replace(/-/g, ' ').toUpperCase();
        document.getElementById('articleBody').innerHTML = '<p>This comprehensive guide provides key instructions for international students living and studying in Turin. Check back for full PDF downloadable versions.</p>';
      }
    }

    loadArticle();
  </script>
</body>
</html>
